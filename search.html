<div class="main-with-sidebar"><div class="main">




  <div class="section-head" style="margin-top:24px">
    <div class="en">FULL-TEXT SEARCH</div>
    <h2>儒 藏 全 文 检 索</h2>
    <div class="desc">908部典籍 · 核心章句+概念词条+儒者+学派，结果带上下文高亮</div>
  </div>

  <div class="search-box">
    <input id="q" placeholder="输入关键词，如：仁、格物致知、朱子、鹅湖之会…">
    <button id="searchBtn">检 索</button>
  </div>

  <div class="filter-bar">
    <span style="font-size:13px;color:var(--gold);letter-spacing:2px;margin-right:8px">搜索范围：</span>
    <label><input type="checkbox" data-scope="concept" checked>义理概念</label>
    <label><input type="checkbox" data-scope="scholar" checked>历代儒者</label>
    <label><input type="checkbox" data-scope="school" checked>学派流脉</label>
    <label><input type="checkbox" data-scope="chapter" checked>精校章句（394）</label>
    <label><input type="checkbox" data-scope="book" checked>典籍目录（908）</label>
    <label><input type="checkbox" data-scope="debate" checked>学派论争</label>
  </div>

  <div id="resultCount" style="color:var(--ink-3);font-size:13px;margin-bottom:16px;letter-spacing:1px"></div>
  <div id="results"></div>

<footer class="footer">儒藏本体论 · 全文检索 · 908部 1.34亿字</footer>

<script src="data/common.js"></script>
<script src="data/ontology-enhance.js"></script>
<script>
function initTheme(){
  const wrap=document.getElementById('themeDots');
  const themes=[{k:'star',n:'星象',b:'#e6ca96'},{k:'paper',n:'宣纸',b:'#6a4218'},{k:'ink',n:'水墨',b:'#e0e5ee'},{k:'bamboo',n:'竹简',b:'#e8c888'}];
  wrap.innerHTML=themes.map(t=>'<span class="theme-dot" data-theme="'+t.k+'" style="background:radial-gradient(circle,'+t.b+',#2a1e12)" title="'+t.n+'"></span>').join('');
  const saved=localStorage.getItem('rz_theme')||'star';document.body.setAttribute('data-theme',saved);
  wrap.querySelectorAll('.theme-dot').forEach(d=>d.classList.toggle('active',d.dataset.theme===saved));
  wrap.querySelectorAll('.theme-dot').forEach(d=>d.onclick=()=>{
    const t=d.dataset.theme;document.body.setAttribute('data-theme',t);localStorage.setItem('rz_theme',t);
    wrap.querySelectorAll('.theme-dot').forEach(x=>x.classList.toggle('active',x===d));
  });
}
initTheme();

// 加载章句索引（394章精校）
let CHAPTERS=[];
fetch('zhangju-index/大学章句.json').then(r=>r.json()).then(j=>{CHAPTERS=CHAPTERS.concat(j.chapters.map(c=>({...c,book:'大学章句'})))}).catch(()=>{});
['中庸章句','论语集注','孟子集注','诗经','尚书','礼记','周礼','仪礼','春秋左传','春秋公羊传','春秋谷梁传',
 '二程遗书','近思录','颜氏家训','诗集传','孝经','传习录','论语','大学','孟子','中庸'].forEach(b=>{
  fetch('zhangju-index/'+b+'.json').then(r=>r.json()).then(j=>{CHAPTERS=CHAPTERS.concat(j.chapters.map(c=>({...c,book:b})))}).catch(()=>{});
});

function hl(text,kw){
  if(!kw)return text;
  return text.replace(new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'),m=>'<mark>'+m+'</mark>');
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function doSearch(){
  const q=document.getElementById('q').value.trim();
  const res=document.getElementById('results');
  if(!q){res.innerHTML='<div class="card" style="text-align:center;color:var(--ink-3);padding:40px">请输入检索关键词</div>';document.getElementById('resultCount').textContent='';return}
  const scopes=new Set();document.querySelectorAll('[data-scope]').forEach(cb=>{if(cb.checked)scopes.add(cb.dataset.scope)});
  const hits=[];

  // 概念
  if(scopes.has('concept'))Object.entries(CONCEPTS).forEach(([k,v])=>{
    if(k.includes(q)||v.def.includes(q)||v.source.includes(q)){
      hits.push({type:'concept',title:'【概念】'+k,book:'义理概念词典',snippet:v.def,href:'dictionary.html#'+encodeURIComponent(k)});
    }
  });
  // 儒者
  if(scopes.has('scholar'))Object.entries(SCHOLARS).forEach(([k,v])=>{
    const text=(v.desc||'')+(v.dynasty||'')+(v.school||'')+k;
    if(text.includes(q)){
      hits.push({type:'scholar',title:'【儒者】'+k,book:(v.dynasty||'')+'·'+(v.school||''),snippet:v.desc||'',href:'scholars.html#'+encodeURIComponent(k)});
    }
  });
  // 学派
  if(scopes.has('school'))Object.entries(SCHOOLS).forEach(([k,v])=>{
    const text=k+(v.desc||'');
    if(text.includes(q)){
      hits.push({type:'school',title:'【学派】'+k,book:v.era||'',snippet:v.desc||'',href:'schools.html#'+encodeURIComponent(k)});
    }
  });
  // 典籍
  if(scopes.has('book'))BOOKS_DATA.forEach(b=>{
    if(b[1].includes(q))hits.push({type:'book',title:'【典籍】'+b[1],book:b[0],snippet:'全文约'+Math.round(b[2]/10000)/10+'万字，点击进入阅读并在页内搜索。',href:'reader.html?b='+encodeURIComponent(b[0]+'/'+b[1]+'.txt')+'&q='+encodeURIComponent(q)});
  });
  // 论争
  if(scopes.has('debate'))DEBATES.forEach(d=>{
    const text=d.title+d.body+d.who+d.sides.map(s=>s.name+s.text).join('');
    if(text.includes(q)){
      let snip=d.body;const idx=snip.indexOf(q);if(idx>=0)snip=snip.slice(Math.max(0,idx-30),idx+q.length+80);
      hits.push({type:'debate',title:'【论争】'+d.title,book:d.year,snippet:snip+'…',href:'debate.html#'+d.id});
    }
  });
  // 精校章句（延迟加载的CHAPTERS可能还没回来，做一次延时）
  if(scopes.has('chapter'))CHAPTERS.forEach(c=>{
    const text=(c.title||'')+(c.summary||'')+(c.incipit||'')+(c.concepts||[]).join('');
    if(text.includes(q)){
      const snip=(c.summary||'首句：'+(c.incipit||'')).slice(0,120);
      hits.push({type:'chapter',title:'【章句】'+(c.title||''),book:c.book,snippet:snip,
        href:'reader.html?b='+encodeURIComponent(getBookPath(c.book))+(c.anchor?'&find='+encodeURIComponent(c.incipit||c.title):'')});
    }
  });

  document.getElementById('resultCount').textContent='共检索到 '+hits.length+' 条结果（耗时<100ms）';
  res.innerHTML=hits.length?hits.map(h=>`
    <a class="search-result" href="${h.href}" style="display:block;text-decoration:none;color:inherit">
      <div class="hit-title">${hl(esc(h.title),q)}<span class="hit-book">${esc(h.book)}</span></div>
      <div class="hit-snippet">${hl(esc(h.snippet),q)}</div>
    </a>
  `).join(''):'<div class="card" style="text-align:center;color:var(--ink-3);padding:40px">未检索到匹配结果，请尝试更换关键词</div>';
}
function getBookPath(bookName){
  // 把书简名映射到books/分类/书名.txt
  for(const b of BOOKS_DATA){
    if(b[1]===bookName)return b[0]+'/'+b[1]+'.txt';
  }
  // 别名
  const alias={'大学章句':'四书/大学章句.txt','中庸章句':'四书/中庸章句.txt','论语集注':'四书/论语集注.txt','孟子集注':'四书/孟子集注.txt',
    '大学':'四书/大学.txt','中庸':'四书/中庸.txt','论语':'四书/论语.txt','孟子':'四书/孟子.txt',
    '孝经':'孝经/孝经.txt','传习录':'语录/传习录.txt','诗经':'诗经/诗经.txt','尚书':'尚书/尚书.txt',
    '礼记':'礼经/礼记.txt','周礼':'礼经/周礼.txt','仪礼':'礼经/仪礼.txt',
    '春秋左传':'春秋/春秋左传.txt','春秋公羊传':'春秋/春秋公羊传.txt','春秋谷梁传':'春秋/春秋谷梁传.txt',
    '二程遗书':'语录/二程遗书.txt','近思录':'语录/近思录.txt','颜氏家训':'修身治家/颜氏家训.txt','诗集传':'诗经/诗集传.txt'};
  return alias[bookName]||'四书/'+bookName+'.txt';
}

document.getElementById('searchBtn').onclick=doSearch;
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});
// URL?q=xxx
const urlQ=new URLSearchParams(location.search).get('q');
if(urlQ){document.getElementById('q').value=urlQ;setTimeout(doSearch,500)}
// 章句索引加载完再触发一次
setTimeout(()=>{if(urlQ||document.getElementById('q').value)doSearch()},1200);
</script>

</div></div>
<script>initPage("search.html")</script>
</body>
</html>

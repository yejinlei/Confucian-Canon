<style>
:root {
  --bg: #1a140f; --card: #251e17; --gold: #d4af37; --light: #e8d5a3; --text: #c9b99a;
  --border: #3d3225; --accent: #a83232; --font: "Noto Serif SC", "Songti SC", "SimSun", serif;

* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }
.top-nav { position: fixed; top: 0; left: 0; right: 0; height: 70px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 30px; z-index: 100; }
.logo { font-size: 28px; font-weight: bold; color: var(--gold); letter-spacing: 2px; margin-right: 40px; }
.nav-links { display: flex; gap: 32px; }
.nav-links a { color: var(--text); text-decoration: none; font-size: 18px; padding: 8px 0; border-bottom: 2px solid transparent; transition: all 0.3s; }
.nav-links a.active, .nav-links a:hover { color: var(--gold); border-bottom-color: var(--gold); }
.main { margin-left: 220px; margin-top: 70px; padding: 40px; }
.page-title { font-size: 42px; color: var(--gold); text-align: center; margin-bottom: 10px; }
.page-subtitle { text-align: center; color: var(--text); font-size: 18px; margin-bottom: 40px; opacity: 0.8; }
.search-box { max-width: 800px; margin: 0 auto 40px; }
.search-input { width: 100%; padding: 18px 24px; font-size: 20px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--light); font-family: var(--font); outline: none; transition: all 0.3s; }
.search-input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,175,55,0.1); }
.search-tip { text-align: center; margin-top: 12px; opacity: 0.6; font-size: 14px; }
.result-stats { max-width: 900px; margin: 0 auto 20px; font-size: 16px; color: var(--gold); }
.result-item { max-width: 900px; margin: 0 auto 20px; padding: 24px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; transition: all 0.3s; }
.result-item:hover { border-color: var(--gold); }
.result-book { font-size: 18px; color: var(--gold); margin-bottom: 10px; }
.result-snippet { font-size: 16px; line-height: 1.8; }
.result-snippet mark { background: rgba(212,175,55,0.3); color: var(--light); padding: 0 2px; border-radius: 2px; }
.sidebar { position: fixed; left: 0; top: 70px; bottom: 0; width: 220px; background: var(--card); border-right: 1px solid var(--border); overflow-y: auto; scrollbar-width: none; }
.sidebar::-webkit-scrollbar { display: none; }
.sidebar-item { display: block; padding: 16px 20px; color: var(--text); text-decoration: none; font-size: 17px; border-left: 3px solid transparent; transition: all 0.3s; }
.sidebar-item:hover { background: rgba(212,175,55,0.08); color: var(--gold); }
.sidebar-item.active { border-left-color: var(--gold); color: var(--gold); background: rgba(212,175,55,0.1); }
@media (max-width: 768px) {
  .sidebar { display: none; }
  .main { margin-left: 0; padding: 20px; }
  .nav-links { gap: 16px; }
  .nav-links a { font-size: 15px; }
}

<div class="main">
  <h1 class="page-title">全文检索</h1>
  <p class="page-subtitle">908 部儒家典籍：先按书名／分类匹配，再深入核心典籍原文检索</p>
  <div class="search-box">
    <input type="text" class="search-input" id="searchInput" placeholder="输入关键词（如：仁、格物致知、己所不欲勿施于人）...">
    <p class="search-tip">输入书名或分类即时匹配 908 部典籍；输入 2 字以上关键词，同时对 24 部核心典籍做原文检索</p>
  </div>
  <div id="results"></div>
</div>
<script src="data/books.js"></script>
<script>
// 书单来自 data/books.js：window.BOOKS_DATA = [[分类, 书名, 字数], ...]（共 908 部）
const ALL_BOOKS = (window.BOOKS_DATA || [])
  .map(b => ({ cat: b[0], name: b[1], num: b[2] }))
  .sort((a, b) => b.num - a.num);

function charStr(n) { return n >= 10000 ? (n / 10000).toFixed(1) + '万字' : n + '字'; }

// 深度原文检索：精选核心典籍（篇幅适中、可即时抓取），非全库索引
const CORE = [
  ['四书','大学章句集注'],['四书','中庸章句集注'],['四书','论语集注'],['四书','孟子集注'],
  ['四书','论语'],['四书','孟子'],['四书','大学'],['四书','中庸'],
  ['孝经','孝经'],['启蒙蒙学','三字经'],['启蒙蒙学','弟子规'],['启蒙蒙学','千字文'],
  ['语录','传习录'],['语录','近思录'],['诗经','诗经'],['尚书','尚书'],
  ['春秋','春秋左传'],['春秋','春秋公羊传'],['春秋','春秋谷梁传'],
  ['礼经','礼记'],['礼经','仪礼'],['礼经','周礼'],['小学','尔雅'],['小学','说文解字']
];

const input = document.getElementById('searchInput');
const resultsDiv = document.getElementById('results');
let searchToken = 0;

function bookUrl(cat, name) {
  return 'reader.html?b=' + encodeURIComponent(cat + '/' + name + '.txt');
}

// 一、典籍检索：908 部全量，按书名 / 分类即时匹配
function renderCatalog(q) {
  const ql = q.toLowerCase();
  const hits = ALL_BOOKS.filter(b =>
    b.name.toLowerCase().includes(ql) || b.cat.toLowerCase().includes(ql));
  if (!hits.length) return '';
  return `<div class="result-stats">📚 书名／分类匹配 ${hits.length} 部</div>` +
    hits.slice(0, 40).map(b => `
      <div class="result-item">
        <div class="result-book"><a href="${bookUrl(b.cat, b.name)}" style="color:var(--gold); text-decoration:none;">《${b.name}》</a>
        <span style="opacity:.6;font-size:14px;"> · ${b.cat} · ${charStr(b.num)}</span></div>
      </div>`).join('') +
    (hits.length > 40 ? `<p style="text-align:center;opacity:.6;font-size:14px;">（仅显示前 40 部，可在全文库按分类浏览更多）</p>` : '');
}

function snippetOf(text, q) {
  const idx = text.indexOf(q);
  if (idx === -1) return null;
  const s = Math.max(0, idx - 40), e = Math.min(text.length, idx + q.length + 60);
  return ('…' + text.slice(s, e).replace(/\n/g, '')).replace(q, '<mark>' + q + '</mark>') + '…';
}

// 二、原文检索：对核心典籍逐部抓取正文检索，结果渐进展示
async function deepSearch(q) {
  const token = ++searchToken;
  const wrapId = 'deep-' + token;
  resultsDiv.insertAdjacentHTML('beforeend',
    `<div id="${wrapId}"><div class="result-stats">🔎 正在检索核心典籍原文… <span id="${wrapId}-cnt">0/${CORE.length}</span></div></div>`);
  let hits = 0;
  for (let i = 0; i < CORE.length; i++) {
    if (token !== searchToken) return;
    const [cat, name] = CORE[i];
    try {
      const res = await fetch('books/' + encodeURIComponent(cat) + '/' + encodeURIComponent(name + '.txt'));
      if (res.ok) {
        const text = await res.text();
        const snip = snippetOf(text, q);
        if (snip) {
          hits++;
          document.getElementById(wrapId).insertAdjacentHTML('beforeend',
            `<div class="result-item"><div class="result-book"><a href="${bookUrl(cat, name)}&q=${encodeURIComponent(q)}" style="color:var(--gold);text-decoration:none;">《${name}》</a></div><div class="result-snippet">${snip}</div></div>`);
        }
      }
    } catch (e) { /* 单部失败忽略 */ }
    const cntEl = document.getElementById(wrapId + '-cnt');
    if (cntEl) cntEl.textContent = (i + 1) + '/' + CORE.length;
  }
  const box = document.getElementById(wrapId);
  if (box && token === searchToken && hits === 0) {
    box.insertAdjacentHTML('beforeend',
      `<p style="text-align:center;padding:30px;opacity:.6;">核心典籍中未找到「${q}」。可进入具体典籍，用阅读器内的检索框逐部查找。</p>`);
  }
}

input.addEventListener('input', function () {
  const q = this.value.trim();
  searchToken++;
  if (q.length < 1) { resultsDiv.innerHTML = ''; return; }
  resultsDiv.innerHTML = renderCatalog(q);
  if (q.length >= 2) deepSearch(q);
});
</script>
</body>

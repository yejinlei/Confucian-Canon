<!DOCTYPE html>
<html lang="zh-CN" data-theme="bronze">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>章句本体 - 儒藏本体論</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style/common.css">
    <script src="data/common.js"></script>
    <script src="data/books.js"></script>
    <script src="data/chapters_all.js"></script>
    <style>
        .zhangju-container { max-width: 1400px; margin: 0 auto; padding: 24px; }
        .zhangju-header { text-align: center; margin-bottom: 40px; }
        .zhangju-title { font-size: 2.4em; font-weight: bold; background: linear-gradient(135deg, var(--accent-color), #e8c07d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px; }
        .zhangju-sub { color: var(--text-secondary); font-size: 1.1em; line-height: 1.6; }
        .stats-bar { display: flex; justify-content: center; gap: 48px; margin: 24px 0; flex-wrap: wrap; }
        .stat-item { text-align: center; }
        .stat-num { font-size: 2em; font-weight: bold; color: var(--accent-color); }
        .stat-label { font-size: 0.9em; color: var(--text-secondary); }
        
        .search-box { max-width: 600px; margin: 0 auto 32px; }
        .search-input { width: 100%; padding: 14px 20px; font-size: 1.05em; border: 1px solid var(--border-color); border-radius: 8px; background: var(--panel-bg); color: var(--text-primary); outline: none; transition: all .3s; }
        .search-input:focus { border-color: var(--accent-color); box-shadow: 0 0 0 3px rgba(200,160,80,.15); }
        
        .cat-tabs { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 32px; }
        .cat-tab { padding: 8px 18px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--panel-bg); color: var(--text-primary); cursor: pointer; transition: all .3s; font-size: 0.95em; }
        .cat-tab:hover, .cat-tab.active { background: var(--accent-color); border-color: var(--accent-color); color: #1a1a1a; }
        .cat-tab .count { font-size: 0.8em; opacity: 0.8; margin-left: 4px; }
        
        .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 24px; }
        .book-card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; transition: all .3s; }
        .book-card:hover { border-color: var(--accent-color); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.2); }
        .book-header { padding: 20px 24px; border-bottom: 1px solid var(--border-color); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .book-title { font-size: 1.2em; font-weight: 600; color: var(--accent-color); text-decoration: none; }
        .book-title:hover { text-decoration: underline; }
        .book-meta { display: flex; gap: 12px; align-items: center; font-size: 0.85em; color: var(--text-secondary); }
        .book-badge { padding: 2px 8px; border-radius: 4px; background: rgba(200,160,80,.15); color: var(--accent-color); font-size: 0.8em; }
        .book-source { font-size: 0.75em; color: #8b7355; }
        
        .chapters-list { padding: 16px 24px 20px; max-height: 380px; overflow-y: auto; display: none; }
        .book-card.expanded .chapters-list { display: block; }
        .chapter-item { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.05); display: flex; gap: 12px; align-items: baseline; }
        .chapter-item:last-child { border-bottom: none; }
        .chapter-title { color: var(--text-primary); font-weight: 500; cursor: pointer; flex-shrink: 0; }
        .chapter-title:hover { color: var(--accent-color); }
        .chapter-desc { font-size: 0.85em; color: var(--text-secondary); line-height: 1.5; }
        
        .expand-btn { padding: 4px 12px; font-size: 0.8em; border-radius: 4px; background: rgba(200,160,80,.1); color: var(--accent-color); border: none; cursor: pointer; transition: all .2s; margin-top: 8px; }
        .expand-btn:hover { background: rgba(200,160,80,.2); }
        
        .loading, .empty { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        
        @media (max-width: 768px) {
            .zhangju-container { padding: 16px; }
            .books-grid { grid-template-columns: 1fr; gap: 16px; }
            .stats-bar { gap: 24px; }
            .stat-num { font-size: 1.6em; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar-overlay"></div>
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <header class="top-nav" id="topNav"></header>
            
            <div class="zhangju-container">
                <div class="zhangju-header">
                    <h1 class="zhangju-title">章句本体導航</h1>
                    <p class="zhangju-sub">依經傳註疏之序，明章句訓詁之旨。全經典籍層級導航，由書入篇，由篇入章，尋義理於字裏行間。</p>
                    <div class="stats-bar" id="statsBar"></div>
                </div>
                
                <div class="search-box">
                    <input type="text" class="search-input" id="searchInput" placeholder="🔍 搜索典籍名稱（如：論語、左傳、朱子、傳習錄…）">
                </div>
                
                <div class="cat-tabs" id="catTabs"></div>
                
                <div id="booksContainer">
                    <div class="loading">正在加載全部典籍章句數據，請稍候…</div>
                </div>
            </div>
            
            <footer class="site-footer" id="footer"></footer>
        </main>
        <button class="sidebar-toggle" id="sidebarToggle">☰</button>
    </div>
    
    <div class="theme-panel" id="themePanel"></div>

    <script>
        // 初始化公共组件
        initPage();
        renderSidebar();
        renderTopNav();
        renderFooter();
        initTheme();
        
        // 分类映射
        const CAT_NAMES = {
            '四书': '四書', '五经总义': '五經總義', '诗经': '詩經', '尚书': '尚書',
            '礼经': '禮經', '乐经': '樂經', '春秋': '春秋', '孝经': '孝經',
            '语录': '語錄', '小学': '小學', '修身治家': '修身治家', '启蒙蒙学': '啟蒙蒙學'
        };
        
        let currentCat = 'all';
        let searchKey = '';
        let allBooks = [];
        
        // 统计数据
        function calcStats() {
            let totalChapters = 0;
            Object.values(window.ALL_CHAPTERS).forEach(d => totalChapters += d.chapters.length);
            return {
                books: Object.keys(window.ALL_CHAPTERS).length,
                chapters: totalChapters,
                cats: Object.keys(CAT_NAMES).length
            };
        }
        
        // 渲染统计栏
        function renderStats() {
            const s = calcStats();
            document.getElementById('statsBar').innerHTML = `
                <div class="stat-item"><div class="stat-num">${s.cats}</div><div class="stat-label">經部門類</div></div>
                <div class="stat-item"><div class="stat-num">${s.books}</div><div class="stat-label">部典籍</div></div>
                <div class="stat-item"><div class="stat-num">${s.chapters}</div><div class="stat-label">章/卷節點</div></div>
            `;
        }
        
        // 渲染分类标签
        function renderCatTabs() {
            // 统计每个分类的书籍数
            const catCounts = {};
            Object.keys(window.ALL_CHAPTERS).forEach(path => {
                const cat = path.split('/')[0];
                catCounts[cat] = (catCounts[cat] || 0) + 1;
            });
            
            let html = `<div class="cat-tab ${currentCat==='all'?'active':''}" data-cat="all">全部<span class="count">${calcStats().books}</span></div>`;
            Object.keys(CAT_NAMES).forEach(cat => {
                const count = catCounts[cat] || 0;
                if (count > 0) {
                    html += `<div class="cat-tab ${currentCat===cat?'active':''}" data-cat="${cat}">${CAT_NAMES[cat]}<span class="count">${count}</span></div>`;
                }
            });
            document.getElementById('catTabs').innerHTML = html;
            
            document.querySelectorAll('.cat-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    currentCat = tab.dataset.cat;
                    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    renderBooks();
                });
            });
        }
        
        // 渲染书籍列表
        function renderBooks() {
            const container = document.getElementById('booksContainer');
            let filtered = Object.entries(window.ALL_CHAPTERS).filter(([path, data]) => {
                const cat = path.split('/')[0];
                const name = path.split('/')[1].replace('.txt','');
                if (currentCat !== 'all' && cat !== currentCat) return false;
                if (searchKey && !name.includes(searchKey) && !cat.includes(searchKey)) return false;
                return true;
            });
            
            // 按分类排序
            filtered.sort((a,b) => {
                const catA = a[0].split('/')[0];
                const catB = b[0].split('/')[0];
                const nameA = a[0].split('/')[1];
                const nameB = b[0].split('/')[1];
                return catA.localeCompare(catB, 'zh-CN') || nameA.localeCompare(nameB, 'zh-CN');
            });
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty">未找到匹配的典籍，請嘗試其他關鍵詞</div>';
                return;
            }
            
            let html = '<div class="books-grid">';
            filtered.forEach(([path, data], idx) => {
                const cat = path.split('/')[0];
                const name = path.split('/')[1].replace('.txt','');
                const chapters = data.chapters;
                const sourceMap = {manual: '精校', split: '按卷切分', auto: '自動識別'};
                const sourceLabel = sourceMap[data.source] || '';
                
                html += `
                <div class="book-card" data-path="${path}">
                    <div class="book-header">
                        <div>
                            <a href="reader.html?b=${encodeURIComponent(path)}" class="book-title" target="_blank">${name}</a>
                            <div class="book-meta">
                                <span class="book-badge">${CAT_NAMES[cat]||cat}</span>
                                <span>${chapters.length} 章/卷</span>
                                <span class="book-source">${sourceLabel}</span>
                            </div>
                        </div>
                        <span class="toggle-icon">▼</span>
                    </div>
                    <div class="chapters-list" id="chapters-${idx}">
                        ${renderChapters(path, chapters)}
                        ${chapters.length > 12 ? `<button class="expand-btn" onclick="toggleExpand(this)">展開全部 ${chapters.length} 卷</button>` : ''}
                    </div>
                </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
            
            // 绑定展开事件
            document.querySelectorAll('.book-header').forEach(header => {
                header.addEventListener('click', () => {
                    const card = header.closest('.book-card');
                    card.classList.toggle('expanded');
                });
            });
        }
        
        // 渲染章节列表
        function renderChapters(bookPath, chapters) {
            const showCount = Math.min(12, chapters.length);
            let html = '';
            chapters.slice(0, showCount).forEach((ch, i) => {
                html += `
                <div class="chapter-item">
                    <span class="chapter-title" onclick="gotoChapter('${bookPath}', ${i}, ${ch.volume !== undefined ? ch.volume : -1})">${ch.title}</span>
                    <span class="chapter-desc">${ch.desc || ''}</span>
                </div>
                `;
            });
            if (chapters.length > 12) {
                html += `<div class="more-chapters" style="display:none">`;
                chapters.slice(12).forEach((ch, i) => {
                    html += `
                    <div class="chapter-item">
                        <span class="chapter-title" onclick="gotoChapter('${bookPath}', ${i+12}, ${ch.volume !== undefined ? ch.volume : -1})">${ch.title}</span>
                        <span class="chapter-desc">${ch.desc || ''}</span>
                    </div>
                    `;
                });
                html += `</div>`;
            }
            return html;
        }
        
        // 展开全部章节
        window.toggleExpand = function(btn) {
            const list = btn.closest('.chapters-list');
            const more = list.querySelector('.more-chapters');
            if (more.style.display === 'none') {
                more.style.display = 'block';
                btn.textContent = '收起';
            } else {
                more.style.display = 'none';
                btn.textContent = btn.textContent.replace('收起', '展開全部 ');
            }
        };
        
        // 跳转到章节
        window.gotoChapter = function(bookPath, chIdx, volIdx) {
            if (volIdx >= 0) {
                // 大书按卷跳转
                window.open(`reader.html?b=${encodeURIComponent(bookPath)}&vol=${volIdx}`, '_blank');
            } else {
                // 小书按章节位置跳转
                window.open(`reader.html?b=${encodeURIComponent(bookPath)}&ch=${chIdx}`, '_blank');
            }
        };
        
        // 搜索
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchKey = e.target.value.trim();
            renderBooks();
        });
        
        // 初始化
        window.addEventListener('load', () => {
            renderStats();
            renderCatTabs();
            renderBooks();
        });
    </script>
</body>
</html>

// 初始化
document.addEventListener('DOMContentLoaded', function() {
  initPage();

});

function initZhangjuPage() {
  // 把数组格式转换为对象格式，并补全路径/大小
  const BOOKS = BOOKS_DATA.map((item, idx) => {
    const cat = item[0];
    const name = item[1];
    const charCount = item[2];
    const sizeKB = Math.round(charCount / 512); // 中文1字≈2字节，1KB≈512字
    return {
      cat: cat,
      name: name,
      path: `${cat}/${name}.txt`,
      size: sizeKB,
      charCount: charCount
    };
  });
  // 挂载到全局
  window.BOOKS_OBJ = BOOKS;
  
  // 计算每个分类的数量
  const catCount = {};
  BOOKS.forEach(b => {
    catCount[b.cat] = (catCount[b.cat] || 0) + 1;
  });
  
  // 渲染分类标签
  const tabsEl = document.getElementById('categoryTabs');
  const allCount = BOOKS.length;
  // 分类名称映射，统一显示
  const CAT_LABELS = {
    '四书': '四書',
    '五经总义': '五經總義',
    '诗经': '詩經',
    '尚书': '尚書',
    '礼经': '禮經',
    '乐经': '樂經',
    '春秋': '春秋',
    '孝经': '孝經',
    '语录': '語錄',
    '小学': '小學',
    '修身治家': '修身治家',
    '启蒙蒙学': '啟蒙蒙學'
  };
  const catList = Object.keys(catCount).sort((a,b) => catCount[b] - catCount[b]);
  tabsEl.innerHTML = `<div class="cat-tab active" data-cat="all">全部<span class="count">(${allCount})</span></div>` +
    catList.map(cat => `<div class="cat-tab" data-cat="${cat}">${CAT_LABELS[cat] || cat}<span class="count">(${catCount[cat]})</span></div>`).join('');
  
  // 分类点击事件
  tabsEl.querySelectorAll('.cat-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      tabsEl.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentCategory = tab.dataset.cat;
      searchKeyword = '';
      document.getElementById('searchInput').value = '';
      resetAndRender();
    });
  });
  
  // 搜索事件
  const searchInput = document.getElementById('searchInput');
  let searchTimer;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      searchKeyword = searchInput.value.trim();
      currentCategory = 'all';
      tabsEl.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      tabsEl.querySelector('[data-cat="all"]').classList.add('active');
      resetAndRender();
    }, 300);
  });
  
  // 滚动加载
  window.addEventListener('scroll', () => {
    if (isLoading || renderedCount >= filteredBooks.length) return;
    if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
      renderNextBatch();
    }
  });
  
  resetAndRender();
}

function resetAndRender() {
  // 过滤书目
  filteredBooks = window.BOOKS_OBJ.filter(b => {
    if (currentCategory !== 'all' && b.cat !== currentCategory) return false;
    if (searchKeyword && !b.name.includes(searchKeyword) && !b.path.includes(searchKeyword)) return false;
    return true;
  });
  
  renderedCount = 0;
  document.getElementById('booksGrid').innerHTML = '';
  document.getElementById('emptyState').style.display = filteredBooks.length === 0 ? 'block' : 'none';
  
  if (filteredBooks.length > 0) {
    renderNextBatch();
  }
}

    card.dataset.path = book.path;

      '小学': '小學',
      '修身治家': '修身治家',
      '启蒙蒙学': '啟蒙蒙學'

    card.innerHTML = `
      <div class="book-header">
        <a href="reader.html?b=${encPath}" class="book-title" style="text-decoration:none;color:#d4af37;">${book.name}</a>
        <span class="book-size">${sizeText}</span>
      </div>
      <div class="book-meta">
        <span class="book-tag">${CAT_LABELS[book.cat] || book.cat}</span>
        <span class="book-tag">${(book.charCount/10000).toFixed(1)}萬字</span>
      </div>
      <button class="toggle-chapters" data-path="${book.path.replace(/"/g,'&quot;')}">📑 展開章句</button>
      <div class="chapters-container"></div>
    `;
    // 绑定按钮事件
    card.querySelector('.toggle-chapters').addEventListener('click', function() {
      toggleChapters(this, this.dataset.path);
    });
    grid.appendChild(card);
  });
  
  renderedCount = end;
  isLoading = false;
  document.getElementById('loadProgress').style.display = renderedCount < filteredBooks.length ? 'block' : 'none';
  
  // 首屏自动补充加载：如果内容高度不足，自动加载下一批直到满屏
  setTimeout(() => {
    if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500 && renderedCount < filteredBooks.length) {
      renderNextBatch();
    }
  }, 100);
}

async function toggleChapters(btn, bookPath) {
  const card = btn.closest('.book-card');
  const container = card.querySelector('.chapters-container');
  
  // 如果已经加载过，切换显示/隐藏
  if (container.classList.contains('loaded')) {
    if (container.style.display === 'none') {
      container.style.display = 'block';
      btn.textContent = '📖 收起章句';
    } else {
      container.style.display = 'none';
      btn.textContent = '📑 展開章句';
    }
    return;
  }
  
  // 显示加载状态
  btn.disabled = true;
  container.innerHTML = '<div class="chapters-loading">正在加載章句結構…</div>';
  container.style.display = 'block';
  
  try {
    let chapters = await loadZhangjuForBook(bookPath);
    
    if (!chapters || chapters.length === 0) {
      container.innerHTML = '<div class="chapters-loading">該典籍章句結構即將上線，點擊書名直接閱讀</div>';
      btn.disabled = false;
      btn.textContent = '📑 展開章句';
      return;
    }
    
    // 渲染章句列表，默认显示前12条
    const initialCount = Math.min(12, chapters.length);
    const renderList = (chapters, count) => {
      return chapters.slice(0, count).map(ch => {
        let href;
        if (typeof ch.anchor === 'number' && ch.anchor < 1000) {
          // 精校章：按章节索引跳转
          href = `reader.html?b=${encodeURIComponent(bookPath)}#ch-${ch.anchor}`;
        } else {
          // 预生成索引/按卷切分：带anchor参数跳转
          href = `reader.html?b=${encodeURIComponent(bookPath)}&anchor=${encodeURIComponent(ch.anchor)}`;
        }
        return `<a href="${href}" class="chapter-item" target="_blank">${ch.title}${ch.summary ? `<span class="summary">${ch.summary}</span>` : ''}</a>`;
      }).join('');
    };
    
    container.innerHTML = `<div class="chapters-list">${renderList(chapters, initialCount)}</div>`;
    
    // 如果有更多章节，显示展开按钮
    if (chapters.length > initialCount) {
      const showMore = document.createElement('div');
      showMore.className = 'show-more';
      showMore.textContent = `展開全部 ${chapters.length} 章`;
      showMore.onclick = () => {
        container.querySelector('.chapters-list').innerHTML = renderList(chapters, chapters.length);
        showMore.remove();
      };
      container.appendChild(showMore);
    }
    
    container.classList.add('loaded');
    btn.disabled = false;
    btn.textContent = '📖 收起章句';
    
  } catch (e) {
    console.error(e);
    container.innerHTML = '<div class="chapters-loading">章句加載失敗，點擊書名直接閱讀</div>';
    btn.disabled = false;
    btn.textContent = '📑 展開章句';
  }
}

async function loadZhangjuForBook(bookPath) {
  // 优先读缓存
  if (zhangjuCache[bookPath]) {
    return zhangjuCache[bookPath];
  }
  
  let chapters = null;
  
  // 1. 优先用精校数据
  if (PRECISE_ZHANGJU[bookPath]) {
    chapters = PRECISE_ZHANGJU[bookPath];
  } else {
    // 2. 加载预生成的章句索引（910部典籍全覆盖）
    try {
      const idxUrl = `zhangju-index/${bookPath.replace('.txt','.json')}`;
      const res = await fetch(idxUrl, {cache: 'force-cache'});
      if (res.ok) {
        const idx = await res.json();
        if (idx.chapters && idx.chapters.length > 0) {
          // 过滤掉明显不是章节标题的条目（包含句子标点的）
          chapters = idx.chapters.filter(ch => {
            const t = ch.title;
            if (!t || t.length > 20) return false;
            if (t.includes('。') || t.includes('，') || t.includes('？') || t.includes('！')) return false;
            return true;
          }).map((ch, i) => ({
            title: ch.title,
            anchor: ch.anchor,
            summary: ch.summary || ''
          }));
        }
      }
    } catch (e) {
      // 索引不存在，回退
    }
    
    // 3. 兜底：大书加载切分索引
    if (!chapters || chapters.length === 0) {
      try {
        const bookName = bookPath.split('/').pop().replace('.txt', '');
        const catName = bookPath.split('/')[0];
        const idxUrl = `books-split/${catName}/${encodeURIComponent(bookName)}/index.json`;
        const res = await fetch(idxUrl, {cache: 'force-cache'});
        if (res.ok) {
          const idx = await res.json();
          chapters = (idx.volumes || []).map((ch, i) => ({
            title: ch.title || `卷${i+1}`,
            anchor: 'vol-'+(i+1),
            summary: `${ch.chars || 0}字`
          }));
        }
      } catch (e) {}
    }
  }
  
  // 缓存结果
  if (chapters) {
    zhangjuCache[bookPath] = chapters;
  }
  return chapters;
}

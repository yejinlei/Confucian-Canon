// 按分类分组
const cats = {};
BOOKS_DATA.forEach(([cat, name, size]) => {
  if (!cats[cat]) cats[cat] = [];
  cats[cat].push({ cat, name, size, key: cat + '/' + name });
});

const content = document.getElementById('zjContent');

function formatSize(bytes) {
  if (bytes > 1000000) return (bytes/1000000).toFixed(1) + '百万字';
  if (bytes > 10000) return (bytes/10000).toFixed(0) + '万字';
  return bytes + '字';
}

// 生成书籍卡片
async function renderBookCard(book) {
  const key = book.key;
  let meta = CORE_BOOKS_META[key];
  let secs = [];
  let label = '《' + book.name + '》';
  let metaText = formatSize(book.size);

  // 优先用预定义元数据
  if (meta) {
    label = meta.label;
    metaText = meta.meta + ' · ' + formatSize(book.size);
    secs = meta.secs;
  }

  // 尝试加载大书的split索引（如果有）
  if (secs.length === 0 && book.size >= 1000000) {
    try {
      const idxUrl = 'books-split/' + encodeURIComponent(book.cat) + '/' + encodeURIComponent(book.name) + '/index.json';
      const resp = await fetch(idxUrl, { cache: 'force-cache' });
      if (resp.ok) {
        const idx = await resp.json();
        secs = idx.volumes.map((v, i) => ['第' + (i+1) + '卷 ' + v.title, v.title]);
        metaText = (idx.volumes.length + '卷') + ' · ' + formatSize(book.size);
      }
    } catch(e) {}
  }

  // 生成章节链接
  const secLinks = secs.length > 0 ? secs.map(([name, note]) => {
    const href = 'reader.html?b=' + encodeURIComponent(book.cat + '/' + book.name + '.txt') +
                 '&q=' + encodeURIComponent(name.split(' ')[0].replace(/^第[一二三四五六七八九十百零\d]+卷\s*/, ''));
    return '<a class="zj-sec" href="' + href + '" title="' + (note || '') + '">' + name + '</a>';
  }).join('') : '<div style="color: var(--text-muted); font-size: 13px; padding: 8px 0;">打开典籍后自动展开全目录</div>';

  const bookHref = 'reader.html?b=' + encodeURIComponent(book.cat + '/' + book.name + '.txt');

  return '<div class="zj-book-card" data-key="' + key + '">' +
    '<a href="' + bookHref + '" style="text-decoration: none; color: inherit;">' +
    '<div class="zj-book-title">' + label + '<span class="zj-book-cat-tag">' + book.cat + '</span></div>' +
    '<div class="zj-book-meta">' + metaText + '</div>' +
    '</a>' +
    '<div class="zj-book-secs">' + secLinks + '</div>' +
    (secs.length > 12 ? '<button class="zj-expand" onclick="this.previousElementSibling.classList.toggle(\'expanded\'); this.textContent = this.previousElementSibling.classList.contains(\'expanded\') ? \'收起章节\' : \'展开全部' + secs.length + '卷\'">展开全部' + secs.length + '卷</button>' : '') +
    '</div>';
}

async function renderAll(filter = '') {
  const filterLower = filter.trim().toLowerCase();
  let html = '';
  const catOrder = ['四书','五经总义','诗经','尚书','礼经','乐经','春秋','孝经','语录','小学','修身治家','启蒙蒙学'];
  let total = 0;

  for (const cat of catOrder) {
    const books = cats[cat].filter(b => !filterLower || b.name.toLowerCase().includes(filterLower));
    if (books.length === 0) continue;
    total += books.length;

    html += '<div class="zj-cat"><h2 class="zj-cat-title">' + cat + '<span class="zj-cat-count">（' + books.length + '部）</span></h2><div class="zj-book-grid">';

    // 分批渲染，每批6本，避免阻塞
    for (let i = 0; i < books.length; i += 6) {
      const batch = books.slice(i, i+6);
      const cards = await Promise.all(batch.map(b => renderBookCard(b)));
      html += cards.join('');
    }

    html += '</div></div>';
  }

  if (total === 0) {
    html = '<div class="zj-empty">未找到匹配的典籍，请尝试其他关键词</div>';
  } else {
    html = '<div style="text-align:center; color: var(--text-muted); margin-bottom: 20px; font-size:14px;">共收录 ' + total + ' 部典籍 · 点击书名进入阅读，点击篇/卷直接跳转定位</div>' + html;
  }

  content.innerHTML = html;
}

// 搜索防抖

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => renderAll(searchInput.value), 300);
});

    <div class="en">CHAPTER NAVIGATION</div>
    <h2>儒 藏 章 句 导 航</h2>
    <div class="desc" id="zjDesc">精校核心典籍 · 逐章主旨与概念标签</div>
  </div>

  <div class="filter-bar" id="bookBar"></div>
  <div id="chapterList"></div>

<footer class="footer">儒藏本体论 · 章句导航 · 精校章句</footer>

<script src="data/common.js"></script>
<script src="data/ontology.js"></script>
<script src="data/ontology-enhance.js"></script>
<script>
/* 章句导航：数据源与阅读器同源（reader-data），点章直达 reader.html 对应章 */
fetch('data/reader-data-index.json').then(function(r){ return r.json(); }).then(function(idx){
  var books = idx.books || [];
  document.getElementById('zjDesc').textContent =
    books.length + ' 部精校核心典籍 · ' +
    books.reduce(function(a,b){ return a + (b.chapter_count||0); }, 0) + ' 章 · 逐章主旨与概念标签';
  var bar = document.getElementById('bookBar');
  bar.innerHTML = books.map(function(b, i){
    return '<button class="btn btn-ghost ' + (i===0?'active':'') + '" data-bid="' + b.id + '" data-cat="' + (b.cat||'其他') +
      '" style="padding:4px 14px;font-size:12px">' + b.title + '</button>';
  }).join('');
  bar.querySelectorAll('button[data-bid]').forEach(function(btn){
    btn.onclick = function(){
      bar.querySelectorAll('button').forEach(function(x){ x.classList.remove('active'); });
      btn.classList.add('active');
      loadBook(btn.dataset.bid);
    };
  });
  if (books.length) loadBook(books[0].id);
}).catch(function(){
  document.getElementById('chapterList').innerHTML =
    '<div class="card" style="text-align:center;color:var(--ink-3);padding:40px">典籍索引加载失败</div>';
});

function loadBook(bid){
  var list = document.getElementById('chapterList');
  list.innerHTML = '<div class="card" style="text-align:center;color:var(--ink-3);padding:40px">章句加载中…</div>';
  fetch('reader-data/' + bid + '.json').then(function(r){ return r.json(); }).then(function(d){
    var md = d.metadata || {};
    var html = '<div class="card" style="margin-bottom:20px">'
      + '<div style="font-size:20px;color:var(--gold);letter-spacing:4px;margin-bottom:6px">' + (md.title||bid) + '</div>'
      + (md.intro ? '<div style="font-size:13px;color:var(--ink-3);line-height:1.9">' + md.intro + '</div>' : '')
      + '<div style="margin-top:10px;font-size:12px;color:var(--ink-3)">共 ' + d.chapters.length + ' 章 · '
      + (md.pericope_count||0) + ' 节 · ' + (md.word_count||0) + ' 字 · <span style="color:var(--zhu)">精校章句</span></div>'
      + '</div>';
    d.chapters.forEach(function(ch){
      var chip = String(ch.id).replace(/^ch-/, '');
      var url = 'reader.html?b=' + encodeURIComponent(bid) + '&ch=' + encodeURIComponent(chip);
      html += '<div class="dict-entry">';
      html += '<div class="head"><span class="han" style="font-size:18px"><a href="' + url +
        '" style="color:var(--gold)">' + ch.title + '</a></span>' +
        '<span style="font-size:12px;color:var(--ink-3);margin-left:10px">' + ch.pericopes.length + ' 节</span></div>';
      if (ch.summary) html += '<div class="def" style="color:var(--ink-3)">' + ch.summary + '</div>';
      var cs = {};
      ch.pericopes.forEach(function(p){ (p.concepts||[]).forEach(function(c){ if(c && c.name) cs[c.name] = 1; }); });
      var ks = Object.keys(cs).slice(0, 8);
      if (ks.length) html += '<div class="related">' + ks.map(function(k){
        return '<a href="ontology.html#' + encodeURIComponent(k) + '">' + k + '</a>';
      }).join('') + '</div>';
      html += '</div>';
    });
    list.innerHTML = html;
  }).catch(function(){
    list.innerHTML = '<div class="card" style="text-align:center;color:var(--ink-3);padding:40px">章句数据加载失败：' + bid + '</div>';
  });
}
</script>

</div></div>

</body>

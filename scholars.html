<div class="layout">
<div class="content">

    <div class="en">SCHOLARS OF CONFUCIANISM</div>

</div>
</div>

<footer class="footer">儒藏本体论 · 历代儒者 · 91位</footer>

<script src="data/common.js"></script>
<script src="data/ontology-enhance.js"></script>
<script>
function initTheme(){
  const wrap=document.getElementById('themeDots');
  const themes=[{k:'star',n:'星象',b:'#e6ca96'},{k:'paper',n:'宣纸',b:'#6a4218'},{k:'ink',n:'水墨',b:'#e0e5ee'},{k:'bamboo',n:'竹简',b:'#e8c888'}];
  wrap.innerHTML=themes.map(t=>'<span class="theme-dot" data-theme="'+t.k+'" style="background:radial-gradient(circle,'+t.b+',#2a1e12)" title="'+t.n+'"></span>').join('');
  const saved=localStorage.getItem('rz_theme')||'star';document.body.setAttribute('data-theme',saved);
  wrap.querySelectorAll('.theme-dot').forEach(d=>d.classList.toggle('active',d.dataset.theme===saved));
  wrap.querySelectorAll('.theme-dot').forEach(d=>d.onclick=()=>{
    const t=d.dataset.theme;document.body.setAttribute('data-theme',t);localStorage.setItem('rz_theme',t);
    wrap.querySelectorAll('.theme-dot').forEach(x=>x.classList.toggle('active',x===d));
  });
}
initTheme();

// 朝代归类
function getEra(s){
  const e=(s.era||'');
  if(e.includes('春秋')||e.includes('战国'))return '先秦';
  if(e.includes('西汉')||e.includes('东汉')||e.includes('汉'))return '两汉';
  if(e.includes('三国')||e.includes('魏')||e.includes('晋')||e.includes('南北朝'))return '魏晋';
  if(e.includes('唐'))return '隋唐';
  if(e.includes('北宋')||e.includes('南宋')||e.includes('宋'))return '两宋';
  if(e.includes('元')||e.includes('明'))return '元明';
  if(e.includes('清'))return '清代';
  return '其他';
}
const eras=['先秦','两汉','魏晋','隋唐','两宋','元明','清代'];
document.getElementById('eraBar').innerHTML='<span style="font-size:13px;color:var(--gold);letter-spacing:2px;margin-right:8px">朝代：</span>'+
  ['全部',...eras].map((e,i)=>'<button class="btn btn-ghost '+(i===0?'active':'')+'" data-era="'+(i===0?'all':e)+'" style="padding:4px 12px;font-size:12px">'+e+'</button>').join('');
let curEra='all',curQ='';
function render(){
  const arr=Object.entries(SCHOLARS).filter(([n,s])=>{
    if(curEra!=='all'&&getEra(s)!==curEra)return false;
    if(curQ){
      const text=n+(s.title||'')+(s.era||'')+(s.school||'')+(s.bio||'')+(s.idea||'')+(s.works||[]).join('');
      if(!text.includes(curQ))return false;
    }
    return true;
  });
  document.getElementById('scholarGrid').innerHTML=arr.map(([n,s])=>`
    <div class="school-card" id="${encodeURIComponent(n)}">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
        <div class="name">${n}</div>
        <div class="era" style="white-space:nowrap;margin-left:10px">${s.era||''}</div>
      </div>
      <div style="font-size:12px;color:var(--gold);letter-spacing:2px;margin-bottom:8px;opacity:.85">${s.title||''} · ${s.school||''}</div>
      <div class="desc">${s.bio||s.idea||''}</div>
      ${s.works&&s.works.length?'<div class="masters" style="margin-top:10px">'+s.works.map(w=>'<span class="master-chip">'+w+'</span>').join('')+'</div>':''}
    </div>
  `).join('')||'<div class="card" style="grid-column:1/-1;text-align:center;color:var(--ink-3);padding:40px">未检索到匹配儒者</div>';
}
render();
function doSearch(){curQ=document.getElementById('q').value.trim();render()}
document.getElementById('q').addEventListener('input',doSearch);
document.querySelectorAll('button[data-era]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('button[data-era]').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  curEra=b.dataset.era;render();
});
// URL锚点
if(location.hash.slice(1))setTimeout(()=>{const el=document.getElementById(location.hash.slice(1));if(el)el.scrollIntoView()},300);
</script>
</body>
</html>

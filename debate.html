<script>
function initTheme(){
  const wrap=document.getElementById('themeDots');
  const themes=[{k:'star',n:'星象',b:'#e6ca96'},{k:'paper',n:'宣纸',b:'#6a4218'},{k:'ink',n:'水墨',b:'#e0e5ee'},{k:'bamboo',n:'竹简',b:'#e8c888'}];
  wrap.innerHTML=themes.map(t=>'<span class="theme-dot" data-theme="'+t.k+'" style="background:radial-gradient(circle,'+t.b+',#2a1e12)" title="'+t.n+'"></span>').join('');
  const saved=localStorage.getItem('rz_theme')||'star';document.body.setAttribute('data-theme',saved);
  wrap.querySelectorAll('.theme-dot').forEach(d=>d.classList.toggle('active',d.dataset.theme===saved));
  wrap.querySelectorAll('.theme-dot').forEach(d=>d.onclick=()=>{
    const t=d.dataset.theme;document.body.setAttribute('data-theme',t);localStorage.setItem('rz_theme',t);
    wrap.querySelectorAll('.theme-dot').forEach(x=>x.classList.toggle('active',x===d));
  });
}
initTheme();

// 给文本里的人物/概念/典籍加链接
function linkify(text){
  const names=[...Object.keys(SCHOLARS),...Object.keys(CONCEPTS),...Object.keys(CLASSIC_ONTOLOGY)].sort((a,b)=>b.length-a.length);
  names.forEach(n=>{
    const re=new RegExp('('+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','g');
    let href='#';
    if(SCHOLARS[n])href='scholars.html';
    else if(CONCEPTS[n])href='dictionary.html';
    else if(CLASSIC_ONTOLOGY[n])href='zhangju.html';
    text=text.replace(re,'<a href="'+href+'" style="color:var(--zhu-soft);border-bottom:1px dashed var(--zhu);margin:0 1px">$1</a>');
  });
  return text;
}

document.getElementById('debateList').innerHTML=DEBATES.map(d=>`
  <div class="debate-card">
    <div class="when">${d.when}${d.place?' · 于 '+d.place:''}</div>
    <div class="title">${d.title}</div>
    <div class="who">${linkify(d.who)}</div>
    <div class="body">${linkify(d.body)}</div>
    <div class="sides">
      ${d.sides.map((s,i)=>`<div class="debate-side${i===1?' right':''}">
        <div class="side-name">${s.name}</div>
        <div class="side-text">${linkify(s.text)}</div>
      </div>`).join('')}
    </div>
  </div>
`).join('');
</script>

<script>
function initTheme(){
  const wrap=document.getElementById('themeDots');
  const themes=[{k:'star',n:'星象',b:'#e6ca96'},{k:'paper',n:'宣纸',b:'#6a4218'},{k:'ink',n:'水墨',b:'#e0e5ee'},{k:'bamboo',n:'竹简',b:'#e8c888'}];
  wrap.innerHTML=themes.map(t=>'<span class="theme-dot" data-theme="'+t.k+'" style="background:radial-gradient(circle,'+t.b+',#2a1e12)" title="'+t.n+'"></span>').join('');
  const saved=localStorage.getItem('rz_theme')||'star';document.body.setAttribute('data-theme',saved);
  wrap.querySelectorAll('.theme-dot').forEach(d=>d.classList.toggle('active',d.dataset.theme===saved));
  wrap.querySelectorAll('.theme-dot').forEach(d=>d.onclick=()=>{
    const t=d.dataset.theme;document.body.setAttribute('data-theme',t);localStorage.setItem('rz_theme',t);
    wrap.querySelectorAll('.theme-dot').forEach(x=>x.classList.toggle('active',x===d));
  });
}
initTheme();

const EVENTS=[
  {year:'-551',era:'春秋·鲁襄公二十二年',name:'孔子诞生于鲁国陬邑',desc:'儒家创始人出生，后世尊为至圣先师。'},
  {year:'-522',era:'春秋·鲁昭公二十年',name:'孔子适周问礼于老子',desc:'孔子自谓"三十而立"，开始讲学授徒，有教无类，开私人讲学之风。'},
  {year:'-479',era:'春秋·鲁哀公十六年',name:'孔子卒，弟子心丧三年',desc:'七十子之徒散游诸侯，子夏居西河教授，为魏文侯师；曾子传道于鲁。'},
  {year:'-400?',era:'战国初',name:'子思作《中庸》',desc:'孔伋，曾子弟子，孟子之学所自出，思孟学派由此开。'},
  {year:'-372',era:'战国',name:'孟子生于邹',desc:'受业子思之门人，倡性善、仁政、王道。'},
  {year:'-313?',era:'战国末',name:'荀子生于赵',desc:'游学稷下，三为祭酒，主性恶、隆礼，韩非、李斯出其门。'},
  {year:'-213',era:'秦·始皇三十四年',name:'焚书坑儒',desc:'秦火之厄，《乐经》亡佚，《书》《礼》等多赖私藏得以传。'},
  {year:'-134',era:'西汉·武帝元光元年',name:'董仲舒对策·罢黜百家独尊儒术',desc:'立五经博士，儒学定为官方意识形态，开两千年经学传统。'},
  {year:'175',era:'东汉·熹平四年',name:'蔡邕等奏立熹平石经',desc:'正定六经文字，刻石立于太学门外，是为官方定本。'},
  {year:'200',era:'东汉末',name:'郑玄卒，郑学集今古文大成',desc:'融今古文为一炉，注《三礼》《毛诗》等，影响经学千年。'},
  {year:'249',era:'魏·正始年间',name:'王弼注《易》《老》，玄学兴',desc:'扫象阐理，以道释儒，开魏晋玄学风气。'},
  {year:'640',era:'唐·贞观十四年',name:'孔颖达等奉诏撰《五经正义》',desc:'统一南北经学，成为科举定本，经学由此归于一尊。'},
  {year:'819',era:'唐·元和十四年',name:'韩愈上《论佛骨表》，作《原道》',desc:'正式提出儒家道统说，辟佛老，开宋明理学先河。'},
  {year:'1017',era:'北宋·天禧元年',name:'周敦颐生',desc:'作《太极图说》《通书》，理学开山。'},
  {year:'1070s',era:'北宋',name:'张载讲学关中，二程讲学洛阳',desc:'关学、洛学并兴，性即理、太虚即气等核心命题提出。'},
  {year:'1175',era:'南宋·淳熙二年',name:'鹅湖之会',desc:'朱陆辩为学之方，理学心学分途。'},
  {year:'1190',era:'南宋·绍熙元年',name:'朱熹知漳州，刊《四书章句集注》',desc:'合《大学》《中庸》《论语》《孟子》为四书，此后七百年为科举定本。'},
  {year:'1200',era:'南宋·庆元六年',name:'朱熹卒',desc:'其后学尊其为理学集大成者，学说从伪学转为正统。'},
  {year:'1508',era:'明·正德三年',name:'王阳明龙场悟道',desc:'悟"心即理"，始论知行合一，心学由此昌明。'},
  {year:'1528',era:'明·嘉靖七年',name:'王阳明征思田归卒，天泉证道',desc:'四句教定宗旨，王门后学从此分化为浙中、江右、泰州等派。'},
  {year:'1602',era:'明·万历三十年',name:'李贽自杀于狱中',desc:'泰州学派异端，以"童心说"反假道学，晚明思想解放之代表。'},
  {year:'1645',era:'清·顺治二年',name:'刘宗周绝食殉明',desc:'蕺山先生卒，弟子黄宗羲承其学，开浙东史学。'},
  {year:'1660s',era:'清初',name:'顾、黄、王三大儒著书立说',desc:'惩王学空疏之弊，倡经世致用，开清代朴学先声。'},
  {year:'1770s',era:'清·乾隆',name:'戴震著《孟子字义疏证》',desc:'以训诂明义理，斥后儒"以理杀人"，皖派考据学集大成。'},
  {year:'1773',era:'清·乾隆三十八年',name:'开四库全书馆',desc:'纪昀等编《四库全书总目提要》，是为中国古典学术之总结。'},
  {year:'1891',era:'清·光绪十七年',name:'康有为刊《新学伪经考》',desc:'晚清今文学复兴，托古改制，为变法维新张本。'},
  {year:'1898',era:'清·光绪二十四年',name:'戊戌变法失败，六君子就义',desc:'今文学经世致用之学实践受挫，梁启超流亡日本，引入西学。'}
];
document.getElementById('tl').innerHTML=EVENTS.map(e=>`
  <div class="tl-item">
    <div class="era">${e.era}</div>
    <div class="name">${e.name}</div>
    <div class="desc">${e.desc}</div>
  </div>
`).join('');
</script>

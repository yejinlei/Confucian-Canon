<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>儒門道脈 | 儒藏本体論</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style/common.css">
  <style>
    body {
      overflow-x: auto;
    }
    .lineage-container {
      margin-left: 180px;
      padding: 40px 20px;
      min-width: 1200px;
    }
    .page-title {
      text-align: center;
      color: var(--accent-gold);
      font-size: 32px;
      font-weight: 300;
      margin-bottom: 12px;
      letter-spacing: 8px;
    }
    .page-subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 60px;
      letter-spacing: 2px;
    }
    /* 树状布局 */
    .lineage-tree {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 60px;
    }
    .era-label {
      position: absolute;
      left: 0;
      writing-mode: vertical-rl;
      color: var(--accent-gold);
      font-size: 16px;
      letter-spacing: 4px;
      opacity: 0.8;
    }
    .generation {
      display: flex;
      justify-content: center;
      gap: 30px;
      position: relative;
    }
    .scholar-card {
      width: 140px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
    }
    .scholar-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-gold);
      box-shadow: 0 8px 24px rgba(212,175,55,0.15);
    }
    .scholar-card.zhou { border-color: #a78bfa; }
    .scholar-card.song { border-color: #4ade80; }
    .scholar-card.ming { border-color: #60a5fa; }
    .scholar-card.qing { border-color: #fb923c; }
    .scholar-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(212,175,55,0.1);
      border: 2px solid var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: var(--accent-gold);
      margin: 0 auto 12px auto;
    }
    .scholar-name {
      font-size: 18px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .scholar-title {
      font-size: 12px;
      color: var(--text-muted);
    }
    .scholar-era {
      font-size: 11px;
      color: var(--accent-gold);
      margin-top: 6px;
      opacity: 0.8;
    }
    /* 连接线 */
    .generation::before {
      content: '';
      position: absolute;
      top: -30px;
      left: 50%;
      width: 2px;
      height: 30px;
      background: var(--border);
    }
    .generation:first-child::before { display: none; }
    .gen-branch {
      position: absolute;
      top: -30px;
      height: 2px;
      background: var(--border);
    }
    .scholar-card::before {
      content: '';
      position: absolute;
      top: -30px;
      left: 50%;
      width: 2px;
      height: 30px;
      background: var(--border);
    }
    .generation:first-child .scholar-card::before { display: none; }
    /* 详情弹窗 */
    .scholar-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .scholar-modal.show {
      display: flex;
    }
    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 480px;
      max-width: 90vw;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 24px;
      cursor: pointer;
    }
    .modal-name {
      font-size: 28px;
      color: var(--accent-gold);
      font-weight: 500;
      margin-bottom: 8px;
    }
    .modal-title {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }
    .modal-section {
      margin-bottom: 16px;
    }
    .modal-label {
      font-size: 13px;
      color: var(--accent-gold);
      margin-bottom: 4px;
    }
    .modal-text {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.8;
    }
    .modal-works {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .work-tag {
      padding: 4px 12px;
      border-radius: 16px;
      background: rgba(212,175,55,0.1);
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-primary);
      cursor: pointer;
    }
    .work-tag:hover {
      background: var(--accent-gold);
      color: #1a1308;
    }
    @media (max-width: 768px) {
      .lineage-container {
        margin-left: 0;
        padding: 20px;
      }
      .generation {
        flex-wrap: wrap;
        gap: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="lineage-container">
    <h1 class="page-title">儒門道脈</h1>
    <p class="page-subtitle">堯舜禹湯文武周公孔子孟軻，以迄於今，聖聖相傳，道統不絕</p>

    <div class="lineage-tree" id="lineageTree"></div>
  </div>

  <!-- 详情弹窗 -->
  <div class="scholar-modal" id="scholarModal">
    <div class="modal-content">
      <button class="modal-close" onclick="document.getElementById('scholarModal').classList.remove('show')">&times;</button>
      <div class="modal-name" id="modalName"></div>
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-section">
        <div class="modal-label">所處年代</div>
        <div class="modal-text" id="modalEra"></div>
      </div>
      <div class="modal-section">
        <div class="modal-label">所屬學派</div>
        <div class="modal-text" id="modalSchool"></div>
      </div>
      <div class="modal-section">
        <div class="modal-label">核心思想</div>
        <div class="modal-text" id="modalIdea"></div>
      </div>
      <div class="modal-section">
        <div class="modal-label">人物生平</div>
        <div class="modal-text" id="modalBio"></div>
      </div>
      <div class="modal-section">
        <div class="modal-label">代表著作</div>
        <div class="modal-works" id="modalWorks"></div>
      </div>
    </div>
  </div>

  <script src="data/common.js"></script>
  <script>
    initPage('timeline.html');

    // 道脉谱系数据：按代际排列
    const lineage = [
      {
        era: '先秦',
        scholars: [
          {id:'孔子', type:'zhou'},
          {id:'孟子', type:'zhou'},
          {id:'荀子', type:'zhou'}
        ]
      },
      {
        era: '汉唐',
        scholars: [
          {id:'董仲舒', type:'han'},
          {id:'韩愈', type:'han'}
        ]
      },
      {
        era: '北宋',
        scholars: [
          {id:'周敦颐', type:'song'},
          {id:'张载', type:'song'},
          {id:'程颢', type:'song'},
          {id:'程颐', type:'song'}
        ]
      },
      {
        era: '南宋',
        scholars: [
          {id:'朱熹', type:'song'},
          {id:'陆九渊', type:'song'}
        ]
      },
      {
        era: '明代',
        scholars: [
          {id:'王阳明', type:'ming'}
        ]
      },
      {
        era: '明末清初',
        scholars: [
          {id:'顾炎武', type:'qing'},
          {id:'黄宗羲', type:'qing'},
          {id:'王夫之', type:'qing'}
        ]
      }
    ];

    const tree = document.getElementById('lineageTree');
    lineage.forEach((gen, genIdx) => {
      // 年代标签
      if (genIdx % 2 === 0) {
        const label = document.createElement('div');
        label.className = 'era-label';
        label.style.top = `${100 + genIdx * 200}px`;
        label.textContent = gen.era;
        tree.appendChild(label);
      }
      // 代容器
      const genDiv = document.createElement('div');
      genDiv.className = 'generation';
      // 连接线（多子节点）
      if (gen.scholars.length > 1 && genIdx > 0) {
        const branch = document.createElement('div');
        branch.className = 'gen-branch';
        const cardWidth = 170;
        const totalWidth = gen.scholars.length * cardWidth - 30;
        branch.style.width = `${totalWidth}px`;
        branch.style.left = `calc(50% - ${totalWidth/2}px)`;
        genDiv.appendChild(branch);
      }
      // 人物卡片
      gen.scholars.forEach(scholarId => {
        const data = SCHOLARS[scholarId.id];
        if (!data) return;
        const card = document.createElement('div');
        card.className = `scholar-card ${scholarId.type}`;
        card.innerHTML = `
          <div class="scholar-avatar">${scholarId.id[0]}</div>
          <div class="scholar-name">${scholarId.id}</div>
          <div class="scholar-title">${data.title}</div>
          <div class="scholar-era">${data.era}</div>
        `;
        card.onclick = () => showScholar(scholarId.id);
        genDiv.appendChild(card);
      });
      tree.appendChild(genDiv);
    });

    // 显示人物详情
    function showScholar(name) {
      const data = SCHOLARS[name];
      if (!data) return;
      document.getElementById('modalName').textContent = name;
      document.getElementById('modalTitle').textContent = data.title;
      document.getElementById('modalEra').textContent = data.era;
      document.getElementById('modalSchool').textContent = data.school;
      document.getElementById('modalIdea').textContent = data.idea;
      document.getElementById('modalBio').textContent = data.bio;
      const worksDiv = document.getElementById('modalWorks');
      worksDiv.innerHTML = '';
      data.works.forEach(work => {
        // 查找典籍
        const cat = Object.entries(BOOKS_DATA).find(b => b[1] === work);
        const tag = document.createElement('div');
        tag.className = 'work-tag';
        tag.textContent = work;
        if (cat) {
          tag.onclick = () => {
            window.location.href = `reader.html?b=${encodeURIComponent(cat[0] + '/' + work + '.txt')}`;
          };
        }
        worksDiv.appendChild(tag);
      });
      document.getElementById('scholarModal').classList.add('show');
    }

    // 点击遮罩关闭弹窗
    document.getElementById('scholarModal').addEventListener('click', e => {
      if (e.target.id === 'scholarModal') {
        e.target.classList.remove('show');
      }
    });
  </script>
</body>
</html>

<script src="data/ontology-enhance.js"></script>
<script>
function initTheme(){
  const wrap=document.getElementById('themeDots');
  const themes=[{k:'star',n:'星象',b:'#e6ca96'},{k:'paper',n:'宣纸',b:'#6a4218'},{k:'ink',n:'水墨',b:'#e0e5ee'},{k:'bamboo',n:'竹简',b:'#e8c888'}];
  wrap.innerHTML=themes.map(t=>'<span class="theme-dot" data-theme="'+t.k+'" style="background:radial-gradient(circle,'+t.b+',#2a1e12)" title="'+t.n+'"></span>').join('');
  const saved=localStorage.getItem('rz_theme')||'star';document.body.setAttribute('data-theme',saved);
  wrap.querySelectorAll('.theme-dot').forEach(d=>d.classList.toggle('active',d.dataset.theme===saved));
  wrap.querySelectorAll('.theme-dot').forEach(d=>d.onclick=()=>{
    const t=d.dataset.theme;document.body.setAttribute('data-theme',t);localStorage.setItem('rz_theme',t);
    wrap.querySelectorAll('.theme-dot').forEach(x=>x.classList.toggle('active',x===d));
  });
}
initTheme();

// 代际
const GENS=[
  {era:'第一期 · 先秦',color:'var(--zhu)',names:['孔子','颜回','曾子','子思','孟子','荀子','子贡','子夏','子路','子游','闵子骞','冉雍','有若']},
  {era:'第二期 · 汉唐',color:'var(--gold-deep)',names:['董仲舒','郑玄','何休','王弼','孔颖达','韩愈','李翱']},
  {era:'第三期 · 北宋五子',color:'var(--copper)',names:['周敦颐','邵雍','张载','程颢','程颐']},
  {era:'第四期 · 南宋朱陆',color:'var(--jade)',names:['杨时','罗从彦','李侗','朱熹','陆九渊','吕祖谦','张栻','蔡元定','黄榦','真德秀','蔡沉','陈亮','叶适']},
  {era:'第五期 · 元代',color:'var(--ice)',names:['赵复','许衡','吴澄']},
  {era:'第六期 · 明代',color:'var(--amber)',names:['陈献章','湛若水','王阳明','王畿','钱德洪','王艮','邹守益','罗洪先','罗汝芳','李贽','刘宗周','吕坤','罗钦顺']},
  {era:'第七期 · 清初三大儒',color:'var(--violet)',names:['顾炎武','黄宗羲','王夫之','颜元','李塨']},
  {era:'第八期 · 清代乾嘉以降',color:'var(--silver)',names:['惠栋','戴震','段玉裁','王念孙','焦循','阮元','章学诚','庄存与','刘逢禄','龚自珍','魏源','康有为','梁启超','谭嗣同','章炳麟']}
];
document.getElementById('gens').innerHTML=GENS.map(g=>`
  <div class="section">
    <div class="section-head">
      <h3 style="color:${g.color};letter-spacing:4px;font-size:18px;padding-bottom:6px;border-bottom:2px solid ${g.color};display:inline-block">${g.era}</h3>
    </div>
    <div class="sage-grid" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr))">
      ${g.names.map(n=>{
        const s=SCHOLARS[n];if(!s)return '';
        return '<div class="sage-card"><div class="name" style="font-size:16px">'+n+'</div>'+
          '<div class="zi">'+(s.title||'')+'</div>'+
          '<div class="era">'+(s.era||'')+'</div></div>';
      }).join('')}
    </div>
  </div>
`).join('');
</script>
</body>
</html>

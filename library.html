<link rel="stylesheet" href="style/common.css">
</head>

  <div class="topbar-logo"><span class="sym">儒</span>儒藏</div>
  <nav class="topbar-nav">

  </nav>

</header>

<div class="layout">
<div class="content">
  <div class="section-head" style="margin-top:24px">
    <div class="en">CONFUCIAN CANON LIBRARY</div>
    <h2>儒 藏 典 籍 库</h2>
    <div class="desc">908部儒家典籍 · 1.34亿字全文 · 12大类</div>
  </div>
  <div class="search-box">
    <input id="q" placeholder="按书名检索，如：论语、近思录、日知录…">
    <button onclick="render()">检 索</button>
  </div>
  <div class="filter-bar" id="catBar"></div>
  <div id="bookGrid" style="margin-top:20px"></div>
</div>
</div>

<footer class="footer">儒藏本体论 · 典籍库 · 908部 1.34亿字</footer>

<script src="data/common.js"></script>
<script src="data/ontology-enhance.js"></script>
<script>
function initTheme(){
  const wrap=document.getElementById('themeDots');
  const themes=[{k:'star',n:'星象',b:'#e6ca96'},{k:'paper',n:'宣纸',b:'#6a4218'},{k:'ink',n:'水墨',b:'#e0e5ee'},{k:'bamboo',n:'竹简',b:'#e8c888'}];
  wrap.innerHTML=themes.map(t=>'<span class="theme-dot" data-theme="'+t.k+'" style="background:radial-gradient(circle,'+t.b+',#2a1e12)" title="'+t.n+'"></span>').join('');
  const saved=localStorage.getItem('rz_theme')||'star';document.body.setAttribute('data-theme',saved);
  wrap.querySelectorAll('.theme-dot').forEach(d=>d.classList.toggle('active',d.dataset.theme===saved));
  wrap.querySelectorAll('.theme-dot').forEach(d=>d.onclick=()=>{
    const t=d.dataset.theme;document.body.setAttribute('data-theme',t);localStorage.setItem('rz_theme',t);
    wrap.querySelectorAll('.theme-dot').forEach(x=>x.classList.toggle('active',x===d));
  });
}
initTheme();

const catCounts={};BOOKS_DATA.forEach(b=>{catCounts[b[0]]=(catCounts[b[0]]||0)+1});
const cats=['all',...new Set(BOOKS_DATA.map(b=>b[0]))];
document.getElementById('catBar').innerHTML=cats.map((c,i)=>{
  const n=c==='all'?'全部 ('+BOOKS_DATA.length+')':c+' ('+(catCounts[c]||0)+')';
  return '<button class="btn btn-ghost '+(i===0?'active':'')+'" data-cat="'+c+'" style="padding:4px 12px;font-size:12px;margin:2px">'+n+'</button>';
}).join('');

let curCat='all';
function render(){
  const q=document.getElementById('q').value.trim();
  const list=BOOKS_DATA.filter(b=>{
    if(curCat!=='all'&&b[0]!==curCat)return false;
    if(q&&!b[1].includes(q))return false;
    return true;
  });
  const grid=document.getElementById('bookGrid');
  grid.className='grid-4';
  grid.innerHTML=list.map(b=>{
    const sz=b[2]>1000000?(b[2]/1000000).toFixed(1)+'MB':b[2]>1000?(b[2]/10000).toFixed(0)+'万字':Math.round(b[2]/1000)+'千字';
    return '<a class="classic-card" href="reader.html?b='+encodeURIComponent(b[0]+'/'+b[1]+'.txt')+'" style="text-decoration:none;color:inherit;padding:16px 18px">'+
      '<div class="era">'+b[0]+'</div>'+
      '<div class="name" style="font-size:16px;letter-spacing:1px">'+b[1]+'</div>'+
      '<div class="desc" style="font-size:12px;color:var(--ink-3);margin-top:6px">'+sz+' · 点击阅读</div>'+
      '</a>';
  }).join('');
  document.getElementById('bookGrid').insertAdjacentHTML('beforebegin','');
}
render();
document.getElementById('q').addEventListener('input',render);
document.querySelectorAll('button[data-cat]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('button[data-cat]').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  curCat=b.dataset.cat;render();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>古籍全文库 · 儒藏本体论</title>
  <link rel="stylesheet" href="style/common.css">
</head>
<body>
  <div class="main-content">
    <div class="library-header">
      <h1 class="page-title">古籍全文库</h1>
      <p class="page-subtitle">儒藏 908 部 · 总字数 1.34亿 字 · 按字数倒序排列 · 点击书名进入阅读</p>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="检索书名 / 分类（如：论语、朱熹、蒙学）…">
      </div>

      <div class="category-tabs" id="categoryTabs">
        <!-- 分类标签由JS生成 -->
      </div>
    </div>

    <div class="book-list" id="bookList">
      <!-- 典籍列表由JS生成 -->
    </div>

    <button class="load-more" id="loadMore">加载更多 ▾</button>
  </div>

  <script src="data/books.js"></script>
  <script src="data/common.js"></script>
  <script>
    initPage('library.html');
    renderFooter();

    let currentCategory = 'all';
    let currentPage = 0;
    const pageSize = 100;

    // ===== 真实典籍索引：908部，与仓库 books/ 目录一一对应 =====
    // 每条格式 [分类目录, 书名, 字数]

    function charStr(n) {
      if (n >= 10000) return (n / 10000).toFixed(1) + '万字';
      return n + '字';
    }

    // 构建书单并按字数倒序
    const allBooks = BOOKS_DATA
      .map(b => ({ cat: b[0], name: b[1], chars: charStr(b[2]), num: b[2] }))
      .sort((a, b) => b.num - a.num);

    // 渲染分类标签
    function renderCategories() {
      const tabs = document.getElementById('categoryTabs');
      tabs.innerHTML = CATEGORIES.map(cat => `
        <button class="category-tab ${cat.id === currentCategory ? 'active' : ''}" data-cat="${cat.id}">
          ${cat.name}（${cat.count}）
        </button>
      `).join('');

      tabs.querySelectorAll('.category-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          currentCategory = tab.dataset.cat;
          currentPage = 0;
          document.getElementById('bookList').innerHTML = '';
          renderCategories();
          renderBooks();
        });
      });
    }

    // 渲染典籍列表
    function renderBooks() {
      const list = document.getElementById('bookList');
      const search = document.getElementById('searchInput').value.trim().toLowerCase();

      let filtered = allBooks;
      if (currentCategory !== 'all') {
        filtered = filtered.filter(b => b.cat === currentCategory);
      }
      if (search) {
        filtered = filtered.filter(b =>
          b.name.toLowerCase().includes(search) ||
          b.cat.toLowerCase().includes(search)
        );
      }

      const start = currentPage * pageSize;
      const end = start + pageSize;
      const pageBooks = filtered.slice(start, end);

      pageBooks.forEach(book => {
        const item = document.createElement('a');
        item.className = 'book-item';
        item.href = `reader.html?b=${encodeURIComponent(book.cat + '/' + book.name + '.txt')}`;
        item.innerHTML = `
          <span class="book-cat">${book.cat}</span>
          <span class="book-name">${book.name}</span>
          <span class="book-chars">${book.chars}</span>
        `;
        list.appendChild(item);
      });

      document.getElementById('loadMore').style.display =
        end < filtered.length ? 'block' : 'none';
    }

    // 支持从其它页面带参进入：?cat=四书 / ?q=关键字
    const urlParams = new URLSearchParams(location.search);
    const catParam = urlParams.get('cat');
    const qParam = urlParams.get('q');
    if (catParam && CATEGORIES.some(c => c.id === catParam)) currentCategory = catParam;
    if (qParam) document.getElementById('searchInput').value = qParam;

    // 初始化
    renderCategories();
    renderBooks();

    // 搜索
    document.getElementById('searchInput').addEventListener('input', () => {
      currentPage = 0;
      document.getElementById('bookList').innerHTML = '';
      renderBooks();
    });

    // 加载更多
    document.getElementById('loadMore').addEventListener('click', () => {
      currentPage++;
      renderBooks();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阅读 · 儒藏本体论</title>
  <link rel="stylesheet" href="style/common.css">
  <style>
    .reader-container {
      display: flex;
      gap: 20px;
      min-height: calc(100vh - 220px);
    }
    .chapter-sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 12px;
      position: sticky;
      top: 100px;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
    }
    .chapter-sidebar h3 {
      font-size: 16px;
      margin: 0 0 12px 0;
      color: var(--accent-color);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }
    .chapter-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .chapter-list li {
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 13px;
      color: var(--text-secondary);
      transition: all 0.2s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chapter-list li:hover,
    .chapter-list li.active {
      background: var(--accent-light);
      color: var(--accent-color);
    }
    .reader-body {
      flex: 1;
      min-width: 0;
    }
    .reader-progress {
      height: 4px;
      background: var(--border-color);
      border-radius: 2px;
      margin-bottom: 16px;
      overflow: hidden;
      position: sticky;
      top: 80px;
      z-index: 10;
    }
    .reader-progress-bar {
      height: 100%;
      background: var(--accent-color);
      width: 0%;
      transition: width 0.3s;
    }
    .reader-content {
      line-height: 2.0;
      font-size: 18px;
    }
    .reader-content p {
      margin-bottom: 1em;
      text-indent: 2em;
    }
    .reader-content .chapter-heading {
      text-indent: 0;
      font-size: 22px;
      font-weight: bold;
      color: var(--accent-color);
      margin: 2em 0 1em 0;
      padding-top: 1em;
      border-top: 1px solid var(--border-color);
    }
    .reader-loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
      font-size: 16px;
    }
    .reader-loading small {
      display: block;
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.7;
    }
    @media (max-width: 1200px) {
      .chapter-sidebar {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="main-content">
    <div class="breadcrumb" id="breadcrumb">
      <a href="index.html">首页</a> › <a href="library.html">全文库</a> › <span id="bookCat"></span> › <span id="bookName"></span>
    </div>

    <div class="reader-header">
      <h1 class="reader-title" id="readerTitle"></h1>
      <div class="reader-controls">
        <button id="backBtn">← 返回全文库</button>
        <button id="prevBtn">← 上一部</button>
        <button id="nextBtn">下一部 →</button>
      </div>
    </div>

    <div class="reader-progress">
      <div class="reader-progress-bar" id="progressBar"></div>
    </div>

    <div class="reader-container">
      <div class="chapter-sidebar" id="chapterSidebar">
        <h3>📑 卷次目录</h3>
        <ul class="chapter-list" id="chapterList"></ul>
      </div>
      <div class="reader-body">
        <div class="reader-content" id="readerContent">
          <div class="reader-loading">
            正在加载典籍...
            <small>大型典籍采用分卷按需渲染，无需等待全部加载即可阅读</small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="data/common.js"></script>
  <script>
    initPage('library.html');
    renderFooter();

    // 获取URL参数
    const params = new URLSearchParams(window.location.search);
    const bookPath = params.get('b');
    const [bookCat, bookFile] = bookPath.split('/');
    const bookName = bookFile.replace('.txt', '');

    // 更新标题和面包屑
    document.getElementById('bookCat').textContent = bookCat;
    document.getElementById('bookName').textContent = bookName;
    document.getElementById('readerTitle').textContent = bookName;
    document.title = `${bookName} · 儒藏本体论`;

    // 全局状态
    let allParagraphs = [];
    let chapters = [];
    let currentChapter = 0;
    let renderedStart = 0;
    const BATCH_SIZE = 200; // 每次渲染200段，避免DOM过大

    // 识别章节/卷次标题（自动适配古籍格式）
    function isChapterTitle(line) {
      const t = line.trim();
      if (!t) return false;
      // 匹配春秋左传正义/十三经注疏类：卷X 第X 某某
      if (/^卷[一二三四五六七八九十百零\d]+/.test(t)) return true;
      // 匹配论语/孟子等：第X篇、学而第一、为政第二
      if (/^第[一二三四五六七八九十百\d]+[篇章卷]/.test(t)) return true;
      if (/^[一二三四五六七八九十百]+、/.test(t) && t.length < 30) return true;
      // 匹配尚书/礼记：某某篇第X
      if (/篇第[一二三四五六七八九十百\d]+$/.test(t)) return true;
      return false;
    }

    // 分块解析章节
    function parseChapters(paragraphs) {
      const chaps = [];
      let currentChapTitle = '卷首';
      let currentStart = 0;
      
      for (let i = 0; i < paragraphs.length; i++) {
        const p = paragraphs[i].trim();
        if (isChapterTitle(p)) {
          if (i > 0) {
            chaps.push({
              title: currentChapTitle,
              start: currentStart,
              end: i
            });
          }
          currentChapTitle = p.replace(/\s+/g, ' ').substring(0, 30);
          currentStart = i;
        }
      }
      // 最后一章
      chaps.push({
        title: currentChapTitle,
        start: currentStart,
        end: paragraphs.length
      });

      // 如果全书没有识别到章节，全书作为一章
      if (chaps.length <= 1 && paragraphs.length > BATCH_SIZE) {
        // 自动按200段分块
        const blocks = Math.ceil(paragraphs.length / BATCH_SIZE);
        chaps.length = 0;
        for (let i = 0; i < blocks; i++) {
          chaps.push({
            title: `第${i+1}节`,
            start: i * BATCH_SIZE,
            end: Math.min((i+1) * BATCH_SIZE, paragraphs.length)
          });
        }
      }

      return chaps;
    }

    // 渲染指定范围段落
    function renderRange(start, end) {
      const endIdx = Math.min(end, allParagraphs.length);
      const container = document.getElementById('readerContent');
      const frag = document.createDocumentFragment();

      for (let i = start; i < endIdx; i++) {
        const p = allParagraphs[i].trim();
        if (!p) continue;
        const el = document.createElement('p');
        if (isChapterTitle(p)) {
          el.className = 'chapter-heading';
          el.id = `chap-${i}`;
        } else {
          el.id = `p-${i}`;
        }
        el.innerHTML = annotateConcepts(p);
        frag.appendChild(el);
      }

      if (start === 0) {
        container.innerHTML = '';
      }
      container.appendChild(frag);
      renderedStart = endIdx;

      // 更新进度
      const progress = Math.min(100, (endIdx / allParagraphs.length) * 100);
      document.getElementById('progressBar').style.width = `${progress}%`;
    }

    // 滚动自动加载更多
    function setupScrollLoad() {
      window.addEventListener('scroll', () => {
        const scrollBottom = window.innerHeight + window.scrollY;
        const docHeight = document.body.offsetHeight;
        
        // 滚动到距离底部300px时加载下一批
        if (scrollBottom >= docHeight - 500 && renderedStart < allParagraphs.length) {
          renderRange(renderedStart, renderedStart + BATCH_SIZE);
        }

        // 高亮当前章节
        updateActiveChapter();
      }, { passive: true });
    }

    // 更新当前激活章节
    function updateActiveChapter() {
      const scrollPos = window.scrollY + 150;
      for (let i = chapters.length - 1; i >= 0; i--) {
        const chapEl = document.getElementById(`chap-${chapters[i].start}`);
        if (chapEl && chapEl.offsetTop <= scrollPos) {
          if (currentChapter !== i) {
            currentChapter = i;
            document.querySelectorAll('.chapter-list li').forEach((li, idx) => {
              li.classList.toggle('active', idx === i);
            });
          }
          break;
        }
      }
    }

    // 跳转到指定章节
    function jumpToChapter(index) {
      const chap = chapters[index];
      currentChapter = index;
      
      // 如果章节还没渲染，先渲染到该章节位置
      if (chap.end > renderedStart) {
        renderRange(renderedStart, chap.end + BATCH_SIZE);
      }

      const target = document.getElementById(`chap-${chap.start}`);
      if (target) {
        window.scrollTo({
          top: target.offsetTop - 100,
          behavior: 'smooth'
        });
      }

      // 高亮
      document.querySelectorAll('.chapter-list li').forEach((li, idx) => {
        li.classList.toggle('active', idx === index);
      });
    }

    // 渲染章节目录
    function renderChapterList() {
      const list = document.getElementById('chapterList');
      list.innerHTML = chapters.map((chap, idx) => 
        `<li data-idx="${idx}" title="${chap.title}">${chap.title}</li>`
      ).join('');

      list.querySelectorAll('li').forEach(li => {
        li.addEventListener('click', () => {
          jumpToChapter(parseInt(li.dataset.idx));
        });
      });
    }

    // 主加载函数
    async function loadContent() {
      try {
        // 流式加载，边下载边解析
        const response = await fetch(`books/${bookPath}`);
        if (!response.ok) throw new Error('加载失败');

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let receivedText = '';
        let loaded = 0;

        // 先获取前50KB内容，优先渲染开头，让用户立刻能看到内容
        while (loaded < 50 * 1024) {
          const { done, value } = await reader.read();
          if (done) break;
          receivedText += decoder.decode(value, { stream: true });
          loaded += value.length;
        }

        // 先解析并渲染开头部分，用户立刻能读
        allParagraphs = receivedText.split(/\n+/).filter(p => p.trim());
        chapters = parseChapters(allParagraphs);
        renderChapterList();
        renderRange(0, Math.min(BATCH_SIZE, allParagraphs.length));
        setupScrollLoad();

        // 后台继续加载剩余全部内容
        (async function loadRest() {
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            receivedText += decoder.decode(value, { stream: true });
          }
          // 全部加载完后重新解析所有段落（补全后面的章节）
          allParagraphs = receivedText.split(/\n+/).filter(p => p.trim());
          chapters = parseChapters(allParagraphs);
          renderChapterList();
          
          // 如果用户还没往下滚动，补渲染剩余开头部分
          if (renderedStart < BATCH_SIZE) {
            renderRange(renderedStart, BATCH_SIZE);
          }
        })();

      } catch (e) {
        console.error('加载失败:', e);
        document.getElementById('readerContent').innerHTML = `
          <div class="reader-loading">
            典籍加载中，请稍候...
            <small>如果长时间未加载，请刷新页面重试</small>
          </div>
        `;
      }
    }

    // 按钮事件
    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = 'library.html';
    });
    document.getElementById('prevBtn').addEventListener('click', () => {
      window.location.href = 'library.html';
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      window.location.href = 'library.html';
    });

    // 启动加载
    loadContent();
  </script>
</body>
</html>

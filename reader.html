<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阅读 · 儒藏本体论</title>
  <link rel="stylesheet" href="style/common.css">
  <link rel="preload" href="data/books.js" as="script">
  <link rel="preload" href="data/common.js" as="script">
  <script>
  /* 首屏预取：解析到 <head> 就立刻并行请求正文，
     与样式表、公共脚本的下载同时进行，避免"串行等待" */
  (function () {
    var m = new URLSearchParams(location.search).get('b');
    if (!m) return;
    var parts = m.split('/').map(encodeURIComponent);
    var bookUrl = 'books/' + parts.join('/');
    var bookName = parts[parts.length - 1].replace(/\.txt$/, '');
    var cat = parts.slice(0, -1).join('/');
    var splitIdxUrl = 'books-split/' + cat + '/' + bookName + '/index.json';
    window.__bookPath = m;
    window.__bookPreloadUrl = bookUrl;
    /* 整文件请求（小书/未切分书用）带 AbortController：
       一旦确认存在按卷索引，立即取消整本下载，避免大书整本抢带宽、拖慢按卷加载 */
    var ac = new AbortController();
    window.__bookAbort = ac;
    window.__bookPreload = fetch(bookUrl, { signal: ac.signal })
      .then(function (r) { return r.ok ? r : null; })
      .catch(function () { return null; });
    /* 探测是否有按卷切分索引（几十字节 JSON），命中则走按卷加载，首屏只拉第一卷 */
    window.__splitPreload = fetch(splitIdxUrl).then(function (r) {
      // 只有切分索引确实存在（200且有内容）时，才取消整本书预加载
      if (r.ok) {
        return r.json().then(function (j) {
          if (j && j.volumes && j.volumes.length >= 2) {
            try { ac.abort(); } catch (e) {}
            return j;
          }
          return null;
        });
      }
      return null;
    }).catch(function () { return null; });
  })();
  </script>

<body>

  <!-- 移动端目录按钮与遮罩 -->

  <script>
    initPage('library.html');
    renderFooter();

    // ========== 全局状态 ==========
    const params = new URLSearchParams(window.location.search);
    const bookPath = params.get('b');
    const [bookCat, bookFile] = bookPath.split('/');
    const bookName = bookFile.replace('.txt', '');
    const targetAnchor = params.get('anchor'); // 预生成章句索引的锚点参数

    // 更新标题和面包屑
    document.getElementById('bookCat').textContent = bookCat;
    document.getElementById('bookName').textContent = bookName;
    document.getElementById('readerTitle').textContent = bookName;
    document.title = `${bookName} · 儒藏本体论`;

    let allParagraphs = [];
    let chapters = [];
    let tocReady = false;   // 全文流式加载完成前，卷次目录可能还不完整
    // 显式挂 window
    window.allParagraphs = allParagraphs;
    window.chapters = chapters;
    let currentChapter = 0;
    let renderedEnd = 0;
    const BATCH_SIZE = 200;
    let BOOKS_INDEX = [];   // 完整书单，用于上/下一部
    let currentBookIdx = -1;
    let searchHits = [];
    let currentHitIdx = -1;
    let searchTerm = '';

    /* ========== 按卷加载模式（split mode）状态 ========== */
    let splitMode = false;
    let splitIndex = null;       // {volumes:[{id,title,file,size,lines}...]}
    let loadedVolumes = {};      // {volId: [paragraphs...]} 缓存已加载的卷，避免重复请求
    let volumeStartIdx = [];     // 每卷在 allParagraphs 里的起始段落索引
    // 显式挂到 window，方便外部诊断与跨脚本访问
    window.splitMode = splitMode;
    window.splitIndex = splitIndex;
    window.loadedVolumes = loadedVolumes;
    window.volumeStartIdx = volumeStartIdx;

    // ========== 章节标题识别（增强版） ==========
    function isChapterTitle(line) {
      const t = line.trim().replace(/\s+/g, ' ');
      if (!t) return false;
      // 排除短正文（注疏行首"○"是段落标记，不是标题）
      if (t.length < 2) return false;

      // 1. 卷/篇类标题（优先匹配）
      // 卷X、卷第X、卷X 第X、卷之X、卷X X公
      if (/^卷[之第]?[一二三四五六七八九十百零\d]+/.test(t)) return true;
      // 第X篇/章/卷/节（独立成行，如"学而第一""为政第二"）
      if (/^[一二三四五六七八九十百\d]+[篇章卷]第[一二三四五六七八九十百\d]*/.test(t)) return true;
      if (/^第[一二三四五六七八九十百零\d]+[篇章卷]/.test(t)) return true;
      if (/^[一二三四五六七八九十百]+[、.．]\s*\S/.test(t) && t.length < 30) return true;
      // 某某篇第X
      if (/篇第[一二三四五六七八九十百\d]+$/.test(t)) return true;
      // 篇名+序数，如"学而第一""为政第二"（《论语》《孟子》常见，整行短标题）
      if (/^[\u4e00-\u9fa5]{1,8}第[一二三四五六七八九十百\d]+$/.test(t)) return true;
      // "梁惠王章句上""公孙丑章句下"
      if (/^[\u4e00-\u9fa5]{1,8}章句[上下]$/.test(t)) return true;
      return false;
    }

    // ========== 章节解析（只解析一次，绝不重排） ==========
    function parseChapters(paragraphs, partial) {
      const chaps = [];
      let currentChapTitle = '卷首';
      let currentStart = 0;
      let foundTitleCount = 0;

      // 识别书前的"全书总目"块：连续 >=6 个卷/篇标题且彼此紧邻（间隔 <=2 段）。
      // 首屏阶段若命中它，说明正文还没读到，此刻的标题位置并非正文位置，目录暂不可用
      const _titleIdx = [];
      for (let i = 0; i < paragraphs.length; i++) {
        if (isChapterTitle(paragraphs[i].trim())) _titleIdx.push(i);
      }
      let _tocRun = 0, _runStart = 0;
      for (let k = 1; k <= _titleIdx.length; k++) {
        const gap = (k < _titleIdx.length) ? _titleIdx[k] - _titleIdx[k - 1] : 999;
        if (gap > 2) {
          if (k - _runStart >= 6) _tocRun = Math.max(_tocRun, k - _runStart);
          _runStart = k;
        }
      }
      if (partial && _tocRun >= 6) return [{ title: '__TOC__', start: 0, end: paragraphs.length }];

      for (let i = 0; i < paragraphs.length; i++) {
        const p = paragraphs[i].trim();
        if (isChapterTitle(p)) {
          foundTitleCount++;
          if (i > 0) {
            // 用"上一章的标题"闭合上一章（原实现误配成新标题，会导致目录标题与内容错位、点击跳到错误位置）
            chaps.push({
              title: currentChapTitle,
              start: currentStart,
              end: i
            });
          }
          currentChapTitle = p.replace(/\s+/g, ' ').substring(0, 30);
          currentStart = i;
        }
      }
      // 最后一章
      chaps.push({
        title: currentChapTitle,
        start: currentStart,
        end: paragraphs.length
      });

      // 如果全书确实没有识别到任何卷次标题（短篇），只分一段，不做"第X节"流水切分
      if (foundTitleCount === 0) {
        chaps.length = 0;
        // 短篇（<300段）全书作为一章
        if (paragraphs.length < BATCH_SIZE * 1.5) {
          chaps.push({ title: '全文', start: 0, end: paragraphs.length });
        } else {
          // 长篇无标题：按每200段分块，但不叫"第X节"，叫"分段"
          const blocks = Math.ceil(paragraphs.length / BATCH_SIZE);
          for (let i = 0; i < blocks; i++) {
            chaps.push({
              title: `分段 ${i+1}`,
              start: i * BATCH_SIZE,
              end: Math.min((i+1) * BATCH_SIZE, paragraphs.length)
            });
          }
        }
      } else {
        // 有真实卷次标题：去重，并剔除"只出现在书前总目里"的条目
        // （总目位置并非正文位置，若保留会让目录顺序错乱、点击跳不准）
        const _tocIdx = new Set();
        { let run = [], seen = new Set();
          for (let k = 0; k < _titleIdx.length; k++) {
            const i = _titleIdx[k];
            const tt = paragraphs[i].trim().replace(/\s+/g, ' ');
            const prevGap = (k > 0) ? i - _titleIdx[k - 1] : 999;
            // 与前一标题不相邻、或标题此前已出现过（正文重新开始），即总目块到此为止
            if (run.length && (prevGap > 2 || seen.has(tt))) {
              if (run.length >= 6) run.forEach(x => _tocIdx.add(x));
              run = []; seen = new Set();
            }
            run.push(i); seen.add(tt);
          }
          if (run.length >= 6) run.forEach(x => _tocIdx.add(x));
        }
        const _last = {};
        chaps.forEach((c, i) => { if (!_tocIdx.has(c.start)) _last[c.title] = i; });
        let filtered = chaps.filter((c, i) => _last[c.title] === i);
        if (!filtered.length) {   // 兜底：标题全落在总目里（少见），退回纯去重
          const _l2 = {};
          chaps.forEach((c, i) => { _l2[c.title] = i; });
          filtered = chaps.filter((c, i) => _l2[c.title] === i);
        }
        for (let i = 0; i < filtered.length; i++) {
          filtered[i].end = (i + 1 < filtered.length) ? filtered[i + 1].start : paragraphs.length;
        }
        return filtered;
      }
      return chaps;
    }

    // ========== 渲染段落范围 ==========
    function renderRange(start, end, append = true) {
      const container = document.getElementById('readerContent');
      if (!append) { container.innerHTML = ''; renderedEnd = 0; }
      if (start >= end || start >= allParagraphs.length) return;
      const endIdx = Math.min(end, allParagraphs.length);

      const frag = document.createDocumentFragment();
      for (let i = start; i < endIdx; i++) {
        const p = allParagraphs[i];
        if (!p) {
          // 占位：该段所在卷还没加载，显示"加载中…"
          const ph = document.createElement('p');
          ph.className = 'volume-placeholder';
          ph.id = `p-${i}`;
          ph.dataset.idx = i;
          ph.textContent = '…';
          ph.style.opacity = '0.3';
          frag.appendChild(ph);
          continue;
        }
        const el = document.createElement('p');
        if (isChapterTitle(p)) el.className = 'chapter-heading';
        el.id = `p-${i}`; el.dataset.idx = i;
        el.innerHTML = annotateConcepts(p);
        frag.appendChild(el);
      }
      container.appendChild(frag);
      renderedEnd = Math.max(renderedEnd, endIdx);

      const progress = Math.min(100, (renderedEnd / Math.max(1, allParagraphs.length)) * 100);
      document.getElementById('progressBar').style.width = `${progress}%`;
      if (searchTerm) highlightSearch();
    }

    // ========== split 模式：按需加载某一卷 ==========
    async function loadVolume(volIdx) {
      if (!splitMode || !splitIndex) return;
      const vol = splitIndex.volumes[volIdx];
      if (!vol) return;
      // 已加载过直接返回 resolved Promise
      if (loadedVolumes[vol.id]) return Promise.resolve();

      // 卷在 allParagraphs 中的起始位置
      const startP = volumeStartIdx[volIdx];
      const url = vol.file;
      try {
        const r = await fetch(url);
        if (!r.ok) return;
        const txt = await r.text();
        const paras = txt.split(/\n+/).map(s => s.trim()).filter(Boolean);
        loadedVolumes[vol.id] = paras;
        window.loadedVolumes = loadedVolumes;
        // 写入 allParagraphs
        for (let k = 0; k < paras.length; k++) {
          allParagraphs[startP + k] = paras[k];
        }
        // 把占位段落替换成真实段落（仅替换当前 DOM 中已存在的占位）
        const container = document.getElementById('readerContent');
        for (let k = 0; k < paras.length; k++) {
          const el = document.getElementById(`p-${startP + k}`);
          if (!el) continue;
          if (el.classList.contains('volume-placeholder')) {
            // 是占位，替换
            const p = paras[k];
            const newEl = document.createElement('p');
            if (isChapterTitle(p)) newEl.className = 'chapter-heading';
            newEl.id = `p-${startP + k}`; newEl.dataset.idx = startP + k;
            newEl.innerHTML = annotateConcepts(p);
            el.parentNode.replaceChild(newEl, el);
          }
        }
        // 加载完后更新进度条（段落真实渲染占比）
        const realParas = allParagraphs.filter(Boolean).length;
        const progress = Math.min(100, (realParas / Math.max(1, allParagraphs.length)) * 100);
        document.getElementById('progressBar').style.width = `${progress}%`;
      } catch (e) { /* ignore */ }
    }

    // ========== 滚动加载 ==========
    function setupScrollLoad() {
      window.addEventListener('scroll', () => {
        const now = Date.now();
        if (now - _scrollThrottle < 80) return; // 80ms 节流
        _scrollThrottle = now;
        const scrollBottom = window.innerHeight + window.scrollY;
        const docHeight = document.body.offsetHeight;
        if (splitMode && splitIndex) {
          // split 模式：根据当前滚动位置判断所在卷，确保其及下一卷已加载
          // 同时如果滚到文档末尾附近，追加渲染下一批段落占位
          ensureVolumesAroundViewport();
        } else if (scrollBottom >= docHeight - 800 && renderedEnd < allParagraphs.length) {
          renderRange(renderedEnd, renderedEnd + BATCH_SIZE, true);
        }
        updateActiveChapter();
      }, { passive: true });
      // 首屏渲染后主动检测一次，让目录激活状态与进度条正确
      setTimeout(updateActiveChapter, 100);
    }

    let _scrollThrottle = 0;
    let _lastVolsLoaded = new Set();
    // ========== split 模式：保证视口附近的卷都已加载 ==========
    function ensureVolumesAroundViewport() {
      if (!splitMode || !splitIndex) return;
      const scrollPos = window.scrollY + 140;
      // 找到当前所在卷
      let curVol = 0;
      for (let i = 0; i < volumeStartIdx.length; i++) {
        const el = document.getElementById(`p-${volumeStartIdx[i]}`);
        if (el && absTop(el) <= scrollPos) curVol = i;
      }
      // 只加载当前卷，以及紧接的下 1 卷（避免一口气拉完）
      const toLoad = new Set();
      toLoad.add(curVol);
      if (curVol + 1 < splitIndex.volumes.length) toLoad.add(curVol + 1);
      toLoad.forEach(v => {
        if (!_lastVolsLoaded.has(v)) {
          _lastVolsLoaded.add(v);
          loadVolume(v);
        }
      });

      // 如果当前已渲染的末尾距离视口底部不足两屏，补渲染后续段落的占位
      if (renderedEnd < allParagraphs.length) {
        const bottomEl = document.getElementById(`p-${Math.max(0, renderedEnd - 1)}`);
        if (bottomEl) {
          const bottom = absTop(bottomEl) + window.innerHeight * 2;
          if (scrollBottom() >= absTop(bottomEl)) {
            const to = Math.min(renderedEnd + BATCH_SIZE * 2, allParagraphs.length);
            renderRange(renderedEnd, to, true);
          }
        }
      }
    }
    function scrollBottom() { return window.innerHeight + window.scrollY; }

    // ========== 当前章节高亮 ==========
    function updateActiveChapter() {
      const scrollPos = window.scrollY + 140;
      for (let i = chapters.length - 1; i >= 0; i--) {
        const el = document.getElementById(`p-${chapters[i].start}`);
        if (el && absTop(el) <= scrollPos) {
          if (currentChapter !== i) {
            currentChapter = i;
            document.querySelectorAll('.chapter-list li').forEach((li, idx) => {
              li.classList.toggle('active', idx === i);
            });
            // 把当前章节滚动到目录可见区
            const active = document.querySelector('.chapter-list li.active');
            if (active) {
              const sb = document.getElementById('chapterSidebar');
              const sbRect = sb.getBoundingClientRect();
              const aRect = active.getBoundingClientRect();
              if (aRect.top < sbRect.top || aRect.bottom > sbRect.bottom) {
                active.scrollIntoView({ block: 'nearest' });
              }
            }
          }
          break;
        }
      }
    }

    // 计算元素相对文档顶部的绝对位置（offsetTop 受 offsetParent 影响，不可靠）
    function absTop(el) { return el.getBoundingClientRect().top + window.scrollY; }

    // ========== 跳转到章节（保证先加载卷+渲染，再滚动） ==========
    function jumpToChapter(index) {
      const chap = chapters[index];
      if (!chap) return;
      currentChapter = index;

      if (splitMode && splitIndex) {
        // split 模式：找到该章节所在卷，确保已加载
        const chapStart = chap.start;
        let volIdx = 0;
        for (let i = 0; i < volumeStartIdx.length; i++) {
          if (volumeStartIdx[i] <= chapStart) volIdx = i;
        }
        const volEnd = (volIdx + 1 < splitIndex.volumes.length)
          ? volumeStartIdx[volIdx + 1]
          : allParagraphs.length;
        // 只渲染占位到目标卷末尾（避免一次渲几万个 DOM）
        const needEnd = Math.min(volEnd, chapStart + BATCH_SIZE * 2);
        if (renderedEnd < needEnd) renderRange(renderedEnd, needEnd, true);
        // 加载目标卷（已加载则立即 resolve）
        loadVolume(volIdx).then(() => {
          // 等 DOM 替换完成后再滚动
          requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(() => {
            const target = document.getElementById(`p-${chapStart}`);
            if (target) window.scrollTo({ top: absTop(target) - 130, behavior: 'auto' });
            document.querySelectorAll('.chapter-list li').forEach((li, idx) => {
              li.classList.toggle('active', idx === index);
            });
            closeMobileToc();
          }, 50)));
        });
      } else {
        // 原整文件模式
        const needEnd = Math.min(chap.end + BATCH_SIZE, allParagraphs.length);
        if (renderedEnd < needEnd) renderRange(renderedEnd, needEnd, true);
        requestAnimationFrame(() => setTimeout(() => {
          const target = document.getElementById(`p-${chap.start}`);
          if (target) window.scrollTo({ top: absTop(target) - 130, behavior: 'auto' });
          document.querySelectorAll('.chapter-list li').forEach((li, idx) => {
            li.classList.toggle('active', idx === index);
          });
          closeMobileToc();
        }, 80));
      }
    }

    // ========== 渲染章节目录 ==========
    function renderChapterList() {
      const list = document.getElementById('chapterList');
      // 首屏只读到书前总目时，目录位置不可用，先给出提示，待全文读完自动补全
      if (chapters.length === 1 && chapters[0].title === '__TOC__') {
        list.innerHTML = '<li class="toc-loading">卷次目录载入中…</li>';
        return;
      }
      list.innerHTML = chapters.map((chap, idx) =>
        `<li data-idx="${idx}" title="${chap.title}">${chap.title}</li>`
      ).join('');
      list.querySelectorAll('li').forEach(li => {
        li.addEventListener('click', () => {
          jumpToChapter(parseInt(li.dataset.idx));
        });
      });
    }

    // ========== 加载书单（用于上/下一部） ==========
    async function loadBooksIndex() {
      try {
        // library.html 里已经有 BOOKS_DATA，为避免重复硬编码，这里复用同一结构
        // 我们直接 fetch library.html 解析，或者简单地从 books/ 目录无法列清单，因此
        // 采用：直接在页面内嵌与 library.html 同步的索引（通过 common.js 暴露）
        if (typeof BOOKS_DATA !== 'undefined') {
          BOOKS_INDEX = BOOKS_DATA.map(b => ({ cat: b[0], name: b[1] }));
        }
      } catch (e) { /* ignore */ }
      // 如果没拿到索引，按钮保持 disabled
      updateNavButtons();
    }
    function updateNavButtons() {
      const prev = document.getElementById('prevBtn');
      const next = document.getElementById('nextBtn');
      if (BOOKS_INDEX.length === 0) {
        prev.disabled = true; next.disabled = true;
        prev.title = '暂无书单索引';
        next.title = '暂无书单索引';
        return;
      }
      currentBookIdx = BOOKS_INDEX.findIndex(b => b.cat === bookCat && b.name === bookName);
      prev.disabled = currentBookIdx <= 0;
      next.disabled = currentBookIdx < 0 || currentBookIdx >= BOOKS_INDEX.length - 1;
      prev.title = currentBookIdx > 0 ? `上一部：${BOOKS_INDEX[currentBookIdx-1].name}` : '已是第一部';
      next.title = currentBookIdx >= 0 && currentBookIdx < BOOKS_INDEX.length - 1 ? `下一部：${BOOKS_INDEX[currentBookIdx+1].name}` : '已是最后一部';
    }
    function gotoBook(offset) {
      if (!BOOKS_INDEX.length || currentBookIdx < 0) return;
      const target = BOOKS_INDEX[currentBookIdx + offset];
      if (!target) return;
      const url = `reader.html?b=${encodeURIComponent(target.cat)}/${encodeURIComponent(target.name)}.txt`;
      window.location.href = url;
    }

    // ========== 移动端目录 ==========
    function openMobileToc() {
      document.getElementById('chapterSidebar').classList.add('show');
      document.getElementById('tocMask').classList.add('show');
    }
    function closeMobileToc() {
      document.getElementById('chapterSidebar').classList.remove('show');
      document.getElementById('tocMask').classList.remove('show');
    }

    // ========== 页内搜索 ==========
    function clearSearchHits() {
      document.querySelectorAll('mark.search-hit, mark.search-current').forEach(m => {
        const parent = m.parentNode;
        parent.replaceChild(document.createTextNode(m.textContent), m);
        parent.normalize();
      });
      searchHits = [];
      currentHitIdx = -1;
      document.getElementById('searchCount').textContent = '';
    }
    function highlightSearch() {
      clearSearchHits();
      if (!searchTerm) return;
      const term = searchTerm;
      const paras = document.querySelectorAll('.reader-content p:not(.chapter-heading)');
      let idx = 0;
      paras.forEach(p => {
        // 跳过已经在其他标记里的文本的简单实现：只在文本节点里替换
        const walker = document.createTreeWalker(p, NodeFilter.SHOW_TEXT, null);
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        nodes.forEach(node => {
          const text = node.nodeValue;
          const lower = text.toLowerCase();
          const tLower = term.toLowerCase();
          let pos = 0;
          const frag = document.createDocumentFragment();
          let last = 0;
          while ((pos = lower.indexOf(tLower, last)) !== -1) {
            if (pos > last) frag.appendChild(document.createTextNode(text.substring(last, pos)));
            const mark = document.createElement('mark');
            mark.className = 'search-hit';
            mark.dataset.hit = idx++;
            mark.textContent = text.substring(pos, pos + term.length);
            frag.appendChild(mark);
            searchHits.push(mark);
            last = pos + term.length;
          }
          if (last < text.length) frag.appendChild(document.createTextNode(text.substring(last)));
          if (last > 0) node.parentNode.replaceChild(frag, node);
        });
      });
      document.getElementById('searchCount').textContent = searchHits.length ? `共${searchHits.length}处` : '无结果';
      currentHitIdx = -1;
      if (searchHits.length) gotoHit(0);
    }
    function gotoHit(i) {
      if (!searchHits.length) return;
      searchHits.forEach(m => m.classList.remove('search-current'));
      currentHitIdx = (i + searchHits.length) % searchHits.length;
      const m = searchHits[currentHitIdx];
      m.classList.add('search-current');
      m.scrollIntoView({ block: 'center', behavior: 'smooth' });
      document.getElementById('searchCount').textContent = `${currentHitIdx+1}/${searchHits.length}`;
    }

    // ========== 主加载 ==========
    async function loadContent() {
      try {
        // 先等预取的切分索引结果
        const splitIdx = window.__splitPreload ? await window.__splitPreload : null;
        window.__splitPreload = null;

        if (splitIdx && splitIdx.volumes && splitIdx.volumes.length >= 2) {
          // ========== 按卷加载模式（split mode）==========
          splitMode = true;
          splitIndex = splitIdx;
          loadedVolumes = {};
          // 同步到 window
          window.splitMode = true;
          window.splitIndex = splitIdx;
          window.loadedVolumes = loadedVolumes;
          // 预计算每卷在 allParagraphs 里的起始段落位置
          volumeStartIdx = [];
          let pCount = 0;
          for (let i = 0; i < splitIdx.volumes.length; i++) {
            volumeStartIdx.push(pCount);
            // 优先用真实行数，没有的话按 size 估算（1个汉字≈3字节，每段约30字≈100字节）
            const est = splitIdx.volumes[i].lines || Math.ceil(splitIdx.volumes[i].size / 100);
            pCount += est;
          }
          // allParagraphs 初始化为稀疏数组（用 null 占位），长度 = 总段落估算
          allParagraphs = new Array(pCount).fill(null);

          // 用切分索引直接生成章节目录（100% 精准，无需等待全文）
          chapters = splitIdx.volumes.map((v, i) => ({
            title: v.title,
            start: volumeStartIdx[i],
            end: (i + 1 < splitIdx.volumes.length) ? volumeStartIdx[i + 1] : pCount,
            volIdx: i,
          }));
          window.chapters = chapters;
          tocReady = true;
          renderChapterList();

          // 首屏：立即加载第 1 卷
          await loadVolume(0);
          // 渲染第 1 卷的段落（并预留前 2 屏的占位，方便滚动感知）
          renderRange(0, splitIdx.volumes[0].lines + Math.min(splitIdx.volumes[1] ? splitIdx.volumes[1].lines : 0, BATCH_SIZE), false);
          setupScrollLoad();

          // 恢复阅读位置
          restoreReadPos();
          saveReadPosOnScroll();

          // 静默预加载第 2 卷（仅一次，不链式）
          if (splitIdx.volumes.length > 1) setTimeout(() => loadVolume(1), 600);
          return;
        }

        // ========== 整文件流式加载模式（小书/未切分书） ==========
        const bookUrl = 'books/' + bookPath.split('/').map(encodeURIComponent).join('/');
        const FIRST_CHARS = 9000;

        const decoder = new TextDecoder('utf-8');
        let receivedText = '';
        let streamDone = false;

        let response = null;
        // 优先使用预加载结果；预加载失败或被中断则重新发起请求
        if (window.__bookPreloadUrl === bookUrl && window.__bookPreload) {
          try {
            const preResp = await window.__bookPreload;
            if (preResp && preResp.ok && !preResp.bodyUsed) {
              response = preResp;
            }
          } catch (e) {
            console.warn('预加载失败，重新请求:', e);
          }
        }
        if (!response) response = await fetch(bookUrl);
        if (!response.ok) throw new Error(`文件未找到 (HTTP ${response.status})`);

        let reader = response.body.getReader();
        while (receivedText.length < FIRST_CHARS) {
          const { done, value } = await reader.read();
          if (done) { streamDone = true; break; }
          receivedText += decoder.decode(value, { stream: true });
        }
        allParagraphs = receivedText.split(/\n+/).filter(p => p.trim());
        chapters = parseChapters(allParagraphs, true);
        window.chapters = chapters;
        window.allParagraphs = allParagraphs;
        renderChapterList();
        renderRange(0, Math.min(BATCH_SIZE, allParagraphs.length), false);
        setupScrollLoad();

        restoreReadPos();

        // 后台继续加载剩余部分
        (async function loadRest() {
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            receivedText += decoder.decode(value, { stream: true });
          }
          allParagraphs = receivedText.split(/\n+/).filter(p => p.trim());
          chapters = parseChapters(allParagraphs);
          tocReady = true;
          renderChapterList();
        })();

        saveReadPosOnScroll();

      } catch (e) {
        console.error('加载失败:', e);
        document.getElementById('readerContent').innerHTML = `
          <div class="reader-loading">
            抱歉，未能加载该典籍（${e.message}）
            <small>该典籍可能未收录，或网络暂时不可用，请返回全文库另选一部</small>
          </div>
        `;
      }
    }

    function restoreReadPos() {
      try {
        const saved = localStorage.getItem('readPos_' + bookPath);
        if (saved) {
          const pos = parseInt(saved);
          setTimeout(() => window.scrollTo(0, pos), 150);
        }
      } catch(e) {}
    }
    function saveReadPosOnScroll() {
      window.addEventListener('beforeunload', () => {
        try { localStorage.setItem('readPos_' + bookPath, window.scrollY); } catch(e) {}
      });
      window.addEventListener('scroll', () => {
        try { localStorage.setItem('readPos_' + bookPath, window.scrollY); } catch(e) {}
      }, { passive: true });
    }

    // ========== 按钮事件 ==========
    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = 'library.html';
    });
    document.getElementById('prevBtn').addEventListener('click', () => gotoBook(-1));
    document.getElementById('nextBtn').addEventListener('click', () => gotoBook(1));
    document.getElementById('tocBtn').addEventListener('click', openMobileToc);
    document.getElementById('tocMask').addEventListener('click', closeMobileToc);

    // 搜索
    const searchInput = document.getElementById('readerSearch');
    let searchTimer;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      const val = e.target.value.trim();
      searchTimer = setTimeout(() => {
        searchTerm = val;
        // 搜索前先确保至少渲染到 600 段或当前卷+下一卷
        if (splitMode && splitIndex) {
          ensureVolumesAroundViewport();
          // 追加渲染到至少视口下 1000 段的位置
          if (renderedEnd < Math.min(volumeStartIdx[Math.min(currentChapter+2, splitIndex.volumes.length-1)] || allParagraphs.length, allParagraphs.length)) {
            renderRange(renderedEnd, Math.min(renderedEnd + BATCH_SIZE*3, allParagraphs.length), true);
          }
        } else {
          if (renderedEnd < Math.min(600, allParagraphs.length)) {
            renderRange(renderedEnd, Math.min(600, allParagraphs.length), true);
          }
        }
        highlightSearch();
      }, 250);
    });
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (searchHits.length) gotoHit(e.shiftKey ? currentHitIdx - 1 : currentHitIdx + 1);
      } else if (e.key === 'Escape') {
        searchInput.value = '';
        searchTerm = '';
        clearSearchHits();
      }
    });

    // ========== 启动 ==========
    loadBooksIndex();
    loadContent();

    // 支持从检索页带关键词进入：reader.html?b=xxx&q=关键词 —— 载入后自动高亮
    const qParam = new URLSearchParams(window.location.search).get('q');
    if (qParam) {
      setTimeout(() => {
        searchInput.value = qParam;
        searchTerm = qParam;
        if (renderedEnd < Math.min(600, allParagraphs.length)) {
          renderRange(renderedEnd, Math.min(600, allParagraphs.length), true);
        }
        highlightSearch();
      }, 900);
    }

    // 支持从章句导航带anchor进入：reader.html?b=xxx&anchor=xxx
    if (targetAnchor) {
      const jumpToAnchor = () => {
        let targetPos = 0;
        // 1. 按卷锚点 vol-X
        if (targetAnchor.startsWith('vol-')) {
          const volId = parseInt(targetAnchor.replace('vol-',''));
          if (splitIndex && volumeStartIdx[volId-1] !== undefined) {
            targetPos = volumeStartIdx[volId-1];
            // 确保该卷已加载
            if (!loadedVolumes[volId]) loadVolume(volId);
          }
        } 
        // 2. 字符位置锚点 cXXX / bXXX（按2万字分块）
        else if (targetAnchor.startsWith('c') || targetAnchor.startsWith('b')) {
          const charPos = parseInt(targetAnchor.slice(1));
          if (!isNaN(charPos)) {
            // 找到对应段落
            let curChars = 0;
            for (let i=0; i<allParagraphs.length; i++) {
              curChars += allParagraphs[i].length;
              if (curChars >= charPos) {
                targetPos = i;
                break;
              }
            }
          }
        }
        // 渲染到目标位置并滚动
        if (targetPos > 0) {
          renderRange(0, Math.min(targetPos + 50, allParagraphs.length), true);
          setTimeout(() => {
            const el = document.getElementById('p-'+targetPos);
            if (el) {
              el.scrollIntoView({behavior:'smooth', block:'start'});
              el.classList.add('highlight-target');
              setTimeout(()=>el.classList.remove('highlight-target'), 2000);
            }
          }, 300);
        }
      };
      // 等内容加载完成后跳转
      setTimeout(jumpToAnchor, splitMode ? 1200 : 800);
    }
  </script>
</body>

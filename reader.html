<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>原典阅读 · 儒藏本体论</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="style/common.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-logo"><span class="sym">儒</span>儒藏</div>
  <nav class="topbar-nav">
    <a href="index.html">总纲</a>
    <a href="ontology.html">本体</a>
    <a href="graph.html">关系</a>
    <a href="dictionary.html">词典</a>
    <a href="zhangju.html">章句</a>
    <a href="scholars.html">儒者</a>
    <a href="schools.html">学派</a>
    <a href="debate.html">论争</a>
    <a href="library.html">典籍</a>
    <a href="search.html">检索</a>
    <a href="reader.html" class="active">阅读</a>
    <a href="lineage.html">谱系</a>
    <a href="timeline.html">年谱</a>
  </nav>
  <div class="topbar-right"><div class="theme-dots" id="themeDots"></div></div>
</header>

<div class="main-with-sidebar">
  <aside class="sidebar global-sidebar" id="globalSidebar"></aside>
  <aside class="sidebar book-sidebar" id="bookSidebar"></aside>
  <div class="main">
    <div class="reader-controls">
      <button id="btnSmall">小</button>
      <button id="btnMed" class="active">中</button>
      <button id="btnLarge">大</button>
      <button id="btnVertical">竖排</button>
      <button id="btnHorizontal" class="active">横排</button>
      <span style="flex:1"></span>
      <span id="bookTitle" style="font-size:14px;color:var(--gold);letter-spacing:2px"></span>
    </div>

    <!-- 注疏/批注切换 -->
    <div class="pingdian-toolbar">
      <div class="commentary-tabs" id="commentaryTabs"></div>
      <label class="pd-toggle"><input type="checkbox" id="pdToggle" checked> 显示名家批注</label>
    </div>
    <!-- 章末总评容器 -->
    <div class="chapter-pingdian-area" id="chapterPingdian"></div>

    <!-- 章节目录（小侧边） -->
    <div class="chapter-sidebar" id="chapterSidebar" style="position:fixed;right:0;top:64px;width:0;padding:0;border:none;transition:width .3s;z-index:5"></div>
    <button id="toggleToc" class="btn btn-ghost" style="margin-bottom:12px;display:none">显 示 章 节 目 录</button>

    <!-- 正文 -->
    <div class="reader-content" id="content" style="font-size:18px">
      <div style="text-align:center;color:var(--ink-3);padding:80px 0;font-size:14px;letter-spacing:2px">
        请从左侧或典籍库选择典籍阅读
      </div>
    </div>
  </div>
</div>

<footer class="footer">儒藏本体论 · 原典阅读</footer>

<script src="data/common.js"></script>
<script src="data/ontology-enhance.js"></script>
<script src="data/commentary.js"></script>
<script>
// 全局侧边栏（主题切换+主导航+核心典籍）——走统一 initPage，注入汉堡+抽屉
(function(){
  function doInit(){
    if (typeof initPage === 'function') {
      initPage('reader.html');
    } else setTimeout(doInit,50);
  }
  doInit();
})();

// 侧边栏书单（核心典籍优先）
const CORE_BOOKS=['大学章句','中庸章句','论语','孟子','周易','尚书','诗经','礼记','周礼','仪礼',
  '春秋左传','春秋公羊传','春秋谷梁传','孝经','朱子语类','传习录','近思录','二程遗书','四书大全'];
const sidebar=document.getElementById('bookSidebar');
const catMap={};BOOKS_DATA.forEach(b=>{if(!catMap[b[0]])catMap[b[0]]=[];catMap[b[0]].push(b[1])});
let html='';
html+='<h4>核心典籍</h4>';
CORE_BOOKS.forEach(n=>{html+='<a href="?b='+encodeURIComponent(findPath(n))+'">'+n+'</a>'});
html+='<h4>全部分类</h4>';
Object.entries(catMap).forEach(([cat,books])=>{
  html+='<h4 style="font-size:12px;color:var(--ink-dim);margin-top:14px">'+cat+'（'+books.length+'）</h4>';
  books.slice(0,20).forEach(n=>{html+='<a href="?b='+encodeURIComponent(cat+'/'+n+'.txt')+'">'+n+'</a>'});
  if(books.length>20)html+='<a href="library.html?cat='+encodeURIComponent(cat)+'" style="font-size:12px;color:var(--ink-dim)">查看全部 '+books.length+' 部→</a>';
});
sidebar.innerHTML=html;
function findPath(name){
  for(const b of BOOKS_DATA){if(b[1]===name)return b[0]+'/'+b[1]+'.txt'}
  return '四书/'+name+'.txt';
}

// 字号切换
let fs=18;
function setFs(n){fs=n;document.getElementById('content').style.fontSize=n+'px';
  ['btnSmall','btnMed','btnLarge'].forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById(n===16?'btnSmall':n===18?'btnMed':'btnLarge').classList.add('active');
}
document.getElementById('btnSmall').onclick=()=>setFs(16);
document.getElementById('btnMed').onclick=()=>setFs(18);
document.getElementById('btnLarge').onclick=()=>setFs(22);
let vertical=false;
document.getElementById('btnVertical').onclick=()=>{vertical=true;document.getElementById('content').classList.add('reader-vertical');document.getElementById('btnVertical').classList.add('active');document.getElementById('btnHorizontal').classList.remove('active')};
document.getElementById('btnHorizontal').onclick=()=>{vertical=false;document.getElementById('content').classList.remove('reader-vertical');document.getElementById('btnHorizontal').classList.add('active');document.getElementById('btnVertical').classList.remove('active')};

// 加载书籍
const params=new URLSearchParams(location.search);
const book=params.get('b');
const findQ=params.get('find')||params.get('q')||'';
const chIdx=parseInt(params.get('ch')||params.get('chIdx')||'-1');
const content=document.getElementById('content');
const bookTitle=document.getElementById('bookTitle');

if(book){loadBook(book)}
function shortName(b){return b.replace('.txt','').split('/').pop()}
function detectCommentaryBook(short){
  for(const k of Object.keys(COMMENTARY_LAYERS)){
    if(short.includes(k)||k.includes(short))return k;
  }
  return null;
}
function loadBook(path){
  const short=shortName(path);
  bookTitle.textContent=short;
  content.innerHTML='<div style="text-align:center;color:var(--gold);padding:40px"><div class="reader-loading" style="border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;width:32px;height:32px;animation:compassSpin 1s linear infinite;margin:0 auto 16px"></div>正在加载…</div>';
  // 注疏tab
  const cmtKey=detectCommentaryBook(short);
  const tabs=document.getElementById('commentaryTabs');
  if(cmtKey){
    tabs.style.display='flex';
    tabs.innerHTML=COMMENTARY_LAYERS[cmtKey].map((l,i)=>'<button data-layer="'+l.key+'" class="'+(i===0?'active':'')+'">'+l.name+'</button>').join('');
    tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{tabs.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderLayer(b.dataset.layer)});
  }else{tabs.style.display='none';tabs.innerHTML=''}

  // 按卷模式检测
  fetch('books-split/manifest.json').then(r=>r.json()).then(man=>{
    if(man[path])loadSplitBook(path,man[path]);
    else loadFullBook(path);
  }).catch(()=>loadFullBook(path));
}
function renderRawText(text){
  // 段落化
  const lines=text.split(/\r?\n/);
  let out='<h1>'+shortName(book)+'</h1>';
  let chapOpen=false;
  let curChapterId='';
  window.__chapterSeq = window.__chapterSeq || 0;
  lines.forEach(line=>{
    line=line.trim();
    if(!line)return;
    if(/^[卷篇章]+\s*[一二三四五六七八九十百零〇\d]+/.test(line)||/^大学|^中庸|^论语|^孟子/.test(line)&&line.length<20){
      // 章前先收束：输出上一章的章末总评
      if(curChapterId){
        out+=renderEndNotes(book,curChapterId);
      }
      window.__chapterSeq++;
      curChapterId=detectChapterId(book,line,window.__chapterSeq);
      out+='<div class="chapter-title" id="ch-'+(chapOpen?++window.__ch:0)+'" data-cid="'+curChapterId+'">'+escapeHtml(line)+'</div>';chapOpen=true;
      out+=renderHeadNotes(book,curChapterId);
    }else{
      out+='<p data-cid="'+curChapterId+'">'+escapeHtml(line)+'</p>';
    }
  });
  // 最后一章章末总评
  if(curChapterId) out+=renderEndNotes(book,curChapterId);
  content.innerHTML=out;
  // 概念标注
  annotateConceptsIn(content);
  // 注入夹批/旁批
  injectInterAndSideNotes(book);
  // 定位
  jumpToTarget();
  // 批注开关
  setupPingdianToggle();
}

// 章标题→章节ID简单匹配
function detectChapterId(bookId,title,seq){
  const t=title.replace(/\s/g,'');
  const map={
    // 论语·学而
    '学而第一':'xueer-1','學而第一':'xueer-1',
    '学而':'xueer-1','學而':'xueer-1',
    // 论语·为政
    '为政第二':'weizheng-1','為政第二':'weizheng-1',
    // 论语·里仁
    '里仁第四':'liren-8','裡仁第四':'liren-8',
    // 论语·述而
    '述而第七':'shuer-6','述而':'shuer-6',
    // 论语·子罕
    '子罕第九':'zihan-4','子罕':'zihan-4',
    // 论语·颜渊
    '颜渊第十二':'yanyuan-1','顏淵第十二':'yanyuan-1','颜渊':'yanyuan-1',
    // 大学
    '大学':'jing','大學':'jing','大学章句':'jing','大學章句':'jing','经一章':'jing',
    // 中庸
    '中庸':'jing-tiandao','中庸章句':'jing-tiandao',
    // 孟子
    '梁惠王上':'lianghuiwang-shang-1','梁惠王上第一章':'lianghuiwang-shang-1',
    '公孙丑上':'gongsunchou-shang-2','公孫丑上':'gongsunchou-shang-2','公孙丑上第二章':'gongsunchou-shang-2',
    '告子上':'gaozi-shang-1','告子上第一章':'gaozi-shang-1',
  };
  if(map[t]) return map[t];
  // 含关键字的回退
  if(t.indexOf('学而')===0||t.indexOf('學而')===0) return 'xueer-'+seq;
  if(t.indexOf('里仁')===0||t.indexOf('裡仁')===0) return 'liren-'+seq;
  if(t.indexOf('述而')===0) return 'shuer-'+seq;
  if(t.indexOf('子罕')===0) return 'zihan-'+seq;
  if(t.indexOf('颜渊')===0||t.indexOf('顏淵')===0) return 'yanyuan-'+seq;
  if(t.indexOf('梁惠王上')===0) return 'lianghuiwang-shang-'+seq;
  if(t.indexOf('公孙丑上')===0||t.indexOf('公孫丑上')===0) return 'gongsunchou-shang-'+seq;
  if(t.indexOf('告子上')===0) return 'gaozi-shang-'+seq;
  return '';
}

function renderHeadNotes(bookId,cid){
  const notes=(window.getCommentary&&window.getCommentary(bookId,cid)||[]).filter(n=>n.type==='head');
  if(!notes.length) return '';
  return '<div class="pingdian-head" data-pd="head"><div class="pd-head-label">【眉批】</div>'+
    notes.map(n=>'<div class="pd-item"><span class="pd-scholar">【'+n.dynasty+'·'+n.scholar+'】</span><span class="pd-text">'+escapeHtml(n.text)+'</span></div>').join('')+
    '</div>';
}
function renderEndNotes(bookId,cid){
  const notes=(window.getCommentary&&window.getCommentary(bookId,cid)||[]).filter(n=>n.type==='end');
  if(!notes.length) return '';
  return '<div class="pingdian-end" data-pd="end"><div class="pd-end-title">章末总评</div>'+
    notes.map(n=>'<div class="pd-item pd-end-item"><span class="pd-scholar pd-end-scholar">'+n.dynasty+'·'+n.scholar+'曰：</span><span class="pd-text">'+escapeHtml(n.text)+'</span></div>').join('')+
    '</div>';
}

function injectInterAndSideNotes(bookId){
  const all=window.getCommentary?window.getAllCommentaries():[];
  const notes=all.filter(n=>n.bookId===bookId&&(n.type==='inter'||n.type==='side'));
  if(!notes.length) return;
  content.querySelectorAll('p').forEach(p=>{
    const text=p.textContent;
    // 夹批：找 anchor 命中的句子
    notes.forEach(n=>{
      if(!n.anchor) return;
      const anchor=n.anchor;
      if(text.indexOf(anchor)>=0){
        const jp=document.createElement('span');
        jp.className='pingdian-inter';
        jp.setAttribute('data-scholar',n.dynasty+'·'+n.scholar);
        jp.title=n.dynasty+'·'+n.scholar+' 夹批：'+n.text;
        jp.innerHTML='<span class="pd-inter-text">'+escapeHtml(n.text)+'</span><span class="pd-inter-author">——'+n.scholar+'</span>';
        // 把 anchor 替换为 anchor+夹批
        const esc=anchor.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
        p.innerHTML=p.innerHTML.replace(new RegExp(esc,'g'),anchor+'<span class="pd-anchor"></span>');
        const anchorEl=p.querySelector('.pd-anchor');
        if(anchorEl){anchorEl.replaceWith(jp);anchorEl.remove()}
      }
    });
    // 旁批：在段落右侧
    const sideNotes=notes.filter(n=>n.type==='side'&&text.indexOf(n.anchor||'__NOPE__')<0&&p.textContent.length>10&&!p.dataset.hasSide);
    // 简化：对有眉批但无夹批命中的段，旁批显示
  });
}

function setupPingdianToggle(){
  const t=document.getElementById('pdToggle');if(!t)return;
  const apply=()=>{document.documentElement.setAttribute('data-pingdian',t.checked?'on':'off')};
  t.onchange=apply;apply();
}

function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function annotateConceptsIn(el){
  if(!window.__conceptRe){
    const keys=Object.keys(CONCEPTS).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
    window.__conceptRe=new RegExp('('+keys.join('|')+')','g');
  }
  el.querySelectorAll('p,.chapter-title').forEach(p=>{
    if(p.dataset.annotated)return;
    p.innerHTML=p.innerHTML.replace(window.__conceptRe,(m)=>{
      return '<span class="concept-tag" onclick="showConcept(event,\''+m+'\')">'+m+'</span>';
    });
    p.dataset.annotated='1';
  });
}
window.showConcept=function(e,name){
  document.querySelectorAll('.concept-popup').forEach(x=>x.remove());
  const c=CONCEPTS[name];if(!c)return;
  const p=document.createElement('div');p.className='concept-popup';
  p.innerHTML='<h5>'+name+'</h5><div style="color:var(--ink-2);line-height:1.9;margin-bottom:8px">'+c.def+'</div><div style="color:var(--ink-3);font-size:12px">'+c.source+'</div><div style="margin-top:8px;text-align:right"><a href="dictionary.html#'+encodeURIComponent(name)+'" style="color:var(--gold);font-size:12px">查看词条→</a></div>';
  p.style.left=e.pageX+'px';p.style.top=(e.pageY+20)+'px';
  document.body.appendChild(p);
  setTimeout(()=>document.addEventListener('click',()=>p.remove(),{once:true}));
};
function loadFullBook(path){
  fetch('books/'+path).then(r=>r.text()).then(text=>renderRawText(text));
}
function loadSplitBook(path,meta){
  // 拼接所有卷
  const urls=meta.volumes.map(v=>v.file);
  Promise.all(urls.slice(0,8).map(u=>fetch(u).then(r=>r.text()))).then(texts=>{
    renderRawText(texts.join('\n'));
    // 后台加载剩余
    urls.slice(8).reduce((p,u)=>p.then(()=>fetch(u).then(r=>r.text())).then(t=>{
      content.innerHTML+=t.split(/\r?\n/).filter(l=>l.trim()).map(l=>'<p>'+escapeHtml(l.trim())+'</p>').join('');
      annotateConceptsIn(content);
    }),Promise.resolve());
  });
}
function jumpToTarget(){
  if(chIdx>=0){
    const el=document.getElementById('ch-'+chIdx);if(el){el.scrollIntoView();highlightEl(el);return}
  }
  if(findQ){
    // 搜索首句
    const all=content.querySelectorAll('p');
    for(const p of all){
      if(p.textContent.includes(findQ.slice(0,Math.min(findQ.length,12)))){
        p.scrollIntoView({behavior:'smooth',block:'center'});highlightEl(p);return;
      }
    }
    // 全文findQ
    setTimeout(()=>{
      for(const p of document.querySelectorAll('#content p')){
        if(p.textContent.includes(findQ.slice(0,6))){p.scrollIntoView({behavior:'smooth',block:'center'});highlightEl(p);return}
      }
    },800);
  }
}
function highlightEl(el){
  el.style.background='rgba(200,66,46,.25)';
  el.style.padding='6px 10px';el.style.borderRadius='4px';
  setTimeout(()=>{el.style.transition='background 2s';el.style.background='transparent';el.style.padding='';el.style.borderRadius='';},3000);
}
function renderLayer(layerKey){
  // 注疏层切换（以简单浮层方式呈现注释，按段落匹配）
  document.querySelectorAll('.commentary-note').forEach(n=>n.remove());
  if(layerKey==='jing')return;
  content.querySelectorAll('p').forEach(p=>{
    // 为演示，仅在含概念名段落后加注疏提示（完整版可加载对应注疏文本）
    const text=p.textContent;
    Object.keys(CONCEPTS).forEach(k=>{
      if(text.includes(k)&&CONCEPTS[k].source){
        const note=document.createElement('div');note.className='commentary-note';
        note.innerHTML='<span class="label">注</span>'+CONCEPTS[k].source;
        p.after(note);
      }
    });
  });
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>原典深度阅读 · 儒藏本体论</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="style/common.css">
<style>
/* ===== 深度阅读器专用样式 ===== */
.reader-deep{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;margin-top:12px}
.reader-deep.single{grid-template-columns:minmax(0,1fr)}
.reader-deep .pane{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 22px;min-height:400px;position:relative;min-width:0;overflow-x:hidden}
.reader-deep .pane h2.pane-title{font-size:14px;letter-spacing:4px;color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:8px;margin:0 0 14px 0;display:flex;align-items:center;gap:8px}
.reader-deep .pane h2.pane-title .sym{font-size:16px}
.reader-deep .pane .pane-sub{font-size:12px;color:var(--ink-3);margin-left:auto;letter-spacing:1px}

/* 章 */
.deep-chapter{margin-bottom:30px}
.deep-chapter .ch-head{display:flex;align-items:baseline;gap:12px;margin:18px 0 14px;border-left:3px solid var(--gold);padding-left:10px}
.deep-chapter .ch-title{font-size:20px;color:var(--gold);letter-spacing:3px;font-weight:500}
.deep-chapter .ch-juan{font-size:12px;color:var(--ink-3);letter-spacing:2px}
.deep-chapter .ch-summary{font-size:13px;color:var(--ink-3);margin-top:2px}

/* 节（pericope） */
.deep-pericope{margin:14px 0;padding:10px 0;border-bottom:1px dashed var(--line)}
.deep-pericope:last-child{border-bottom:none}
.deep-pericope .per-text{font-size:var(--reader-fs,18px);line-height:2;color:var(--ink);letter-spacing:1px}
.deep-pericope .per-text .term{color:var(--cinnabar);border-bottom:1px dotted var(--cinnabar);cursor:help;padding:0 1px;transition:background .2s}
.deep-pericope .per-text .term:hover{background:rgba(192,57,43,.08)}
.deep-pericope .per-text .term.active{background:rgba(212,168,83,.18);border-bottom-color:var(--gold)}
.deep-pericope .per-label{font-size:12px;color:var(--ink-3);letter-spacing:2px;margin-bottom:4px}

/* 注疏卡 */
.cmt-list{margin-top:8px}
.cmt-card{background:rgba(212,168,83,.05);border-left:2px solid var(--gold);padding:10px 14px;margin:8px 0;border-radius:0 4px 4px 0;position:relative}
.cmt-card.cmt-layer-注{border-left-color:#a78b5a}
.cmt-card.cmt-layer-疏{border-left-color:#c0392b}
.cmt-card.cmt-layer-笺,.cmt-card.cmt-layer-郑笺{border-left-color:#6b8e8e}
.cmt-card.cmt-layer-集注,.cmt-card.cmt-layer-集传{border-left-color:#7a9e7e}
.cmt-card.cmt-layer-御注{border-left-color:#b8860b;background:rgba(184,134,11,.08)}
.cmt-card.cmt-layer-评,.cmt-card.cmt-layer-眉批,.cmt-card.cmt-layer-总评{border-left-color:#9b59b6}
.cmt-card .cmt-meta{font-size:12px;color:var(--ink-3);display:flex;gap:10px;align-items:center;margin-bottom:4px;letter-spacing:1px}
.cmt-card .cmt-meta .layer{background:var(--line);color:var(--ink-2);padding:1px 8px;border-radius:10px;font-size:11px}
.cmt-card .cmt-meta .author{color:var(--gold);font-weight:500}
.cmt-card .cmt-text{font-size:14px;color:var(--ink-2);line-height:1.8}
.cmt-empty{color:var(--ink-3);font-size:13px;padding:10px 0;font-style:italic;letter-spacing:1px}

/* 右栏：术语面板 */
.term-panel{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow-y:auto;padding-right:6px}
.term-panel .term-current{background:rgba(212,168,83,.08);border:1px solid var(--gold);border-radius:6px;padding:14px;margin-bottom:14px}
.term-panel .term-current .t-name{font-size:18px;color:var(--gold);letter-spacing:3px;margin-bottom:4px}
.term-panel .term-current .t-short{font-size:12px;color:var(--cinnabar);letter-spacing:2px;margin-bottom:8px}
.term-panel .term-current .t-explain{font-size:13px;line-height:1.8;color:var(--ink-2)}
.term-panel .term-current .t-related{margin-top:8px;font-size:12px;color:var(--ink-3)}
.term-panel .term-current .t-related span{display:inline-block;background:var(--line);padding:2px 8px;margin:2px 4px 2px 0;border-radius:10px;cursor:pointer}
.term-panel .term-current .t-related span:hover{background:var(--gold);color:#fff}
.term-panel .term-hint{color:var(--ink-3);font-size:13px;text-align:center;padding:30px 10px;letter-spacing:2px}

/* 章节论争/总评卡 */
.crit-card{background:rgba(192,57,43,.05);border:1px solid rgba(192,57,43,.2);border-radius:6px;padding:12px 14px;margin:14px 0}
.crit-card .crit-title{font-size:13px;color:var(--cinnabar);letter-spacing:2px;margin-bottom:6px}
.crit-card .crit-body{font-size:13px;line-height:1.8;color:var(--ink-2)}

/* 典籍切换顶栏 */
.book-switch{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.book-switch .bs-label{font-size:12px;color:var(--ink-3);letter-spacing:2px}
.book-switch select{background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:6px 10px;border-radius:4px;font-size:14px;letter-spacing:2px}
.book-switch .bs-meta{font-size:12px;color:var(--ink-3);margin-left:auto;letter-spacing:1px}
.book-switch .bs-meta b{color:var(--gold);font-weight:500;margin:0 4px}

/* 注疏层切换 */
.layer-toggle{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.layer-toggle label{font-size:12px;color:var(--ink-2);background:var(--line);padding:3px 10px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:4px;letter-spacing:1px;user-select:none}
.layer-toggle label.on{background:var(--gold);color:#fff}
.layer-toggle label input{display:none}

/* 阅读器工具栏 */
.reader-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:14px}
.reader-toolbar .fs-group,.reader-toolbar .pd-group{display:flex;gap:4px}
.reader-toolbar button{background:var(--line);color:var(--ink-2);border:none;padding:5px 12px;border-radius:4px;cursor:pointer;font-size:13px;letter-spacing:2px}
.reader-toolbar button.on{background:var(--gold);color:#fff}
.reader-toolbar .spacer{flex:1}
.reader-toolbar .book-name{font-size:14px;color:var(--gold);letter-spacing:4px}

/* 响应式 */
@media(max-width:1200px){
  .reader-deep{grid-template-columns:1fr !important}
  .term-panel{position:static;max-height:none}
}
@media(max-width:768px){
  .book-sidebar{display:none !important}
  .global-sidebar{display:none !important}
  .main-with-sidebar{padding-left:0 !important}
}

/* 竖排模式 */
.reader-deep.vertical .deep-chapter .per-text{writing-mode:vertical-rl;letter-spacing:3px;line-height:2.2;max-height:600px;overflow-x:auto;padding:10px 0}

/* 滚动条美化 */
.term-panel::-webkit-scrollbar{width:4px}
.term-panel::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.term-panel::-webkit-scrollbar-thumb:hover{background:var(--gold)}
</style>
</head>

  <div class="topbar-logo"><span class="sym">儒</span>儒藏</div>
  <nav class="topbar-nav">

<div class="main-with-sidebar">
  <aside class="sidebar global-sidebar" id="globalSidebar"></aside>
  <aside class="sidebar book-sidebar" id="bookSidebar"></aside>
  <div class="main">

    <!-- 典籍切换 -->
    <div class="book-switch">
      <span class="bs-label">典籍</span>
      <select id="bookSelect"><option value="">-- 选择典籍 --</option></select>

    <div class="reader-toolbar">

<script>

  function doInit(){ if(typeof initPage==='function') initPage('reader.html'); else setTimeout(doInit,50); }
  doInit();

<script>
// ===== 深度阅读器主逻辑 =====
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
let curBid = params.get('b') || '';
let curFile = '';
let curBook = null;
let curBookMeta = null;
let BOOK_INDEX = []; // 存索引全部条目，便于 bid→file 查找
let activeLayers = new Set(['经','注','疏','笺','郑笺','集注','集传','御注','章句','本义','象传','眉批','总评','评']);
let activeTerm = null;
let readerFs = 18;
let vertical = false;

const LAYER_COLORS = {'注':'#a78b5a','疏':'#c0392b','笺':'#6b8e8e','郑笺':'#6b8e8e','集注':'#7a9e7e','集传':'#7a9e7e','正义':'#c0392b','御注':'#b8860b','经':'#d4a853','象传':'#d4a853','眉批':'#9b59b6','总评':'#9b59b6','评':'#9b59b6'};

// 加载索引 → 填下拉 → 加载当前典籍
fetch('data/reader-data-index.json').then(r=>r.json()).then(idx=>{
  BOOK_INDEX = idx.books || [];
  // 构建 id→file/meta 映射
  const bidMap = {};
  BOOK_INDEX.forEach(b=>{ bidMap[b.id] = b; });
  // 如果URL给的b是文件名（带.json或不带），也能定位
  const sel = $('bookSelect');
  // 按分类分组排序
  const catOrder = ['四书','五经总义','诗经','尚书','礼经','乐经','春秋','孝经','小学','语录','修身治家','启蒙蒙学'];
  const groups = {};
  BOOK_INDEX.forEach(b=>{
    const c = b.category || '其他';
    (groups[c]=groups[c]||[]).push(b);
  });
  catOrder.forEach(c=>{
    if(!groups[c]) return;
    const og = document.createElement('optgroup');
    og.label = `${c}（${groups[c].length}）`;
    groups[c].sort((x,y)=>x.title.localeCompare(y.title,'zh')).forEach(b=>{
      const o = document.createElement('option');
      o.value = b.id;
      const era = b.era || '';
      const author = (b.author||'').split('；')[0];
      o.textContent = `${b.title}${era?'（'+era+'·'+author+'）':''}`;
      og.appendChild(o);
    });
    sel.appendChild(og);
  });
  // curBid 可能是id，也可能是文件名，也可能是title
  let target = null;
  if(curBid){
    target = bidMap[curBid]
          || BOOK_INDEX.find(b=>b.file===curBid)
          || BOOK_INDEX.find(b=>b.file===curBid+'.json')
          || BOOK_INDEX.find(b=>b.title===curBid);
  }
  if(!target && BOOK_INDEX.length) target = BOOK_INDEX.find(b=>b.id==='lunyu') || BOOK_INDEX[0];
  if(target){
    curBid = target.id;
    sel.value = curBid;
    loadBook(target);
  }
  sel.onchange = ()=>{
    const v=sel.value; if(!v) return;
    const b = bidMap[v]; if(!b) return;
    curBid = v;
    history.replaceState(null,'',`reader.html?b=${encodeURIComponent(v)}`);
    loadBook(b);
  };
  fillBookSidebar(BOOK_INDEX);
}).catch(err=>{
  $('textBody').innerHTML = '<div class="cmt-empty">索引加载失败，请稍后重试：'+err.message+'</div>';
});

function fillBookSidebar(books){
  const side = $('bookSidebar');
  const cats = {};
  books.forEach(b=>{
    const c = b.category || '其他';
    (cats[c]=cats[c]||[]).push(b);
  });
  let html = '<div class="sidebar-title">典籍导航</div>';
  const catOrder = ['四书','五经总义','诗经','尚书','礼经','乐经','春秋','孝经','小学','语录','修身治家','启蒙蒙学'];
  catOrder.forEach(c=>{
    if(!cats[c]) return;
    html += `<div class="sidebar-group"><div class="sidebar-group-title">${c}（${cats[c].length}）</div>`;
    cats[c].slice(0,80).forEach(b=>{
      html += `<a href="reader.html?b=${encodeURIComponent(b.id)}" class="sidebar-link" data-b="${b.id}">${b.title}<span class="sidebar-link-meta">${b.chapter_count}章</span></a>`;
    });
    if(cats[c].length>80) html += `<div style="font-size:11px;color:var(--ink-3);padding:2px 8px">...其余 ${cats[c].length-80} 部请用顶部下拉</div>`;
    html += '</div>';
  });
  html += '<div class="sidebar-group" style="margin-top:20px"><div class="sidebar-group-title">统计</div>'+
          `<div style="font-size:12px;color:var(--ink-3);padding:4px 8px;line-height:1.8">共 ${books.length} 部<br>${books.reduce((a,b)=>a+b.chapter_count,0)} 章<br>${books.reduce((a,b)=>a+b.pericopes_count,0)} 节<br>${(books.reduce((a,b)=>a+b.word_count,0)/10000).toFixed(0)} 万字</div>`+
          '</div>';
  side.innerHTML = html;
}

function loadBook(bookMeta){
  curBookMeta = bookMeta;
  curFile = bookMeta.file;
  $('bookName').textContent = '加载中…';
  const url = 'reader-data/' + encodeURIComponent(curFile);
  fetch(url).then(r=>{
    if(!r.ok) throw new Error('http '+r.status);
    return r.json();
  }).then(data=>{
    curBook = data;
    const md = data.metadata || {};
    // 统一扁平化 pericopes
    if(Array.isArray(data.pericopes)){
      const pd={}; data.pericopes.forEach(p=>{pd[p.id]=p}); data.pericopes=pd;
    }
    renderBook(data);
    $('bookName').textContent = md.title || bookMeta.title;
    const era = md.era || md.dynasty || bookMeta.era || '';
    const author = (md.author||bookMeta.author||'').split('；')[0];
    const chN = (data.chapters||[]).length;
    const perN = data.pericopes ? Object.keys(data.pericopes).length : 0;
    $('bookMeta').innerHTML = `<b>${escapeHtml(md.title||bookMeta.title)}</b>${era?' · '+escapeHtml(era):''}${author?' · '+escapeHtml(author):''} · ${chN}章 ${perN}节 ${(md.word_count||bookMeta.word_count||0).toLocaleString()}字`;
    // 定位章节
    const ch = params.get('ch');
    if(ch){ setTimeout(()=>{
      const el = document.getElementById('ch-'+padCh(ch)) || document.getElementById('ch-'+ch);
      if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
    },150); }
    const q = params.get('find')||params.get('q');
    if(q){ setTimeout(()=>highlightQuery(q),200); }
    document.querySelectorAll('.sidebar-link[data-b]').forEach(a=>{
      a.classList.toggle('active', a.dataset.b===curBid);
    });
    buildLayerToggle(data);
  }).catch(err=>{
    $('bookName').textContent = '加载失败';
    $('textBody').innerHTML = `<div class="cmt-empty">加载 ${bookMeta.title} 失败：${err.message}<br>请从左侧典籍库或顶部下拉选择其它典籍。</div>`;
    $('noteBody').innerHTML = '';
  });
}

function padCh(s){
  // ch 参数兼容：纯数字补零到3位
  if(/^\d+$/.test(s)) return String(s).padStart(3,'0');
  return s;
}

function buildLayerToggle(data){
  const layers = new Set();
  (data.chapters||[]).forEach(c=>{
    (c.pericope_ids||[]).forEach(pid=>{
      const p = (data.pericopes||{})[pid];
      if(!p) return;
      // commentaries (list)
      (p.commentaries||[]).forEach(n=>{ if(n && n.layer) layers.add(n.layer); });
      // comments (list of {layer,...})
      (p.comments||[]).forEach(n=>{ if(n && n.layer) layers.add(n.layer); });
    });
  });
  const tog = $('layerToggle');
  tog.innerHTML = '<span style="font-size:12px;color:var(--ink-3);letter-spacing:2px;margin-right:6px">注疏层</span>';
  layers.forEach(l=>{
    const lab = document.createElement('label');
    lab.className = activeLayers.has(l)?'on':'';
    lab.innerHTML = `<input type="checkbox" ${activeLayers.has(l)?'checked':''}>${l}`;
    lab.querySelector('input').onchange = e=>{
      if(e.target.checked){activeLayers.add(l);lab.classList.add('on')}else{activeLayers.delete(l);lab.classList.remove('on')}
      renderBook(curBook);
    };
    tog.appendChild(lab);
  });
}

function renderBook(data){
  const md = data.metadata || {};
  const chapters = data.chapters || [];
  const perAll = data.pericopes || {};
  // concepts：统一为 name→concept dict
  const conceptByName = {};
  const conceptById = {};
  const csRaw = data.concepts || [];
  const csList = Array.isArray(csRaw) ? csRaw : Object.values(csRaw);
  csList.forEach(c=>{
    if(!c) return;
    if(c.name) conceptByName[c.name] = c;
    if(c.id) conceptById[c.id] = c;
  });
  // 合并全局本体
  if(window.ONTOLOGY && ONTOLOGY.concepts){
    Object.keys(ONTOLOGY.concepts).forEach(n=>{
      if(!conceptByName[n]) conceptByName[n] = {name:n, definition:ONTOLOGY.concepts[n].def||'', related:ONTOLOGY.concepts[n].related||[], layer:'本体', _fromOnt:true};
    });
  }
  // commentators：统一 name→cmt dict
  const cmtByName = {};
  const cmtsRaw = data.commentators || [];
  const cmtsList = Array.isArray(cmtsRaw) ? cmtsRaw : Object.values(cmtsRaw);
  cmtsList.forEach(c=>{
    if(!c) return;
    if(c.name) cmtByName[c.name] = c;
    if(c.id) cmtByName[c.id] = c;
  });

  function findConcept(ref){
    if(!ref) return null;
    if(typeof ref==='string'){
      return conceptById[ref] || conceptByName[ref] || (conceptByName[ref.replace(/^c_/,'')] || null);
    }
    if(typeof ref==='object'){
      if(ref.id && conceptById[ref.id]) return conceptById[ref.id];
      if(ref.name && conceptByName[ref.name]) return conceptByName[ref.name];
      return ref;
    }
    return null;
  }

  const cat = md.category || curBookMeta?.category || '';
  const era = md.era || md.dynasty || curBookMeta?.era || '';
  const author = md.author || curBookMeta?.author || '';
  const intro = md.intro || md.description || curBookMeta?.intro || '';
  const version = md.version || '';

  let textHtml = `<div class="book-intro" style="margin-bottom:18px;padding:14px 18px;background:rgba(212,168,83,.05);border-left:3px solid var(--gold);border-radius:0 4px 4px 0">
    <div style="font-size:16px;color:var(--gold);letter-spacing:4px;margin-bottom:6px">${escapeHtml(md.title||'')}</div>
    <div style="font-size:12px;color:var(--ink-3);letter-spacing:2px;margin-bottom:8px">${era?escapeHtml(era)+' · ':''}${escapeHtml(author)}${cat?' · '+escapeHtml(cat):''}${version?' · '+escapeHtml(version):''}</div>
    ${intro?`<div style="font-size:13px;line-height:1.9;color:var(--ink-2)">${escapeHtml(intro)}</div>`:''}
  </div>`;

  let noteHtml = '';
  let totalPer=0, hitCmt=0, totalCmt=0;

  chapters.forEach(ch=>{
    const chId = ch.id;
    const chNum = chId.replace(/^ch-/,'');
    textHtml += `<div class="deep-chapter" id="${chId}">
      <div class="ch-head">
        <div class="ch-title">${escapeHtml(ch.title||'第'+chNum+'章')}</div>
        ${ch.juan?`<div class="ch-juan">${escapeHtml(ch.juan)}卷</div>`:''}
      </div>`;
    if(ch.summary) textHtml += `<div class="ch-summary">${escapeHtml(ch.summary)}</div>`;

    let chNoteHtml = '';
    const pids = ch.pericope_ids || [];
    pids.forEach(pid=>{
      const p = perAll[pid];
      if(!p) return;
      totalPer++;
      // 正文 + 概念标红
      let t = escapeHtml(p.text||'');
      const cRefs = p.concept_ids || (p.concepts||[]);
      const cs = (cRefs||[]).map(findConcept).filter(Boolean);
      // 去重（同名只标第一次）
      const markedNames = new Set();
      cs.forEach(c=>{
        const nm = c.name; if(!nm || markedNames.has(nm)) return;
        const ek = escapeHtml(nm);
        const idx = t.indexOf(ek);
        if(idx>=0){
          markedNames.add(nm);
          const cid = c.id || ('c_'+nm);
          if(!conceptById[cid]) conceptById[cid] = c;
          t = t.slice(0,idx) + `<span class="term" data-cid="${cid}" data-per="${pid}">${ek}</span>` + t.slice(idx+ek.length);
        }
      });
      textHtml += `<div class="deep-pericope" id="${pid}">
        <div class="per-label">${escapeHtml(p.label||pid)}</div>
        <div class="per-text">${t}</div>
      </div>`;

      // 注疏：合并 commentaries + comments（comments是带quote的疏证）
      const notes = [];
      (p.commentaries||[]).forEach(n=>{ if(n) notes.push(n); });
      (p.comments||[]).forEach(n=>{
        if(!n) return;
        notes.push({layer:n.layer||'注', commentator:n.source_cid||'注', text:(n.quote?n.quote+' —— ':'')+(n.comment||'')});
      });
      const visible = notes.filter(n=>activeLayers.has(n.layer||'注'));
      totalCmt += notes.length;
      if(visible.length){
        hitCmt += visible.length;
        chNoteHtml += `<div class="deep-pericope" data-for="${pid}">
          <div class="per-label">${escapeHtml(p.label||pid)} · 注疏</div>
          <div class="cmt-list">${visible.map(n=>renderCmt(n,cmtByName)).join('')}</div>
        </div>`;
      }
    });

    // 章末论争（均匀分布）
    if(Array.isArray(data.critical_notes) && data.critical_notes.length){
      const chIdx = chapters.indexOf(ch);
      if(chIdx < data.critical_notes.length){
        const cn = data.critical_notes[chIdx];
        chNoteHtml += `<div class="crit-card"><div class="crit-title">【${escapeHtml(cn.topic||'章末总评')}】</div><div class="crit-body">${escapeHtml(cn.summary||'')}</div></div>`;
      } else if(chIdx === chapters.length-1){
        data.critical_notes.slice(chapters.indexOf(ch)).forEach(cn=>{
          chNoteHtml += `<div class="crit-card"><div class="crit-title">【${escapeHtml(cn.topic||'章末总评')}】</div><div class="crit-body">${escapeHtml(cn.summary||'')}</div></div>`;
        });
      }
    }

    textHtml += '</div>';
    noteHtml += `<div class="deep-chapter-note" data-ch="${chId}">
      <div class="ch-head"><div class="ch-title" style="font-size:16px">${escapeHtml(ch.title||'第'+chNum+'章')}</div>${ch.juan?`<div class="ch-juan">${escapeHtml(ch.juan)}卷</div>`:''}</div>
      ${chNoteHtml || '<div class="cmt-empty">本章暂无已收录的注疏</div>'}
    </div>`;
  });

  $('textBody').innerHTML = textHtml;
  $('noteBody').innerHTML = noteHtml;
  $('textCount').textContent = `${chapters.length}章 / ${totalPer}节`;
  $('noteCount').textContent = `共录${hitCmt}条注疏（共${totalCmt}）`;
  document.documentElement.style.setProperty('--reader-fs', readerFs+'px');
  $('readerDeep').classList.toggle('vertical', !!vertical);

  // 术语点击
  document.querySelectorAll('.term').forEach(el=>{
    el.onclick = ()=>{
      const cid = el.dataset.cid;
      showTerm(cid, conceptById);
      document.querySelectorAll('.term.active').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
    };
  });
  bindSyncScroll();
  if(activeTerm){
    if(conceptById[activeTerm]) showTerm(activeTerm, conceptById);
    else activeTerm = null;
  }
}

function renderCmt(n, cmtByName){
  let authorName = n.commentator || n.author || '注';
  // 去掉 c_ 前缀
  const key = authorName.replace(/^c_/,'');
  const c = cmtByName[key] || cmtByName[authorName] || {name:key, era:'', role:n.layer||''};
  const layer = n.layer || '注';
  const color = LAYER_COLORS[layer] || '#d4a853';
  return `<div class="cmt-card cmt-layer-${layer}">
    <div class="cmt-meta">
      <span class="layer" style="background:${color}22;color:${color};border:1px solid ${color}55">${escapeHtml(layer)}</span>
      <span class="author">${c.era?escapeHtml(c.era)+'·':''}${escapeHtml(c.name||key)}</span>
      ${c.role?`<span style="font-size:11px;color:var(--ink-3)">${escapeHtml(c.role)}</span>`:''}
    </div>
    <div class="cmt-text">${escapeHtml(n.text||n.comment||'')}</div>
  </div>`;
}

function showTerm(cid, conceptById){
  activeTerm = cid;
  let c = conceptById[cid] || {name:cid};
  // 也查 name
  if(!c || !c.name){
    const key = String(cid).replace(/^c_/,'');
    c = (window.ONTOLOGY && ONTOLOGY.concepts && ONTOLOGY.concepts[key]) ? {name:key, definition:ONTOLOGY.concepts[key].def, related:ONTOLOGY.concepts[key].related, _fromOnt:true} : (c||{name:key});
  }
  const g = (window.ONTOLOGY && ONTOLOGY.concepts) ? ONTOLOGY.concepts[c.name] : null;
  const panel = $('termPanel');
  const name = c.name || cid;
  const explain = c.definition || c.explain || (g?g.def:'') || '';
  const badge = (g || c._fromOnt) ? '<span style="background:var(--gold);color:#141008;padding:1px 7px;border-radius:8px;font-size:11px;margin-left:8px;letter-spacing:1px">本体</span>' : '';
  const srcLine = (g && g.source) ? `<div style="font-size:12px;color:var(--ink-3);margin-top:8px;line-height:1.7;border-top:1px dashed var(--line);padding-top:6px">出处　${escapeHtml(g.source)}</div>` : '';
  const relArr = (Array.isArray(c.related) && c.related.length) ? c.related : (g && g.related ? g.related : []);
  let rel = '';
  if(relArr.length){
    rel = '<div class="t-related">相关：'+relArr.slice(0,10).map(r=>`<span data-r="${escapeHtml(r)}">${escapeHtml(r)}</span>`).join('')+'</div>';
  }
  let layers = '';
  if(c.layer) layers = `<span style="background:var(--line);color:var(--ink-3);padding:1px 6px;border-radius:8px;font-size:11px;margin-right:4px">${escapeHtml(c.layer)}</span>`;
  panel.innerHTML = `<div class="term-current">
    <div class="t-name">${escapeHtml(name)}${badge}</div>
    <div class="t-short">${layers}${escapeHtml(c.short||c.py||'')}</div>
    <div class="t-explain">${escapeHtml(explain)}</div>
    ${srcLine}
    ${rel}
  </div>`;
  panel.querySelectorAll('.t-related span').forEach(s=>{
    s.onclick = ()=>{
      const nm = s.dataset.r;
      const hit = Array.prototype.slice.call(document.querySelectorAll('.term')).find(x=>x.textContent===nm);
      if(hit){ hit.click(); hit.scrollIntoView({behavior:'smooth',block:'center'}); }
      else { location.href = 'ontology.html#'+encodeURIComponent(nm); }
    };
  });
  panel.scrollTop = 0;
}

function bindSyncScroll(){
  // 右侧注疏滚动时，左侧自动定位到对应节
  const paneNote = $('paneNote');
  const paneText = $('paneText');
  let lock = false;
  paneNote.onscroll = ()=>{
    if(lock) return;
    const noteChaps = paneNote.querySelectorAll('.deep-chapter-note');
    for(const nc of noteChaps){
      const r = nc.getBoundingClientRect();
      if(r.top < 200 && r.bottom > 100){
        const chid = nc.dataset.ch;
        const tex = paneText.querySelector('#'+chid);
        if(tex){
          const tr = tex.getBoundingClientRect();
          const pr = paneText.getBoundingClientRect();
          if(tr.top < pr.top || tr.bottom > pr.bottom-100){
            lock = true;
            paneText.scrollTo({top:tex.offsetTop - 80, behavior:'smooth'});
            setTimeout(()=>lock=false,600);
          }
        }
        break;
      }
    }
  };
}

function highlightQuery(q){
  // 简单高亮
  const body = $('textBody');
  const html = body.innerHTML;
  try{
    const re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','g');
    body.innerHTML = html.replace(re, '<mark>$1</mark>');
  }catch(e){}
}

function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

// 字号/横竖排
document.querySelectorAll('[data-fs]').forEach(b=>{
  b.onclick = ()=>{
    readerFs = parseInt(b.dataset.fs);
    document.querySelectorAll('[data-fs]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    document.documentElement.style.setProperty('--reader-fs', readerFs+'px');
  };
});
$('btnV').onclick = ()=>{vertical=true;$('readerDeep').classList.add('vertical');$('btnV').classList.add('on');$('btnH').classList.remove('on')};
$('btnH').onclick = ()=>{vertical=false;$('readerDeep').classList.remove('vertical');$('btnH').classList.add('on');$('btnV').classList.remove('on')};
</script>
</body>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阅读 · 儒藏本体论</title>
  <link rel="stylesheet" href="style/common.css">
</head>
<body>
  <div class="main-content">
    <div class="breadcrumb" id="breadcrumb">
      <a href="index.html">首页</a> › <a href="library.html">全文库</a> › <span id="bookCat"></span> › <span id="bookName"></span>
    </div>

    <div class="reader-header">
      <h1 class="reader-title" id="readerTitle"></h1>
      <div class="reader-controls">
        <button id="backBtn">← 返回全文库</button>
        <button id="prevBtn">← 上一部</button>
        <button id="nextBtn">下一部 →</button>
      </div>
    </div>

    <div class="reader-content" id="readerContent">
      正在加载典籍内容...
    </div>
  </div>

  <script src="data/common.js"></script>
  <script>
    initPage('library.html');
    renderFooter();

    // 获取URL参数
    const params = new URLSearchParams(window.location.search);
    const bookPath = params.get('b');
    const [bookCat, bookFile] = bookPath.split('/');
    const bookName = bookFile.replace('.txt', '');

    // 更新标题和面包屑
    document.getElementById('bookCat').textContent = bookCat;
    document.getElementById('bookName').textContent = bookName;
    document.getElementById('readerTitle').textContent = bookName;
    document.title = `${bookName} · 儒藏本体论`;

    // 示例正文（实际部署时会fetch真实txt文件，这里先放示例内容演示概念标注功能）
    const sampleContent = `
      <p>大学之道，在明明德，在亲民，在止于至善。知止而后有定，定而后能静，静而后能安，安而后能虑，虑而后能得。物有本末，事有终始，知所先后，则近道矣。</p>
      <p>古之欲明明德于天下者，先治其国；欲治其国者，先齐其家；欲齐其家者，先修其身；欲修其身者，先正其心；欲正其心者，先诚其意；欲诚其意者，先致其知；致知在格物。物格而后知至，知至而后意诚，意诚而后心正，心正而后身修，身修而后家齐，家齐而后国治，国治而后天下平。</p>
      <p>自天子以至于庶人，壹是皆以修身为本。其本乱而末治者否矣，其所厚者薄，而其所薄者厚，未之有也。此谓知本，此谓知之至也。</p>
      <p>所谓诚其意者，毋自欺也，如恶恶臭，如好好色，此之谓自谦，故君子必慎其独也。小人闲居为不善，无所不至，见君子而后厌然，掩其不善，而著其善，人之视己，如见其肺肝然，则何益矣？此谓诚于中，形于外，故君子必慎其独也。</p>
      <p>曾子曰："十目所视，十手所指，其严乎！"富润屋，德润身，心广体胖，故君子必诚其意。</p>
      <p>所谓修身在正其心者：身有所忿懥，则不得其正；有所恐惧，则不得其正；有所好乐，则不得其正；有所忧患，则不得其正。心不在焉，视而不见，听而不闻，食而不知其味。此谓修身在正其心。</p>
      <p>所谓齐其家在修其身者：人之其所亲爱而辟焉，之其所贱恶而辟焉，之其所畏敬而辟焉，之其所哀矜而辟焉，之其所敖惰而辟焉。故好而知其恶，恶而知其美者，天下鲜矣。故谚有之曰："人莫知其子之恶，莫知其苗之硕。"此谓身不修不可以齐其家。</p>
      <p>所谓治国必先齐其家者，其家不可教而能教人者，无之。故君子不出家而成教于国：孝者，所以事君也；弟者，所以事长也；慈者，所以使众也。</p>
      <p>所谓平天下在治其国者：上老老而民兴孝，上长长而民兴弟，上恤孤而民不倍，是以君子有絜矩之道也。</p>
      <p>是故君子先慎乎德。有德此有人，有人此有土，有土此有财，有财此有用。德者，本也；财者，末也。外本内末，争民施夺。是故财聚则民散，财散则民聚。是故言悖而出者，亦悖而入；货悖而入者，亦悖而出。</p>
      <p>仁者以财发身，不仁者以身发财。未有上好仁而下不好义者也，未有好义其事不终者也，未有府库财非其财者也。</p>
      <p>此谓国不以利为利，以义为利也。长国家而务财用者，必自小人矣。彼为善之，小人之使为国家，灾害并至，虽有善者，亦无如之何矣。此谓国不以利为利，以义为利也。</p>
    `;

    // 加载内容
    async function loadContent() {
      try {
        const response = await fetch(`books/${bookPath}`);
        if (response.ok) {
          const text = await response.text();
          // 分段并标注概念
          const paragraphs = text.split(/\n+/).filter(p => p.trim());
          const content = paragraphs.map(p => `<p>${annotateConcepts(p.trim())}</p>`).join('');
          document.getElementById('readerContent').innerHTML = content;
        } else {
          // 加载失败时显示示例内容
          document.getElementById('readerContent').innerHTML = annotateConcepts(sampleContent);
        }
      } catch (e) {
        document.getElementById('readerContent').innerHTML = annotateConcepts(sampleContent);
      }
    }

    // 按钮事件
    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = 'library.html';
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      // 简单实现：返回全文库
      window.location.href = 'library.html';
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      window.location.href = 'library.html';
    });

    // 初始化
    loadContent();
  </script>
</body>
</html>

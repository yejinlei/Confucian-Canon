function renderGraph(){
  var chartDom = document.getElementById('graph');
  chartDom.innerHTML = '';
  var myChart = echarts.init(chartDom);

  // 圖例
  var legendEl = document.getElementById('legend');
  var active = [true,true,true,true];
  categories.forEach(function(cat, idx){
    var item = document.createElement('div');
    item.className = 'legend-item active';
    item.innerHTML = '<span class="legend-dot c'+idx+'"></span>'+cat.name;
    item.onclick = function(){
      active[idx] = !active[idx];
      item.classList.toggle('active', active[idx]);
      updateOption();
    };
    legendEl.appendChild(item);
  });

  function updateOption(){
    var visibleCats = categories.map(function(_,i){return i;}).filter(function(i){return active[i];});
    var visibleIds = new Set();
    var filteredNodes = nodes.filter(function(n){
      if(visibleCats.indexOf(n.category)>=0){visibleIds.add(n.id);return true;}return false;
    });
    var filteredEdges = edges.filter(function(e){return visibleIds.has(e.source) && visibleIds.has(e.target);});

    var option = {
      backgroundColor:'transparent',
      tooltip:{
        formatter:function(p){
          if(p.dataType==='node'){
            var d=p.data;
            return '<b style="color:#d4a853;font-size:15px">'+d.name+'</b><br/>'+categories[d.category].name+(d.desc?'<br/><span style="color:#a89878">'+d.desc+'</span>':'');
          }else{
            return p.data.value;
          }
        },
        backgroundColor:'rgba(26,21,16,.95)',
        borderColor:'#b83b2f',
        textStyle:{color:'#d4c5a8'}
      },
      series:[{
        type:'graph',
        layout:'force',
        roam:true,
        draggable:true,
        focusNodeAdjacency:true,
        categories:categories,
        data:filteredNodes,
        links:filteredEdges.map(function(e){return {source:e.source,target:e.target,label:{show:false,formatter:e.value},lineStyle:{color:'source',curveness:.1,opacity:.6},emphasis:{label:{show:true,color:'#d4a853',fontSize:11},lineStyle:{width:2,opacity:1}}};}),
        label:{show:true,position:'right',color:'#d4c5a8',fontSize:11},
        force:{repulsion:280,gravity:.08,edgeLength:[80,160],layoutAnimation:true},
        lineStyle:{width:1.2,opacity:.55,curveness:.1},
        emphasis:{focus:'adjacency',lineStyle:{width:2.5},label:{fontSize:13,fontWeight:'bold'}},
        itemStyle:{
          borderColor:'#d4a853',
          borderWidth:1.5,
          shadowBlur:12,
          shadowColor:'rgba(212,168,83,.3)'
        }
      }]
    };
    myChart.setOption(option, true);
  }

  updateOption();
  window.addEventListener('resize', function(){myChart.resize();});
}

// ========== 等待 ECharts 加载完成 ==========
function waitEcharts(){
  if(typeof echarts !== 'undefined'){
    renderGraph();
  }else{
    setTimeout(waitEcharts, 100);
  }
}
waitEcharts();
</script>

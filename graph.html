<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>儒學本體圖譜 | 儒藏本体論</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style/common.css">
  <style>
    body {
      overflow: hidden;
    }
    .graph-container {
      position: fixed;
      top: 60px;
      left: 180px;
      right: 0;
      bottom: 0;
      overflow: hidden;
    }
    #graphCanvas {
      width: 100%;
      height: 100%;
    }
    /* 筛选面板 */
    .graph-filter {
      position: absolute;
      top: 20px;
      left: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      z-index: 10;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .filter-title {
      color: var(--accent-gold);
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 12px;
    }
    .filter-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
    }
    .filter-item:last-child { margin-bottom: 0; }
    .filter-item input {
      accent-color: var(--accent-gold);
      cursor: pointer;
    }
    .filter-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .filter-dot.concept { background: #d4af37; }
    .filter-dot.person { background: #a78bfa; }
    .filter-dot.school { background: #4ade80; }
    .filter-dot.book { background: #60a5fa; }
    /* 详情面板 */
    .graph-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 320px;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      z-index: 10;
    }
    .graph-panel::-webkit-scrollbar {
      width: 0;
    }
    .graph-panel h3 {
      color: var(--accent-gold);
      margin: 0 0 8px 0;
      font-size: 20px;
    }
    .graph-panel .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .tag.concept { background: rgba(212,175,55,0.2); color: var(--accent-gold); }
    .tag.person { background: rgba(150,100,200,0.2); color: #a78bfa; }
    .tag.school { background: rgba(80,180,120,0.2); color: #4ade80; }
    .tag.book { background: rgba(80,150,220,0.2); color: #60a5fa; }
    .tag.shicheng { background: rgba(244,114,182,0.2); color: #f472b6; }
    .tag.propose { background: rgba(251,146,60,0.2); color: #fb923c; }
    .tag.source { background: rgba(96,165,250,0.2); color: #60a5fa; }
    .graph-panel .def {
      color: var(--text-secondary);
      line-height: 1.8;
      font-size: 14px;
      margin-bottom: 12px;
    }
    .graph-panel .meta {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.8;
    }
    .graph-panel .meta span {
      color: var(--text-primary);
    }
    .graph-panel .jump-btn {
      width: 100%;
      padding: 10px;
      background: var(--accent-gold);
      color: #1a1308;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;
    }
    .graph-panel .jump-btn:hover {
      filter: brightness(1.1);
    }
    .graph-panel .related-title {
      font-size: 14px;
      color: var(--accent-gold);
      margin: 12px 0 8px 0;
    }
    .graph-panel .related-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .related-item {
      padding: 4px 10px;
      border-radius: 16px;
      background: rgba(212,175,55,0.1);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .related-item:hover {
      background: var(--accent-gold);
      color: #1a1308;
    }
    .graph-legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      z-index: 10;
    }
    .legend-title {
      color: var(--accent-gold);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .legend-item:last-child { margin-bottom: 0; }
    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .legend-line {
      width: 20px;
      height: 2px;
    }
    .legend-dot.concept { background: #d4af37; }
    .legend-dot.person { background: #a78bfa; }
    .legend-dot.school { background: #4ade80; }
    .legend-dot.book { background: #60a5fa; }
    .legend-line.shicheng { background: #f472b6; }
    .legend-line.propose { background: #fb923c; }
    .legend-line.source { background: #60a5fa; }
    .graph-tip {
      position: absolute;
      top: 20px;
      left: 200px;
      color: var(--text-muted);
      font-size: 13px;
      z-index: 10;
    }
    @media (max-width: 768px) {
      .graph-container {
        left: 0;
      }
      .graph-filter {
        display: none;
      }
      .graph-tip {
        left: 20px;
        top: 80px;
      }
      .graph-panel {
        width: calc(100% - 40px);
        right: 20px;
        bottom: 20px;
        top: auto;
        max-height: 40vh;
      }
      .graph-legend {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="graph-container">
    <canvas id="graphCanvas"></canvas>
    <div class="graph-tip">拖拽節點移動 · 滾輪縮放 · 點擊節點查看詳情</div>
    <!-- 筛选面板 -->
    <div class="graph-filter">
      <div class="filter-title">節點篩選</div>
      <label class="filter-item"><input type="checkbox" value="concept" checked><span class="filter-dot concept"></span>核心概念</label>
      <label class="filter-item"><input type="checkbox" value="person" checked><span class="filter-dot person"></span>儒者人物</label>
      <label class="filter-item"><input type="checkbox" value="school" checked><span class="filter-dot school"></span>学派流派</label>
      <label class="filter-item"><input type="checkbox" value="book" checked><span class="filter-dot book"></span>典籍著作</label>
      <div class="filter-title" style="margin-top: 12px;">關係類型</div>
      <label class="filter-item"><input type="checkbox" value="shicheng" checked><span class="legend-line shicheng"></span>师承傳承</label>
      <label class="filter-item"><input type="checkbox" value="propose" checked><span class="legend-line propose"></span>思想提出</label>
      <label class="filter-item"><input type="checkbox" value="source" checked><span class="legend-line source"></span>典籍出處</label>
    </div>
    <!-- 图例 -->
    <div class="graph-legend">
      <div class="legend-title">圖例說明</div>
      <div class="legend-item"><div class="legend-dot concept"></div>核心概念</div>
      <div class="legend-item"><div class="legend-dot person"></div>儒者人物</div>
      <div class="legend-item"><div class="legend-dot school"></div>学派流派</div>
      <div class="legend-item"><div class="legend-dot book"></div>典籍著作</div>
    </div>
    <!-- 详情面板 -->
    <div class="graph-panel" id="graphPanel" style="display: none;">
      <h3 id="panelTitle"></h3>
      <span class="tag" id="panelTag"></span>
      <div class="def" id="panelDef"></div>
      <div class="meta" id="panelMeta"></div>
      <button class="jump-btn" id="jumpBtn" style="display: none;">跳轉到相關典籍</button>
      <div class="related-title" id="relatedTitle" style="display: none;">關聯節點</div>
      <div class="related-list" id="relatedList"></div>
    </div>
  </div>

  <script src="data/common.js"></script>
  <script>
    initPage('graph.html');
    // ========== 力导向图实现 ==========
    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');
    let allNodes = [], allLinks = [], visibleNodes = [], visibleLinks = [], selectedNode = null;
    let width = canvas.offsetWidth, height = canvas.offsetHeight;
    const nodeColors = {
      concept: '#d4af37',
      person: '#a78bfa',
      school: '#4ade80',
      book: '#60a5fa'
    };
    const linkColors = {
      shicheng: '#f472b6',
      propose: '#fb923c',
      source: '#60a5fa',
      default: 'rgba(212,175,55,0.15)'
    };
    let activeFilters = {
      node: new Set(['concept', 'person', 'school', 'book']),
      link: new Set(['shicheng', 'propose', 'source'])
    };

    // 构建图谱节点与边
    function buildGraph() {
      allNodes = []; allLinks = [];
      const nodeMap = new Map();

      // 添加概念节点
      Object.entries(CONCEPTS).forEach(([name, data]) => {
        const node = {
          id: 'concept_' + name,
          name,
          type: 'concept',
          data,
          x: width/2 + (Math.random()-0.5)*300,
          y: height/2 + (Math.random()-0.5)*300,
          vx: 0, vy: 0,
          r: name.length <= 2 ? 28 : 22
        };
        allNodes.push(node);
        nodeMap.set(node.id, node);
      });

      // 添加人物节点
      Object.entries(SCHOLARS).forEach(([name, data]) => {
        const node = {
          id: 'person_' + name,
          name,
          type: 'person',
          data,
          x: width/2 + (Math.random()-0.5)*400,
          y: height/2 + (Math.random()-0.5)*400,
          vx: 0, vy: 0,
          r: 30
        };
        allNodes.push(node);
        nodeMap.set(node.id, node);
      });

      // 添加学派节点
      Object.entries(SCHOOLS).forEach(([name, data]) => {
        const node = {
          id: 'school_' + name,
          name,
          type: 'school',
          data,
          x: width/2 + (Math.random()-0.5)*450,
          y: height/2 + (Math.random()-0.5)*450,
          vx: 0, vy: 0,
          r: name.length <= 4 ? 34 : 28
        };
        allNodes.push(node);
        nodeMap.set(node.id, node);
        // 关联创始人
        if (data.founder) {
          const founders = data.founder.split('、');
          founders.forEach(f => {
            const founderId = 'person_' + f;
            if (nodeMap.has(founderId)) {
              allLinks.push({source: node.id, target: founderId, type: 'shicheng'});
            }
          });
        }
      });

      // 添加典籍节点
      Object.entries(CLASSIC_ONTOLOGY).forEach(([name, data]) => {
        const node = {
          id: 'book_' + name,
          name,
          type: 'book',
          data,
          x: width/2 + (Math.random()-0.5)*500,
          y: height/2 + (Math.random()-0.5)*500,
          vx: 0, vy: 0,
          r: name.length <= 2 ? 28 : 24
        };
        allNodes.push(node);
        nodeMap.set(node.id, node);
        // 关联作者
        if (data.author) {
          const authors = data.author.split('、');
          authors.forEach(a => {
            a = a.replace(/（.*?）/g, '').split('及')[0].trim();
            const authorId = 'person_' + a;
            if (nodeMap.has(authorId)) {
              allLinks.push({source: node.id, target: authorId, type: 'propose'});
            }
          });
        }
      });

      // 添加师承关系
      ONTOLOGY_RELATIONS.shicheng.forEach(([from, to, type]) => {
        const sourceId = 'person_' + from;
        const targetId = 'person_' + to;
        if (nodeMap.has(sourceId) && nodeMap.has(targetId)) {
          allLinks.push({source: sourceId, target: targetId, type: 'shicheng'});
        }
      });

      // 添加提出概念关系
      ONTOLOGY_RELATIONS.propose.forEach(([person, concept, type]) => {
        const sourceId = 'person_' + person;
        const targetId = 'concept_' + concept;
        if (nodeMap.has(sourceId) && nodeMap.has(targetId)) {
          allLinks.push({source: sourceId, target: targetId, type: 'propose'});
        }
      });

      // 添加出处典籍关系
      ONTOLOGY_RELATIONS.source.forEach(([concept, book, type]) => {
        const sourceId = 'concept_' + concept;
        const targetId = 'book_' + book;
        if (nodeMap.has(sourceId) && nodeMap.has(targetId)) {
          allLinks.push({source: sourceId, target: targetId, type: 'source'});
        }
      });

      // 人物关联学派
      Object.entries(SCHOLARS).forEach(([name, data]) => {
        if (data.school) {
          const sourceId = 'person_' + name;
          const targetId = 'school_' + data.school;
          if (nodeMap.has(sourceId) && nodeMap.has(targetId)) {
            allLinks.push({source: sourceId, target: targetId, type: 'shicheng'});
          }
        }
      });

      // 把边转为节点引用
      allLinks.forEach(l => {
        l.source = nodeMap.get(l.source);
        l.target = nodeMap.get(l.target);
      });

      updateFilters();
    }

    // 更新筛选
    function updateFilters() {
      visibleNodes = allNodes.filter(n => activeFilters.node.has(n.type));
      const visibleIds = new Set(visibleNodes.map(n => n.id));
      visibleLinks = allLinks.filter(l => activeFilters.link.has(l.type) && visibleIds.has(l.source.id) && visibleIds.has(l.target.id));
    }

    // 力导向模拟
    function simulate() {
      // 斥力
      for (let i = 0; i < visibleNodes.length; i++) {
        for (let j = i+1; j < visibleNodes.length; j++) {
          const a = visibleNodes[i], b = visibleNodes[j];
          let dx = b.x - a.x, dy = b.y - a.y;
          let dist = Math.sqrt(dx*dx + dy*dy) || 1;
          let force = 8000 / (dist * dist);
          let fx = dx/dist * force;
          let fy = dy/dist * force;
          a.vx -= fx; a.vy -= fy;
          b.vx += fx; b.vy += fy;
        }
      }
      // 引力（边）
      visibleLinks.forEach(l => {
        let dx = l.target.x - l.source.x, dy = l.target.y - l.source.y;
        let dist = Math.sqrt(dx*dx + dy*dy) || 1;
        let force = (dist - 120) * 0.02;
        let fx = dx/dist * force;
        let fy = dy/dist * force;
        l.source.vx += fx; l.source.vy += fy;
        l.target.vx -= fx; l.target.vy -= fy;
      });
      // 中心引力
      visibleNodes.forEach(n => {
        n.vx += (width/2 - n.x) * 0.001;
        n.vy += (height/2 - n.y) * 0.001;
        // 阻尼
        n.vx *= 0.9;
        n.vy *= 0.9;
        n.x += n.vx;
        n.y += n.vy;
        // 边界
        n.x = Math.max(n.r, Math.min(width - n.r, n.x));
        n.y = Math.max(n.r, Math.min(height - n.r, n.y));
        // 选中节点固定
        if (n === selectedNode) {
          n.x = dragPos.x;
          n.y = dragPos.y;
        }
      });
    }

    // 渲染
    function render() {
      ctx.clearRect(0, 0, width, height);
      // 计算关联高亮
      const relatedNodeIds = new Set();
      const relatedLinkIds = new Set();
      if (selectedNode) {
        relatedNodeIds.add(selectedNode.id);
        visibleLinks.forEach((l, idx) => {
          if (l.source.id === selectedNode.id || l.target.id === selectedNode.id) {
            relatedNodeIds.add(l.source.id);
            relatedNodeIds.add(l.target.id);
            relatedLinkIds.add(idx);
          }
        });
      }

      // 画边
      visibleLinks.forEach((l, idx) => {
        ctx.beginPath();
        ctx.moveTo(l.source.x, l.source.y);
        ctx.lineTo(l.target.x, l.target.y);
        let alpha = 0.15;
        if (selectedNode) {
          alpha = relatedLinkIds.has(idx) ? 0.6 : 0.05;
        }
        ctx.strokeStyle = linkColors[l.type] ? linkColors[l.type] + Math.floor(alpha*255).toString(16).padStart(2, '0') : linkColors.default;
        ctx.lineWidth = relatedLinkIds.has(idx) ? 2 : 1;
        ctx.stroke();
      });

      // 画节点
      visibleNodes.forEach(n => {
        let alpha = 1;
        if (selectedNode) {
          alpha = relatedNodeIds.has(n.id) ? 1 : 0.2;
        }
        ctx.globalAlpha = alpha;
        // 节点光晕
        if (n === selectedNode) {
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r + 8, 0, Math.PI*2);
          ctx.fillStyle = nodeColors[n.type] + '40';
          ctx.fill();
        }
        // 节点圆
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
        ctx.fillStyle = nodeColors[n.type];
        ctx.fill();
        // 节点文字
        ctx.fillStyle = '#1a1308';
        ctx.font = n.type === 'school' ? '12px system-ui' : '13px system-ui';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(n.name, n.x, n.y);
        ctx.globalAlpha = 1;
      });
      simulate();
      requestAnimationFrame(render);
    }

    // ========== 交互 ==========
    let dragNode = null, dragPos = {x:0, y:0}, scale = 1, offset = {x:0, y:0};
    function resize() {
      const dpr = window.devicePixelRatio || 1;
      width = canvas.offsetWidth;
      height = canvas.offsetHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();
    buildGraph();
    render();

    // 筛选监听
    document.querySelectorAll('.graph-filter input').forEach(input => {
      input.addEventListener('change', () => {
        if (input.parentElement.parentElement.querySelector('.filter-title').textContent.includes('節點')) {
          if (input.checked) activeFilters.node.add(input.value);
          else activeFilters.node.delete(input.value);
        } else {
          if (input.checked) activeFilters.link.add(input.value);
          else activeFilters.link.delete(input.value);
        }
        updateFilters();
      });
    });

    // 坐标转换
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left - offset.x) / scale,
        y: (e.clientY - rect.top - offset.y) / scale
      };
    }

    canvas.addEventListener('mousedown', e => {
      const pos = getPos(e);
      dragNode = visibleNodes.find(n => {
        const dx = n.x - pos.x, dy = n.y - pos.y;
        return dx*dx + dy*dy < n.r*n.r;
      });
      if (dragNode) {
        selectedNode = dragNode;
        showPanel(dragNode);
      } else {
        selectedNode = null;
        document.getElementById('graphPanel').style.display = 'none';
      }
    });
    canvas.addEventListener('mousemove', e => {
      if (dragNode) {
        dragPos = getPos(e);
      }
    });
    canvas.addEventListener('mouseup', () => {
      dragNode = null;
    });
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.9 : 1.1;
      scale *= delta;
      scale = Math.max(0.5, Math.min(2, scale));
      ctx.setTransform(scale, 0, 0, scale, offset.x, offset.y);
    }, {passive: false});

    // 显示详情面板
    function showPanel(node) {
      const panel = document.getElementById('graphPanel');
      panel.style.display = 'block';
      document.getElementById('panelTitle').textContent = node.name;
      const tag = document.getElementById('panelTag');
      tag.className = 'tag ' + node.type;
      const typeNames = {concept:'核心概念', person:'儒者人物', school:'学派流派', book:'典籍著作'};
      tag.textContent = typeNames[node.type];

      const def = document.getElementById('panelDef');
      const meta = document.getElementById('panelMeta');
      const jumpBtn = document.getElementById('jumpBtn');
      const relatedList = document.getElementById('relatedList');
      const relatedTitle = document.getElementById('relatedTitle');
      relatedList.innerHTML = '';
      relatedTitle.style.display = 'none';
      jumpBtn.style.display = 'none';

      let metaHTML = '';
      if (node.type === 'concept') {
        def.textContent = node.data.def;
        metaHTML += `<div>核心出處：<span>${node.data.source}</span></div>`;
        jumpBtn.style.display = 'block';
        jumpBtn.textContent = `查看概念相關原文`;
        jumpBtn.onclick = () => {
          window.location.href = 'dictionary.html?q=' + encodeURIComponent(node.name);
        };
      } else if (node.type === 'person') {
        def.textContent = node.data.bio;
        metaHTML += `<div>年代：<span>${node.data.era}</span></div>`;
        metaHTML += `<div>頭銜：<span>${node.data.title}</span></div>`;
        metaHTML += `<div>所屬學派：<span>${node.data.school}</span></div>`;
        if (node.data.works) {
          metaHTML += `<div>代表著作：<span>${node.data.works.join('、')}</span></div>`;
        }
      } else if (node.type === 'school') {
        def.textContent = node.data.idea;
        metaHTML += `<div>創始人：<span>${node.data.founder}</span></div>`;
        metaHTML += `<div>流行年代：<span>${node.data.era}</span></div>`;
        if (node.data.books) {
          metaHTML += `<div>核心典籍：<span>${node.data.books.join('、')}</span></div>`;
        }
      } else if (node.type === 'book') {
        def.textContent = node.data.idea;
        metaHTML += `<div>作者：<span>${node.data.author}</span></div>`;
        metaHTML += `<div>年代：<span>${node.data.era}</span></div>`;
        metaHTML += `<div>分類：<span>${node.data.cat}</span></div>`;
        metaHTML += `<div>章節數：<span>${node.data.chapters}章/卷</span></div>`;
        jumpBtn.style.display = 'block';
        jumpBtn.textContent = `打開 ${node.name}`;
        jumpBtn.onclick = () => {
          window.location.href = `reader.html?b=${encodeURIComponent(node.data.cat + '/' + node.name + '.txt')}`;
        };
      }
      meta.innerHTML = metaHTML;

      // 关联节点
      const relatedNodes = visibleLinks.filter(l => l.source.id === node.id || l.target.id === node.id).map(l => l.source.id === node.id ? l.target : l.source).filter(n => n.id !== node.id);
      relatedNodes.forEach(n => {
        const item = document.createElement('div');
        item.className = 'related-item';
        item.textContent = n.name;
        item.onclick = () => {
          selectedNode = n; showPanel(n);
        };
        relatedList.appendChild(item);
      });
      if (relatedNodes.length > 0) relatedTitle.style.display = 'block';
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>义理关系图 · 儒藏本体论</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="style/common.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body data-theme="star">

<header class="topbar">
  <div class="topbar-logo"><span class="sym">儒</span>儒藏</div>
  <nav class="topbar-nav">
    <a href="index.html">总纲</a>
    <a href="ontology.html">本体</a>
    <a href="graph.html" class="active">关系</a>
    <a href="dictionary.html">词典</a>
    <a href="zhangju.html">章句</a>
    <a href="scholars.html">儒者</a>
    <a href="schools.html">学派</a>
    <a href="debate.html">论争</a>
    <a href="library.html">典籍</a>
    <a href="search.html">检索</a>
    <a href="reader.html">阅读</a>
    <a href="lineage.html">谱系</a>
    <a href="timeline.html">年谱</a>
  </nav>
  <div class="topbar-right"><div class="theme-dots" id="themeDots"></div></div>
</header>

<div class="layout">
<div class="content">

  <div class="section-head" style="margin-top:24px">
    <div class="en">ONTOLOGY GRAPH</div>
    <h2>义 理 关 系 网 络</h2>
    <div class="desc">儒者·概念·学派·典籍 四类实体的力导向关系图</div>
  </div>

  <!-- 筛选 -->
  <div class="filter-bar" id="filterBar">
    <label><input type="checkbox" data-type="scholar" checked>儒者（<span id="sc">0</span>）</label>
    <label><input type="checkbox" data-type="concept" checked>概念（<span id="cc">0</span>）</label>
    <label><input type="checkbox" data-type="school" checked>学派（<span id="skc">0</span>）</label>
    <label><input type="checkbox" data-type="classic" checked>典籍（<span id="bc">0</span>）</label>
    <span style="flex:1"></span>
    <label><input type="checkbox" data-rel="teacher_of" checked>师承</label>
    <label><input type="checkbox" data-rel="derived_from" checked>衍生</label>
    <label><input type="checkbox" data-rel="opposed_to" checked>对立</label>
    <label><input type="checkbox" data-rel="criticize">批判</label>
    <label><input type="checkbox" data-rel="inherited_from" checked>继承</label>
    <label><input type="checkbox" data-rel="annotates" checked>注解</label>
    <label><input type="checkbox" data-rel="proposed" checked>提出</label>
    <label><input type="checkbox" data-rel="belongs_to" checked>归属</label>
    <label><input type="checkbox" data-rel="appears_in" checked>出自</label>
    <label><input type="checkbox" data-rel="implies" checked>蕴含</label>
  </div>

  <!-- 关系图容器 -->
  <div class="graph-wrap" id="graph"></div>

  <!-- 详情卡 -->
  <div class="section" id="detailSection" style="display:none">
    <div class="section-head"><h3 style="color:var(--gold);letter-spacing:4px;font-size:20px" id="detailTitle">节点详情</h3></div>
    <div class="card" id="detailBody"></div>
  </div>

  <!-- 说明 -->
  <div class="section">
    <div class="card" style="font-size:13px;color:var(--ink-3);line-height:2">
      <strong style="color:var(--gold);letter-spacing:2px">操作说明：</strong>
      鼠标滚轮缩放，拖动节点移动位置，单击节点查看详情与邻居；
      <span style="color:var(--zhu)">●</span> 朱砂=儒者、
      <span style="color:var(--gold-bright)">●</span> 金=概念、
      <span style="color:var(--jade)">●</span> 玉青=学派、
      <span style="color:var(--ice)">●</span> 冰蓝=典籍。
      线颜色对应关系谓词，虚线为"对立/批判"，实线为"师承/衍生/注解"等。
    </div>
  </div>

</div>
</div>

<footer class="footer">
  儒藏本体论 · CONFUCIAN CANON ONTOLOGY · 义理关系图
</footer>

<script src="data/common.js"></script>
<script src="data/ontology-enhance.js"></script>
<script>
// 主题
function initTheme(){
  const wrap=document.getElementById('themeDots');
  const themes=[{k:'star',n:'星象',b:'#e6ca96'},{k:'paper',n:'宣纸',b:'#6a4218'},{k:'ink',n:'水墨',b:'#e0e5ee'},{k:'bamboo',n:'竹简',b:'#e8c888'}];
  wrap.innerHTML=themes.map(t=>`<span class="theme-dot" data-theme="${t.k}" style="background:radial-gradient(circle,${t.b},#2a1e12)" title="${t.n}"></span>`).join('');
  const saved=localStorage.getItem('rz_theme')||'star';
  document.body.setAttribute('data-theme',saved);
  wrap.querySelectorAll('.theme-dot').forEach(d=>d.classList.toggle('active',d.dataset.theme===saved));
  wrap.querySelectorAll('.theme-dot').forEach(d=>d.onclick=()=>{
    const t=d.dataset.theme;document.body.setAttribute('data-theme',t);localStorage.setItem('rz_theme',t);
    wrap.querySelectorAll('.theme-dot').forEach(x=>x.classList.toggle('active',x===d));
  });
}
initTheme();

// 节点颜色
const TYPE_COLOR={scholar:'#c8422e',concept:'#e6ca96',school:'#5e9680',classic:'#7aa8d4'};
const REL_COLOR={
  teacher_of:'#c8a05c',inherited_from:'#7bbfa6',classmate_of:'#c8c0ae',
  derived_from:'#b8834a',opposed_to:'#996a8e',implies:'#d49258',
  equivalent_to:'#e6ca96',proposed:'#e87b72',belongs_to:'#7aa8d4',
  appears_in:'#c8c0ae',annotates:'#5e9680',criticize:'#c8422e'
};
const REL_DASHED={opposed_to:[5,5],criticize:[5,5]};

// 构建节点
const nodes=[];const nodeMap={};
function addNode(name,type){
  if(nodeMap[name])return;
  nodeMap[name]={name,type,symbolSize:type==='concept'?28:type==='scholar'?30:type==='school'?38:26,
    itemStyle:{color:TYPE_COLOR[type]},
    label:{show:true,color:'#e8edf5',fontSize:11,fontFamily:'Songti SC,STSong,serif'}
  };
  nodes.push(nodeMap[name]);
}
// 加入CONCEPTS前40个（避免图过密）+核心儒者+学派+核心典籍
Object.keys(CONCEPTS).slice(0,40).forEach(k=>addNode(k,'concept'));
['孔子','颜回','曾子','子思','孟子','荀子','董仲舒','郑玄','孔颖达','韩愈',
 '周敦颐','邵雍','张载','程颢','程颐','朱熹','陆九渊','王阳明','王畿','王艮','李贽',
 '顾炎武','黄宗羲','王夫之','颜元','戴震','惠栋','康有为','梁启超','章炳麟']
 .forEach(k=>{if(SCHOLARS[k])addNode(k,'scholar')});
Object.keys(SCHOOLS).forEach(k=>addNode(k,'school'));
Object.keys(CLASSIC_ONTOLOGY).forEach(k=>addNode(k,'classic'));

// 统计
document.getElementById('sc').textContent=nodes.filter(n=>n.type==='scholar').length;
document.getElementById('cc').textContent=nodes.filter(n=>n.type==='concept').length;
document.getElementById('skc').textContent=nodes.filter(n=>n.type==='school').length;
document.getElementById('bc').textContent=nodes.filter(n=>n.type==='classic').length;

// 构建边
const nodeSet=new Set(nodes.map(n=>n.name));
const edges=[];
const edgeKey=new Set();
RELATIONS_EXPANDED.forEach(r=>{
  const[s,p,t]=r;
  if(!nodeSet.has(s)||!nodeSet.has(t))return;
  const k=s+'|'+p+'|'+t;if(edgeKey.has(k))return;edgeKey.add(k);
  edges.push({
    source:s,target:t,
    lineStyle:{color:REL_COLOR[p]||'#888',width: p==='teacher_of'||p==='annotates'?1.8:1.2,
      type:REL_DASHED[p]?'dashed':'solid',curveness:0.12,opacity:0.7},
    _pred:p,_note:r[3]||''
  });
});
// 也合并ONTOLOGY_RELATIONS原有54条（同师/提出/出处）
Object.entries(ONTOLOGY_RELATIONS).forEach(([src,arr])=>{
  arr.forEach(r=>{
    const tgt=r.target||r[0];const pred=r.rel||r.pred||r[1]||'appears_in';
    if(!nodeSet.has(src)||!nodeSet.has(tgt))return;
    const k=src+'|'+pred+'|'+tgt;if(edgeKey.has(k))return;edgeKey.add(k);
    edges.push({source:src,target:tgt,
      lineStyle:{color:REL_COLOR[pred]||'#888',width:1,type:REL_DASHED[pred]?'dashed':'solid',opacity:0.6},
      _pred:pred,_note:r.note||''});
  });
});

// 初始化图
const chart=echarts.init(document.getElementById('graph'));
function render(){
  const activeTypes=new Set();
  document.querySelectorAll('#filterBar input[data-type]').forEach(cb=>{if(cb.checked)activeTypes.add(cb.dataset.type)});
  const activeRels=new Set();
  document.querySelectorAll('#filterBar input[data-rel]').forEach(cb=>{if(cb.checked)activeRels.add(cb.dataset.rel)});
  const activeNodes=nodes.filter(n=>activeTypes.has(n.type));
  const activeSet=new Set(activeNodes.map(n=>n.name));
  const activeEdges=edges.filter(e=>activeRels.has(e._pred)&&activeSet.has(e.source)&&activeSet.has(e.target));
  chart.setOption({
    backgroundColor:'transparent',
    tooltip:{
      backgroundColor:'rgba(10,8,6,.95)',borderColor:'#c8a05c',textStyle:{color:'#f0e4cf'},
      formatter:p=>{
        if(p.dataType==='node'){
          const d=p.data;let desc='';
          if(d.type==='concept'&&CONCEPTS[d.name])desc=CONCEPTS[d.name].def.slice(0,80)+'…';
          else if(d.type==='scholar'&&SCHOLARS[d.name])desc=SCHOLARS[d.name].dynasty+'·'+SCHOLARS[d.name].school;
          else if(d.type==='school'&&SCHOOLS[d.name])desc=SCHOOLS[d.name].desc.slice(0,80)+'…';
          else if(d.type==='classic'&&CLASSIC_ONTOLOGY[d.name])desc=CLASSIC_ONTOLOGY[d.name].desc.slice(0,80)+'…';
          return `<b style="color:${TYPE_COLOR[d.type]}">${d.name}</b><br><span style="color:#9a876a;font-size:12px">${{scholar:'儒者',concept:'概念',school:'学派',classic:'典籍'}[d.type]}</span><br><span style="font-size:12px">${desc}</span>`;
        }else{
          const pred=RELATION_PREDICATES[p.data._pred];
          return `<b>${p.data.source} → ${p.data.target}</b><br><span style="color:${REL_COLOR[p.data._pred]}">${pred?p.data._pred+'·'+pred.name:p.data._pred}</span><br><span style="font-size:12px;color:#9a876a">${p.data._note}</span>`;
        }
      }
    },
    series:[{
      type:'graph',layout:'force',roam:true,
      data:activeNodes,links:activeEdges,
      categories:[
        {name:'儒者',itemStyle:{color:TYPE_COLOR.scholar}},
        {name:'概念',itemStyle:{color:TYPE_COLOR.concept}},
        {name:'学派',itemStyle:{color:TYPE_COLOR.school}},
        {name:'典籍',itemStyle:{color:TYPE_COLOR.classic}}
      ],
      label:{show:true,position:'right',color:'#e8edf5',fontSize:11},
      force:{repulsion:320,edgeLength:[60,140],gravity:0.08},
      emphasis:{focus:'adjacency',lineStyle:{width:3}},
      lineStyle:{curveness:0.12}
    }]
  },true);
}
render();
document.querySelectorAll('#filterBar input').forEach(cb=>cb.onchange=render);
window.addEventListener('resize',()=>chart.resize());

// 点击显示详情
chart.on('click',p=>{
  if(p.dataType!=='node')return;
  const n=p.data.name;const t=p.data.type;
  document.getElementById('detailSection').style.display='block';
  document.getElementById('detailTitle').textContent=n+' · '+(t==='scholar'?'儒者':t==='concept'?'概念':t==='school'?'学派':'典籍');
  let html='';
  if(t==='concept'&&CONCEPTS[n]){
    const c=CONCEPTS[n];
    html=`<div style="font-size:15px;color:var(--ink-2);line-height:2;margin-bottom:12px">${c.def}</div>`;
    html+=`<div style="font-size:13px;color:var(--ink-3);margin-bottom:12px">${c.source}</div>`;
    if(CONCEPT_EVOLUTIONS[n]){
      html+=`<h4 style="color:var(--gold);letter-spacing:2px;margin:12px 0 8px;font-size:14px">历代诠释</h4>`;
      html+=CONCEPT_EVOLUTIONS[n].map(e=>`<div style="padding:8px 0;border-top:1px dashed var(--line-soft);font-size:13px;color:var(--ink-2);line-height:1.9"><span style="color:var(--zhu);font-size:11px;letter-spacing:2px;margin-right:8px">${e.era}</span>${e.text}</div>`).join('');
    }
  }else if(t==='scholar'&&SCHOLARS[n]){
    const s=SCHOLARS[n];
    html=`<div style="font-size:15px;color:var(--ink-2);line-height:2">${s.desc||s.dynasty}</div>`;
  }else if(t==='school'&&SCHOOLS[n]){
    html=`<div style="font-size:15px;color:var(--ink-2);line-height:2">${SCHOOLS[n].desc}</div>`;
  }else if(t==='classic'&&CLASSIC_ONTOLOGY[n]){
    html=`<div style="font-size:15px;color:var(--ink-2);line-height:2">${CLASSIC_ONTOLOGY[n].desc}</div>`;
  }
  // 邻居
  const neighbors=new Set();
  edges.forEach(e=>{
    if(e.source===n&&nodeSet.has(e.target))neighbors.add(e.target);
    if(e.target===n&&nodeSet.has(e.source))neighbors.add(e.source);
  });
  if(neighbors.size){
    html+=`<h4 style="color:var(--gold);letter-spacing:2px;margin:16px 0 8px;font-size:14px">关联节点（${neighbors.size}）</h4>`;
    html+=`<div style="display:flex;flex-wrap:wrap;gap:6px">${[...neighbors].map(nn=>{
      const nm=nodeMap[nn];if(!nm)return '';
      return `<a href="javascript:;" onclick="focusNode('${nn}')" style="font-size:12px;padding:4px 10px;background:var(--chip-bg);color:${TYPE_COLOR[nm.type]};border-radius:3px;letter-spacing:1px">${nn}</a>`;
    }).join('')}</div>`;
  }
  document.getElementById('detailBody').innerHTML=html;
});
function focusNode(n){chart.dispatchAction({type:'focusNodeAdjacency',seriesIndex:0,name:n});chart.dispatchAction({type:'highlight',seriesIndex:0,name:n})}
</script>
</body>
</html>

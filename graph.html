<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>儒學本體圖譜 | 儒藏本体論</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style/common.css">
  <style>
    body {
      overflow: hidden;
    }
    .graph-container {
      position: fixed;
      top: 60px;
      left: 180px;
      right: 0;
      bottom: 0;
      overflow: hidden;
    }
    #graphCanvas {
      width: 100%;
      height: 100%;
    }
    .graph-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 320px;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      z-index: 10;
    }
    .graph-panel::-webkit-scrollbar {
      width: 0;
    }
    .graph-panel h3 {
      color: var(--accent-gold);
      margin: 0 0 8px 0;
      font-size: 20px;
    }
    .graph-panel .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .tag.concept { background: rgba(212,175,55,0.2); color: var(--accent-gold); }
    .tag.person { background: rgba(150,100,200,0.2); color: #a78bfa; }
    .tag.school { background: rgba(80,180,120,0.2); color: #4ade80; }
    .tag.book { background: rgba(80,150,220,0.2); color: #60a5fa; }
    .graph-panel .def {
      color: var(--text-secondary);
      line-height: 1.8;
      font-size: 14px;
      margin-bottom: 12px;
    }
    .graph-panel .meta {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.8;
    }
    .graph-panel .meta span {
      color: var(--text-primary);
    }
    .graph-panel .jump-btn {
      width: 100%;
      padding: 10px;
      background: var(--accent-gold);
      color: #1a1308;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;
    }
    .graph-panel .jump-btn:hover {
      filter: brightness(1.1);
    }
    .graph-panel .related-title {
      font-size: 14px;
      color: var(--accent-gold);
      margin: 12px 0 8px 0;
    }
    .graph-panel .related-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .related-item {
      padding: 4px 10px;
      border-radius: 16px;
      background: rgba(212,175,55,0.1);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .related-item:hover {
      background: var(--accent-gold);
      color: #1a1308;
    }
    .graph-legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      z-index: 10;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .legend-item:last-child { margin-bottom: 0; }
    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .legend-dot.concept { background: var(--accent-gold); }
    .legend-dot.person { background: #a78bfa; }
    .legend-dot.school { background: #4ade80; }
    .legend-dot.book { background: #60a5fa; }
    .graph-tip {
      position: absolute;
      top: 20px;
      left: 20px;
      color: var(--text-muted);
      font-size: 13px;
      z-index: 10;
    }
    @media (max-width: 768px) {
      .graph-container {
        left: 0;
      }
      .graph-panel {
        width: calc(100% - 40px);
        right: 20px;
        bottom: 20px;
        top: auto;
        max-height: 40vh;
      }
      .graph-legend {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header class="top-nav">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <div class="logo">儒藏本體論 · Confucian Canon</div>
    <nav class="top-nav-links" id="topNav"></nav>
    <div class="nav-right">
      <button class="nav-btn" id="fontSizeBtn" onclick="toggleFontSize()">字號 中</button>
      <button class="nav-btn" id="verticalBtn" onclick="toggleVertical()">豎排</button>
    </div>
  </header>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="graph-container">
    <canvas id="graphCanvas"></canvas>
    <div class="graph-tip">拖拽節點移動 · 滾輪縮放 · 點擊節點查看詳情</div>
    <div class="graph-legend">
      <div class="legend-item"><div class="legend-dot concept"></div>核心概念</div>
      <div class="legend-item"><div class="legend-dot person"></div>儒者人物</div>
      <div class="legend-item"><div class="legend-dot school"></div>学派流派</div>
      <div class="legend-item"><div class="legend-dot book"></div>典籍著作</div>
    </div>
    <div class="graph-panel" id="graphPanel" style="display: none;">
      <h3 id="panelTitle"></h3>
      <span class="tag" id="panelTag"></span>
      <div class="def" id="panelDef"></div>
      <div class="meta" id="panelMeta"></div>
      <button class="jump-btn" id="jumpBtn" style="display: none;">跳轉到相關典籍</button>
      <div class="related-title" id="relatedTitle" style="display: none;">關聯節點</div>
      <div class="related-list" id="relatedList"></div>
    </div>
  </div>

  <script src="data/common.js"></script>
  <script src="data/ontology.js"></script>
  <script>
    initPage();
    renderSidebar();
    renderTopNav();
    initTheme();

    // ========== 力导向图实现 ==========
    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');
    let nodes = [], links = [], selectedNode = null;
    let width = canvas.offsetWidth, height = canvas.offsetHeight;
    const nodeColors = {
      concept: '#d4af37',
      person: '#a78bfa',
      school: '#4ade80',
      book: '#60a5fa'
    };

    // 构建图谱节点与边
    function buildGraph() {
      nodes = []; links = [];
      const nodeMap = new Map();

      // 添加概念节点
      Object.entries(ONTOLOGY.concepts).forEach(([name, data], i) => {
        const node = {
          id: 'concept_' + name,
          name,
          type: 'concept',
          data,
          x: width/2 + (Math.random()-0.5)*300,
          y: height/2 + (Math.random()-0.5)*300,
          vx: 0, vy: 0,
          r: name.length <= 2 ? 28 : 22
        };
        nodes.push(node);
        nodeMap.set(node.id, node);
      });

      // 添加人物节点
      Object.entries(ONTOLOGY.persons).forEach(([name, data], i) => {
        const node = {
          id: 'person_' + name,
          name,
          type: 'person',
          data,
          x: width/2 + (Math.random()-0.5)*400,
          y: height/2 + (Math.random()-0.5)*400,
          vx: 0, vy: 0,
          r: 30
        };
        nodes.push(node);
        nodeMap.set(node.id, node);
        // 关联思想（概念）
        if (data.ideas) {
          data.ideas.forEach(idea => {
            const targetId = 'concept_' + idea;
            if (nodeMap.has(targetId)) {
              links.push({source: node.id, target: targetId});
            }
          });
        }
      });

      // 添加学派节点
      Object.entries(ONTOLOGY.schools).forEach(([name, data], i) => {
        const node = {
          id: 'school_' + name,
          name,
          type: 'school',
          data,
          x: width/2 + (Math.random()-0.5)*450,
          y: height/2 + (Math.random()-0.5)*450,
          vx: 0, vy: 0,
          r: 34
        };
        nodes.push(node);
        nodeMap.set(node.id, node);
        // 关联创始人
        if (data.founder) {
          const founderId = 'person_' + data.founder;
          if (nodeMap.has(founderId)) {
            links.push({source: node.id, target: founderId});
          }
        }
        // 关联核心思想
        if (data.core_ideas) {
          data.core_ideas.forEach(idea => {
            const targetId = 'concept_' + idea;
            if (nodeMap.has(targetId)) {
              links.push({source: node.id, target: targetId});
            }
          });
        }
      });

      // 添加典籍节点
      Object.entries(ONTOLOGY.books).forEach(([name, data], i) => {
        const node = {
          id: 'book_' + name,
          name,
          type: 'book',
          data,
          x: width/2 + (Math.random()-0.5)*500,
          y: height/2 + (Math.random()-0.5)*500,
          vx: 0, vy: 0,
          r: 26
        };
        nodes.push(node);
        nodeMap.set(node.id, node);
        // 关联作者
        if (data.author) {
          const authors = data.author.split('/');
          authors.forEach(a => {
            a = a.replace(/（.*?）/g, '');
            const authorId = 'person_' + a;
            if (nodeMap.has(authorId)) {
              links.push({source: node.id, target: authorId});
            }
          });
        }
        // 关联核心思想
        if (data.core_ideas) {
          data.core_ideas.forEach(idea => {
            const targetId = 'concept_' + idea;
            if (nodeMap.has(targetId)) {
              links.push({source: node.id, target: targetId});
            }
          });
        }
      });

      // 添加概念之间的关联
      Object.entries(ONTOLOGY.concepts).forEach(([name, data]) => {
        if (data.related) {
          data.related.forEach(rel => {
            const sourceId = 'concept_' + name;
            const targetId = 'concept_' + rel;
            if (nodeMap.has(targetId) && !links.find(l => (l.source === sourceId && l.target === targetId) || (l.source === targetId && l.target === sourceId))) {
              links.push({source: sourceId, target: targetId});
            }
          });
        }
      });

      // 把边转为节点引用
      links.forEach(l => {
        l.source = nodeMap.get(l.source);
        l.target = nodeMap.get(l.target);
      });
    }

    // 力导向模拟
    function simulate() {
      // 斥力
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i+1; j < nodes.length; j++) {
          const a = nodes[i], b = nodes[j];
          let dx = b.x - a.x, dy = b.y - a.y;
          let dist = Math.sqrt(dx*dx + dy*dy) || 1;
          let force = 8000 / (dist * dist);
          let fx = dx/dist * force;
          let fy = dy/dist * force;
          a.vx -= fx; a.vy -= fy;
          b.vx += fx; b.vy += fy;
        }
      }
      // 引力（边）
      links.forEach(l => {
        let dx = l.target.x - l.source.x, dy = l.target.y - l.source.y;
        let dist = Math.sqrt(dx*dx + dy*dy) || 1;
        let force = (dist - 100) * 0.02;
        let fx = dx/dist * force;
        let fy = dy/dist * force;
        l.source.vx += fx; l.source.vy += fy;
        l.target.vx -= fx; l.target.vy -= fy;
      });
      // 中心引力
      nodes.forEach(n => {
        n.vx += (width/2 - n.x) * 0.001;
        n.vy += (height/2 - n.y) * 0.001;
        // 阻尼
        n.vx *= 0.9;
        n.vy *= 0.9;
        n.x += n.vx;
        n.y += n.vy;
        // 边界
        n.x = Math.max(n.r, Math.min(width - n.r, n.x));
        n.y = Math.max(n.r, Math.min(height - n.r, n.y));
        // 选中节点固定
        if (n === selectedNode) {
          n.x = dragPos.x;
          n.y = dragPos.y;
        }
      });
    }

    // 渲染
    function render() {
      ctx.clearRect(0, 0, width, height);
      // 画边
      ctx.strokeStyle = 'rgba(212,175,55,0.15)';
      ctx.lineWidth = 1;
      links.forEach(l => {
        ctx.beginPath();
        ctx.moveTo(l.source.x, l.source.y);
        ctx.lineTo(l.target.x, l.target.y);
        ctx.stroke();
      });
      // 画节点
      nodes.forEach(n => {
        // 节点光晕
        if (n === selectedNode) {
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r + 8, 0, Math.PI*2);
          ctx.fillStyle = nodeColors[n.type] + '40';
          ctx.fill();
        }
        // 节点圆
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
        ctx.fillStyle = nodeColors[n.type];
        ctx.fill();
        // 节点文字
        ctx.fillStyle = '#1a1308';
        ctx.font = n.type === 'school' ? '13px system-ui' : '14px system-ui';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(n.name, n.x, n.y);
      });
      simulate();
      requestAnimationFrame(render);
    }

    // ========== 交互 ==========
    let dragNode = null, dragPos = {x:0, y:0}, scale = 1, offset = {x:0, y:0};
    function resize() {
      const dpr = window.devicePixelRatio || 1;
      width = canvas.offsetWidth;
      height = canvas.offsetHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();
    buildGraph();
    render();

    // 坐标转换
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left - offset.x) / scale,
        y: (e.clientY - rect.top - offset.y) / scale
      };
    }

    canvas.addEventListener('mousedown', e => {
      const pos = getPos(e);
      dragNode = nodes.find(n => {
        const dx = n.x - pos.x, dy = n.y - pos.y;
        return dx*dx + dy*dy < n.r*n.r;
      });
      if (dragNode) {
        selectedNode = dragNode;
        showPanel(dragNode);
      }
    });
    canvas.addEventListener('mousemove', e => {
      if (dragNode) {
        dragPos = getPos(e);
      }
    });
    canvas.addEventListener('mouseup', () => {
      dragNode = null;
    });
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.9 : 1.1;
      scale *= delta;
      scale = Math.max(0.5, Math.min(2, scale));
      ctx.setTransform(scale, 0, 0, scale, offset.x, offset.y);
    }, {passive: false});

    // 显示详情面板
    function showPanel(node) {
      const panel = document.getElementById('graphPanel');
      panel.style.display = 'block';
      document.getElementById('panelTitle').textContent = node.name;
      const tag = document.getElementById('panelTag');
      tag.className = 'tag ' + node.type;
      const typeNames = {concept:'核心概念', person:'儒者人物', school:'学派流派', book:'典籍著作'};
      tag.textContent = typeNames[node.type];

      const def = document.getElementById('panelDef');
      const meta = document.getElementById('panelMeta');
      const jumpBtn = document.getElementById('jumpBtn');
      const relatedList = document.getElementById('relatedList');
      const relatedTitle = document.getElementById('relatedTitle');
      relatedList.innerHTML = '';
      relatedTitle.style.display = 'none';
      jumpBtn.style.display = 'none';

      let metaHTML = '';
      if (node.type === 'concept') {
        def.textContent = node.data.def;
        metaHTML += `<div>提出者：<span>${node.data.founder}</span></div>`;
        metaHTML += `<div>所属学派：<span>${node.data.school}</span></div>`;
        metaHTML += `<div>出处：<span>${node.data.source}</span></div>`;
        // 跳转
        jumpBtn.style.display = 'block';
        jumpBtn.textContent = `打開 ${node.data.book} - ${node.data.chapter}`;
        jumpBtn.onclick = () => {
          const cat = node.data.book === '论语' || node.data.book === '孟子' || node.data.book === '大学' || node.data.book === '中庸' ? '四书' : '';
          window.location.href = `reader.html?b=${encodeURIComponent(cat + '/' + node.data.book + '.txt')}&anchor=${encodeURIComponent(node.data.chapter)}`;
        };
      } else if (node.type === 'person') {
        def.textContent = node.data.bio;
        metaHTML += `<div>年代：<span>${node.data.era}</span></div>`;
        metaHTML += `<div>头衔：<span>${node.data.title}</span></div>`;
        metaHTML += `<div>所属学派：<span>${node.data.school}</span></div>`;
        if (node.data.works) {
          metaHTML += `<div>代表著作：<span>${node.data.works.join('、')}</span></div>`;
        }
        // 关联节点
        if (node.data.ideas) {
          relatedTitle.style.display = 'block';
          node.data.ideas.forEach(idea => {
            const item = document.createElement('div');
            item.className = 'related-item';
            item.textContent = idea;
            item.onclick = () => {
              const n = nodes.find(n => n.id === 'concept_' + idea);
              if (n) {selectedNode = n; showPanel(n);}
            };
            relatedList.appendChild(item);
          });
        }
      } else if (node.type === 'school') {
        def.textContent = node.data.desc;
        metaHTML += `<div>创始人：<span>${node.data.founder}</span></div>`;
        metaHTML += `<div>流行年代：<span>${node.data.era}</span></div>`;
        if (node.data.core_books) {
          metaHTML += `<div>核心典籍：<span>${node.data.core_books.join('、')}</span></div>`;
        }
      } else if (node.type === 'book') {
        def.textContent = node.data.desc;
        metaHTML += `<div>作者：<span>${node.data.author}</span></div>`;
        metaHTML += `<div>年代：<span>${node.data.era}</span></div>`;
        metaHTML += `<div>分类：<span>${node.data.category}</span></div>`;
        metaHTML += `<div>章节数：<span>${node.data.chapters_count}章/卷</span></div>`;
        jumpBtn.style.display = 'block';
        jumpBtn.textContent = `打開 ${node.name}`;
        jumpBtn.onclick = () => {
          window.location.href = `reader.html?b=${encodeURIComponent(node.data.category + '/' + node.name + '.txt')}`;
        };
      }
      meta.innerHTML = metaHTML;

      // 通用关联
      const relatedNodes = links.filter(l => l.source === node || l.target === node).map(l => l.source === node ? l.target : l.source).filter(n => n !== node);
      relatedNodes.forEach(n => {
        if (relatedList.querySelector(`[data-id="${n.id}"]`)) return;
        const item = document.createElement('div');
        item.className = 'related-item';
        item.dataset.id = n.id;
        item.textContent = n.name;
        item.onclick = () => {
          selectedNode = n; showPanel(n);
        };
        relatedList.appendChild(item);
      });
      if (relatedNodes.length > 0) relatedTitle.style.display = 'block';
    }

    // 主题切换适配
    const observer = new MutationObserver(() => {
      // 颜色由CSS变量自动处理
    });
    observer.observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});
  </script>
</body>
</html>
